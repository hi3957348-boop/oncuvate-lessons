<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>문장구조와 문법 1회 — 문장의 주인공과 은/는·이/가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===== 온큐베이트 기본: 토큰 ===== */
:root{
  --oc-violet-950:#24144f; --oc-violet-900:#35206f; --oc-violet-800:#4b24a5; --oc-violet-700:#5932b6;
  --oc-violet-500:#8d70d7; --oc-violet-200:#d9cff5; --oc-violet-100:#eee9fb; --oc-violet-050:#f8f6fd;
  --oc-cyan:#4bc9dc; --oc-cyan-soft:#e9f8fa; --oc-blue:#2785c7; --oc-blue-soft:#edf5fb; --oc-gold:#e1b72c;
  --oc-ink:#27344e; --oc-muted:#6f7789; --oc-paper:#fffdf7;
  --oc-success:#27866a; --oc-success-bg:#eef9f5; --oc-danger:#c2575d; --oc-danger-bg:#fff3f3;
  --warm-canvas:#f3f5f2; --warm-light:#fbfaff; --warm-soft:#f8f6fd; --warm-line:#e7e3ef; --warm-deep:#566077;
  --panel-line:rgba(224,218,236,.92);
  --shadow:0 18px 48px rgba(37,20,78,.09);
  --font:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
button,textarea,input{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid rgba(75,201,220,.55);outline-offset:3px}
.page,.sidebar,.actionbar,button,textarea,input{word-break:keep-all;line-break:strict}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{display:grid;place-items:center;color:var(--oc-ink);font-family:var(--font);
  background:radial-gradient(circle at 8% 0%,rgba(75,201,220,.07),transparent 28%),linear-gradient(145deg,#f7f8f5,#f1f3f0 62%,#f5f4f1)}

/* ===== 셸: 1200×555 스튜디오 = 190px 사이드바 + 활동창 ===== */
.studio{position:relative;width:min(1200px,100vw);height:min(555px,100vh);display:grid;
  grid-template-columns:190px minmax(0,1fr);gap:10px;transition:grid-template-columns .22s ease}
.sidebar,.workspace{height:100%;min-height:0;border:1px solid rgba(224,218,236,.9);
  background:rgba(255,253,247,.94);box-shadow:0 18px 48px rgba(37,45,81,.12)}
.sidebar{position:relative;display:flex;flex-direction:column;padding:10px 10px 12px;border-radius:20px;z-index:58;
  transition:opacity .18s ease,transform .22s ease}
.brand-wrap{min-height:74px;margin:0 0 6px;padding:2px 7px 7px;border-bottom:1px solid rgba(226,222,235,.78);text-align:center}
.brand-logo{display:block;width:108px;height:28px;margin:0 auto;object-fit:contain}
.brand-text{display:block;height:28px;color:var(--oc-violet-800);font-size:17px;font-weight:900;line-height:28px}
.brand-wrap p{margin:7px -1px 0;padding:6px 7px;border-radius:9px;color:#6b5bb0;background:rgba(124,106,190,.09);font-size:12px;line-height:1.2}
.step-nav{display:grid;gap:3px;align-content:start;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.step-link{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;min-height:58px;padding:7px 6px;
  border:1px solid transparent;border-radius:12px;color:#5b5562;text-align:left;background:transparent;transition:background .18s,border-color .18s}
.step-link:hover{background:var(--oc-violet-050)}
.step-link.active{color:var(--oc-ink);border-color:var(--oc-violet-200);background:linear-gradient(135deg,#f5f2fc,#f2faf9)}
.step-link b{display:block;font-size:13px;font-weight:850}
.step-link small{display:block;margin-top:2px;color:#817a87;font-size:9px;font-weight:650;line-height:1.25}
.step-no{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--oc-violet-200);border-radius:10px;
  color:var(--oc-violet-800);background:#fff;font-size:13px;font-weight:900}
.step-link.active .step-no{color:#fff;border-color:var(--oc-violet-800);background:var(--oc-violet-800)}
.sidebar-edge-toggle{position:absolute;z-index:76;left:168px;top:50%;width:44px;height:44px;padding:0;display:grid;place-items:center;
  transform:translateY(-50%);border:1px solid rgba(197,203,218,.96);border-radius:999px;color:#506079;background:rgba(255,254,251,.98);
  box-shadow:0 8px 22px rgba(37,43,67,.13);font:850 18px/1 var(--font);transition:left .22s ease,background .16s}
.sidebar-edge-toggle:hover{color:var(--oc-violet-900);background:var(--oc-violet-050)}
.studio.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}
.studio.sidebar-collapsed .sidebar{opacity:0;transform:translateX(calc(-100% - 12px));padding-inline:0;pointer-events:none}
.studio.sidebar-collapsed>.sidebar-edge-toggle{left:2px}

.workspace{position:relative;min-width:0;overflow:hidden;border-radius:22px;background:linear-gradient(155deg,#f8f8f5,#f2f4f1 70%,#f7f6f2)}
.progress-rail{position:absolute;z-index:72;top:0;left:0;width:100%;height:3px;overflow:hidden;background:#e4e2dc}
.progress-rail span{display:block;width:0;height:100%;border-radius:0 5px 5px 0;background:linear-gradient(90deg,var(--oc-violet-800),var(--oc-cyan));transition:width .25s ease}
.stage{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.stage::-webkit-scrollbar{width:10px}
.stage::-webkit-scrollbar-thumb{border:3px solid transparent;border-radius:10px;background:#cdd1d2;background-clip:padding-box}
.page{display:none;width:100%;min-height:100%;padding:26px clamp(24px,3vw,43px) 78px;animation:page-in .22s ease}
.page.active{display:block}
@keyframes page-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 하단 오버레이 액션바: 도와주세요 · 단계 점 · 이전/다음 */
.actionbar{position:absolute;z-index:70;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;
  padding:9px 14px 10px;border-radius:0 0 22px 22px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,253,247,0),rgba(255,253,247,.87) 38%,rgba(255,253,247,.97))}
.actionbar>*,.actionbar button{pointer-events:auto}
.help-button,.back-button{min-height:42px;padding:0 15px;border:1px solid var(--warm-line);border-radius:12px;color:#5f5864;background:#fff;font-size:12px;font-weight:850}
.help-button{justify-self:start;display:flex;align-items:center;gap:7px}
.help-button span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;background:var(--oc-violet-800)}
.step-dots{display:flex;gap:7px}
.step-dots button{width:8px;height:8px;padding:0;border:0;border-radius:9px;background:#d8cfc4;transition:width .2s,background .2s}
.step-dots button.active{width:25px;background:var(--oc-violet-800)}
.nav-actions{justify-self:end;display:flex;gap:8px}
.primary,.next-button{min-height:44px;padding:0 20px;border:0;border-radius:12px;color:#fff;font-weight:900;
  background:linear-gradient(135deg,var(--oc-violet-800),var(--oc-violet-500));box-shadow:0 10px 22px rgba(75,36,165,.20)}
.primary:hover,.next-button:hover{background:var(--oc-violet-700)}
.primary:disabled{cursor:not-allowed;opacity:.45;box-shadow:none}
.back-button:disabled,.next-button:disabled{cursor:not-allowed;opacity:.4}
.next-button{min-width:88px}
.primary.wide{width:100%}

/* ===== 카드와 배지 ===== */
.activity-card,.passage-card{border:1px solid var(--panel-line);border-radius:20px;background:rgba(255,253,247,.98);box-shadow:var(--shadow)}
.activity-card{padding:18px 20px}
.passage-card{padding:22px 26px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prompt-label{display:inline-flex;padding:6px 9px;border-radius:9px;color:var(--oc-violet-800);background:var(--oc-violet-100);font-size:11px;font-weight:900}
.counter{display:inline-flex;padding:6px 11px;border:1px solid var(--warm-line);border-radius:9px;color:#385f76;background:var(--oc-cyan-soft);font-size:12px;font-weight:850}
.activity-card h2{margin:10px 0 4px;font-size:clamp(22px,2vw,26px);line-height:1.35;letter-spacing:-.035em;text-wrap:balance}
.support-copy{margin:0 0 12px;color:var(--oc-muted);font-size:12px;line-height:1.45}
.mini-progress{height:6px;margin:3px 0 12px;overflow:hidden;border-radius:9px;background:#e8e3d9}
.mini-progress span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--oc-violet-800),var(--oc-cyan))}

/* 레이아웃: 그림/지문(왼쪽 넓게) + 활동/코치(오른쪽) */
.two-col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:center;min-height:100%}
.page.fill.active{display:flex;flex-direction:column;height:100%;min-height:0}
.split{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(286px,.66fr);gap:18px;flex:1 1 auto;min-height:0;align-items:stretch}
.split>.passage-card{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.visual{width:min(100%,430px);aspect-ratio:1;justify-self:center;overflow:hidden;border:1px solid #e1d5c3;border-radius:24px;background:#fffaf0;box-shadow:var(--shadow)}
.visual img{display:block;width:100%;height:100%;object-fit:cover}
.passage-top{display:flex;align-items:center;gap:10px}
.passage-top strong{font-size:15px}
.passage-text{margin-top:14px}
.passage-text p{margin:0 0 15px;font-size:16px;font-weight:540;line-height:1.72;word-break:keep-all}

/* 한 낱말/한 문장 크게 보여 주는 무대 */
.word-stage{position:relative;display:grid;place-items:center;min-height:112px;padding:14px;overflow:hidden;border:1px solid var(--warm-line);border-radius:16px;
  background:linear-gradient(155deg,#fff,var(--oc-violet-050) 55%,var(--oc-cyan-soft))}
.word-stage strong{font-size:clamp(31px,3.4vw,45px);font-weight:900;letter-spacing:-.04em}

/* 선택지: 2지선다 큰 버튼 / 목록형 */
.choice-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice-pair button{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;border:1px solid var(--warm-line);border-radius:14px;background:#fff;font-size:14px;font-weight:800;color:var(--oc-ink)}
.choice-pair button .sym{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-weight:900}
.choice-pair .yes .sym{color:#1f6f80;background:var(--oc-cyan-soft)}
.choice-pair .no .sym{color:#8a6a45;background:#f3ebdf}
.option-list{display:grid;gap:9px;margin-top:12px}
.option-list button{display:grid;grid-template-columns:32px 1fr;gap:11px;align-items:center;width:100%;min-height:54px;padding:10px 13px;
  border:1px solid var(--warm-line);border-radius:14px;color:var(--oc-ink);background:#fff;text-align:left;font-size:14px;font-weight:720;line-height:1.45}
.option-list button>span{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;color:var(--oc-violet-800);background:var(--oc-violet-100);font-size:12px;font-weight:900}
.choice-pair button:hover,.option-list button:hover{border-color:var(--oc-violet-200);background:var(--oc-violet-050)}
.option-list button.selected{border-color:var(--oc-violet-500);background:var(--oc-violet-050)}
.option-list button.correct{border-color:#9dd8c1;background:var(--oc-success-bg)}
.option-list button.wrong{border-color:#efb6b8;background:var(--oc-danger-bg)}
.inline-feedback{min-height:42px;margin-top:12px;padding:11px 13px;border-radius:12px;color:#6d6673;background:var(--warm-soft);font-size:13px;font-weight:720;line-height:1.5}
.inline-feedback.success{color:#247354;background:var(--oc-success-bg)}
.inline-feedback.attention{color:#a34b4e;background:var(--oc-danger-bg)}

/* 젤리코치 대화 패널: 헤더에 캐릭터 한 번, 현재 안내 한 가지 */
.coach{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--panel-line);border-radius:20px;background:var(--oc-paper);box-shadow:var(--shadow)}
.coach-head{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--warm-line);background:var(--oc-cyan-soft)}
.coach-head img{width:48px;height:48px;object-fit:contain}
.coach-head strong{font-size:15px}
.coach-scroll{flex:1 1 auto;min-height:0;padding:14px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--oc-violet-200) transparent}
.coach-msg{padding:12px 13px;border:1px solid rgba(44,183,203,.28);border-radius:7px 15px 15px 15px;color:#43536a;background:var(--oc-cyan-soft);font-size:13px;font-weight:720;line-height:1.55}
.coach-msg p{margin:0}
.coach-msg b{color:var(--oc-violet-800)}
.coach>.primary{margin:0 14px 14px}

/* 완료 도장 */
.complete{display:grid;place-items:center;gap:8px;padding:26px;text-align:center}
.complete .stamp{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;color:#fff;background:#2f8a68;font-size:26px;font-weight:950}

.toast{position:fixed;z-index:100;left:50%;bottom:26px;max-width:min(520px,calc(100vw - 32px));padding:12px 16px;border-radius:13px;color:#fff;background:#403a46;
  box-shadow:0 15px 36px rgba(28,24,33,.23);font-size:13px;font-weight:750;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.rights{position:fixed;left:0;right:0;bottom:3px;color:rgba(83,75,88,.42);font-size:8px;text-align:center;pointer-events:none}

/* ===== 반응형 ===== */
@media (min-width:900px) and (max-width:1179px){
  .studio{width:100vw;height:100vh;grid-template-columns:clamp(150px,16vw,170px) minmax(0,1fr)}
  .studio>.sidebar-edge-toggle{left:calc(clamp(150px,16vw,170px) - 22px)}
}
@media (max-width:899px){
  .studio,.studio.sidebar-collapsed{width:100vw;height:100vh;grid-template-columns:minmax(0,1fr);gap:0}
  .workspace{grid-column:1;border-radius:0}
  .sidebar,.studio.sidebar-collapsed .sidebar{position:fixed;z-index:75;inset:0 auto 0 0;width:min(280px,82vw);border-radius:0 18px 18px 0;opacity:0;transform:translateX(calc(-100% - 20px));pointer-events:none}
  .sidebar.open{opacity:1;transform:none;pointer-events:auto}
  .sidebar-edge-toggle,.studio.sidebar-collapsed>.sidebar-edge-toggle{position:fixed;left:2px}
  .page{padding:20px 18px 72px}
  .two-col,.split{grid-template-columns:1fr;height:auto}
  .actionbar{border-radius:0}
}
@media (max-width:620px){
  .page{padding:16px 12px 68px}
  .actionbar{grid-template-columns:auto 1fr auto;height:60px;padding:7px 9px 8px}
  .help-button{width:43px;padding:0;justify-content:center;font-size:0}
  .step-dots{justify-content:center}
  .choice-pair{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{height:auto;overflow:visible}
  .studio,.workspace,.stage{display:block;width:auto;height:auto;overflow:visible}
  .sidebar,.sidebar-edge-toggle,.progress-rail,.actionbar,.toast,.rights{display:none!important}
  .page{display:block!important;break-after:page;padding:15mm}
}
/* ===== 문장구조·문법 1회: 수업 전용 ===== */
:root{
  --sx-subject:#d6585c;      /* 문장의 주인공: 빨간 동그라미 */
  --sx-pred:#2785c7;         /* 끝 말: 파란 밑줄 */
  --sx-mark:#fde9a6;         /* 조사: 형광펜 */
}
.work{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.62fr);gap:16px;flex:1 1 auto;min-height:0}
.work>.activity-card{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--oc-violet-200) transparent}
.coach .coach-msg+.coach-msg{margin-top:10px}
.coach-msg.hint{border-color:rgba(141,112,215,.35);background:var(--oc-violet-050)}
.coach-msg.hint::before{content:"힌트";display:block;margin-bottom:3px;color:var(--oc-violet-800);font-size:10px;font-weight:900}
.card-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:auto;padding-top:10px}
.level-tag{display:inline-flex;padding:5px 8px;border-radius:8px;color:#566077;background:#f1efe9;font-size:11px;font-weight:850}

/* 조사 형광펜, 주인공·끝 말 표시 */
.pt{padding:0 1px;border-radius:3px;background:linear-gradient(transparent 50%,var(--sx-mark) 50%);color:inherit}
.subj{padding:0 4px;border:2px solid var(--sx-subject);border-radius:999px}
.pred-move{text-decoration:underline 3px var(--sx-pred);text-underline-offset:6px}
.pred-state{text-decoration:underline wavy 2px var(--sx-pred);text-underline-offset:6px}
.pred-what{text-decoration:underline dotted 3px var(--sx-pred);text-underline-offset:6px}

/* 문장 기차 */
.train{display:flex;align-items:flex-end;justify-content:center;gap:0;min-height:96px;margin:6px 0 2px}
.car{display:grid;justify-items:center;gap:6px}
.car .box{position:relative;min-width:120px;padding:12px 18px 16px;border:2px solid var(--warm-line);border-radius:14px;background:#fff;text-align:center;font-size:24px;font-weight:900;letter-spacing:-.03em}
.car .box::before,.car .box::after{content:"";position:absolute;bottom:-8px;width:13px;height:13px;border:2px solid #b9bfcc;border-radius:50%;background:#fff}
.car .box::before{left:18px}.car .box::after{right:18px}
.car small{color:var(--oc-muted);font-size:11px;font-weight:850}
.car.subject .box{border-color:var(--sx-subject)}
.car.pred .box{border-color:var(--sx-pred)}
.car.empty .box{color:#b7b2c2;border-style:dashed}
.link{width:22px;height:4px;margin:0 2px 30px;border-radius:4px;background:#c9cdd6}

/* 큰 문장 무대 */
.sent-stage{display:grid;place-items:center;min-height:92px;padding:14px 16px;border:1px solid var(--warm-line);border-radius:16px;
  background:linear-gradient(155deg,#fff,var(--oc-violet-050) 55%,var(--oc-cyan-soft));text-align:center}
.sent-stage p{margin:0;font-size:clamp(21px,2.2vw,27px);font-weight:850;line-height:1.55;letter-spacing:-.03em}
.sent-stage .ctx{display:block;margin-bottom:4px;color:var(--oc-muted);font-size:13px;font-weight:750}
.blank{display:inline-block;min-width:54px;margin:0 2px;border-bottom:3px solid var(--oc-violet-500);color:var(--oc-violet-800)}

/* 선택 버튼 줄 */
.chip-row{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:9px;margin-top:12px}
.chip-row button{min-height:52px;padding:8px 10px;border:1px solid var(--warm-line);border-radius:14px;color:var(--oc-ink);background:#fff;font-size:17px;font-weight:850}
.chip-row button small{display:block;margin-top:2px;color:var(--oc-muted);font-size:10.5px;font-weight:700}
.chip-row button:hover{border-color:var(--oc-violet-200);background:var(--oc-violet-050)}
.chip-row button.correct,.pair-list button.correct,.token.correct{border-color:#9dd8c1;background:var(--oc-success-bg)}
.chip-row button.wrong,.pair-list button.wrong,.token.wrong{border-color:#efb6b8;background:var(--oc-danger-bg)}
.chip-row button:disabled,.pair-list button:disabled{cursor:default}

/* 짝 문장 */
.pair-list{display:grid;gap:10px;margin-top:12px}
.pair-list button{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;min-height:62px;padding:10px 14px;border:1px solid var(--warm-line);border-radius:14px;
  color:var(--oc-ink);background:#fff;text-align:left;font-size:18px;font-weight:800;line-height:1.5}
.pair-list button>span:first-child{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--oc-violet-800);background:var(--oc-violet-100);font-size:13px;font-weight:900}
.pair-list button:hover{border-color:var(--oc-violet-200);background:var(--oc-violet-050)}
.rule-pop{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 13px;border:1px solid rgba(44,183,203,.28);border-radius:12px;background:var(--oc-cyan-soft);font-size:14px;font-weight:800}

/* 교정: 낱말 토큰 */

.frame input{width:100%;min-height:46px;padding:0 13px;border:1px solid var(--warm-line);border-radius:12px;background:#fff;color:var(--oc-ink);font-size:16px;font-weight:700}

.mini-pick{display:inline-flex;gap:4px}

.mini-pick button.wrong{border-color:#efb6b8;background:var(--oc-danger-bg)}
.pair-block{padding:10px 12px;border:1px solid var(--warm-line);border-radius:14px;background:#fff;margin-top:10px}

/* 정리 */
.check-list{display:grid;gap:7px;margin-top:10px}

.check-list input:checked+i::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.my-sentences{display:grid;gap:7px;margin-top:10px}
.my-sentences button{min-height:46px;padding:8px 12px;border:1px solid var(--warm-line);border-radius:12px;background:#fff;color:var(--oc-ink);text-align:left;font-size:15px;font-weight:780}
.my-sentences button.on{border-color:var(--oc-violet-500);background:var(--oc-violet-050)}
.my-sentences button.on::after{content:"  ★ 오늘의 문장";color:var(--oc-violet-800);font-size:11px;font-weight:900}
.empty-note{padding:12px;border:1px dashed var(--warm-line);border-radius:12px;color:var(--oc-muted);font-size:13px;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.metrics div{padding:10px 6px;border:1px solid var(--warm-line);border-radius:12px;background:#fff;text-align:center}
.metrics strong{display:block;color:var(--oc-violet-800);font-size:20px;font-weight:900}
.metrics span{color:var(--oc-muted);font-size:10.5px;font-weight:800}
.done-panel{display:grid;place-items:center;gap:6px;min-height:100%;padding:18px;text-align:center}
.done-panel h2{margin:0}

@media (max-width:899px){

/* ===== 짝 문장: 가로 카드 두 장 + 젤리코치 반응 ===== */

.situation{display:flex;flex-direction:column;align-items:center;gap:5px;margin:10px auto 0;padding:10px 22px 12px;max-width:92%;
  border:2px solid #9fd9e3;border-radius:16px;background:var(--oc-cyan-soft);text-align:center}

#area2{position:relative}
.pair-h{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;perspective:900px}
.pair-h button{position:relative;display:grid;place-items:center;align-content:center;gap:8px;min-height:128px;padding:16px 14px;border:2px solid var(--warm-line);border-radius:18px;
  color:var(--oc-ink);background:#fff;font-size:20px;font-weight:850;line-height:1.5;text-align:center;box-shadow:0 8px 18px rgba(37,45,81,.07);
  transition:transform .18s,box-shadow .18s,opacity .3s,border-color .18s;animation:pc-in .45s cubic-bezier(.2,1.3,.4,1) both}
.pair-h button:nth-child(1){animation-name:pc-in-l}.pair-h button:nth-child(2){animation-name:pc-in-r;animation-delay:.08s}
@keyframes pc-in-l{from{opacity:0;transform:translateX(-40px) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes pc-in-r{from{opacity:0;transform:translateX(40px) rotate(6deg)}to{opacity:1;transform:none}}
.pair-h button:hover:not(:disabled){transform:translateY(-5px) rotate(-1deg);box-shadow:0 14px 24px rgba(37,45,81,.12);border-color:#9fd9e3}
.pair-h button>.tag{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;color:#385f76;background:var(--oc-cyan-soft);font-size:13px;font-weight:900}
.pair-h button.correct{border-color:#7cc9a8;background:var(--oc-success-bg);animation:pc-win .5s ease-out}
@keyframes pc-win{0%{transform:scale(1)}40%{transform:scale(1.06) rotate(1deg)}100%{transform:scale(1)}}
.pair-h button.wrong{border-color:#efb6b8;background:var(--oc-danger-bg);animation:pc-shake .45s ease-out}
@keyframes pc-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-2deg)}45%{transform:translateX(8px) rotate(2deg)}70%{transform:translateX(-4px)}}
.pair-h button.dim{opacity:.45}
.pair-h button:disabled{cursor:default}
.pair-h .spark{position:absolute;font-size:18px;pointer-events:none;animation:pc-spark .8s ease-out forwards}
@keyframes pc-spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
.jr{position:absolute;z-index:20;right:10px;bottom:6px;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:4px;pointer-events:none;opacity:0;transform:translate(0,60px)}
.jr img{display:block;height:156px;width:auto;transform-origin:50% 100%}
.jr-bubble{margin-bottom:96px;padding:9px 13px;border:2px solid #2e2848;border-radius:16px 16px 4px 16px;background:#fff;font-size:16px;font-weight:900;white-space:nowrap;
  transform-origin:100% 100%;animation:jr-bub .35s .12s cubic-bezier(.2,1.5,.4,1) both}
@keyframes jr-bub{from{transform:scale(0)}to{transform:scale(1)}}
.jr.show{animation:jr-life 1.9s ease-out forwards}
@keyframes jr-life{0%{opacity:0;transform:translate(0,60px)}12%{opacity:1;transform:translate(0,-10px)}20%{transform:translate(0,0)}82%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(0,50px)}}
.jr.cheer img{animation:jr-jump .38s .25s ease-in-out 3 alternate}
@keyframes jr-jump{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-18px) scale(.96,1.04) rotate(3deg)}}
.jr.thumbs img{animation:jr-wiggle .3s .25s ease-in-out 4 alternate}
@keyframes jr-wiggle{from{transform:rotate(-5deg)}to{transform:rotate(5deg) scale(1.04)}}
.jr.scold img{animation:jr-stomp .16s .2s ease-in-out 6 alternate}
@keyframes jr-stomp{from{transform:translateX(-4px) rotate(-4deg)}to{transform:translateX(4px) translateY(-5px) rotate(4deg) scale(1.05)}}
.jr.scold .jr-bubble{border-color:#c2575d;color:#a34b4e;font-size:18px;animation:jr-bub .35s .12s cubic-bezier(.2,1.5,.4,1) both,jr-shout .12s .5s 5 alternate}
@keyframes jr-shout{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.jr.think img{animation:jr-tilt 1.2s .2s ease-in-out}
.jr.cry img{animation:jr-sob .22s .2s ease-in-out 6 alternate}
@keyframes jr-sob{from{transform:translateY(0) scale(1,1)}to{transform:translateY(3px) scale(1.03,.97)}}
.jr.cry .jr-bubble{border-color:#6aa9d6;color:#2f6f9e}
.jr.cry::before{content:"💧";position:absolute;right:40px;top:30px;font-size:16px;animation:jr-drop .6s .3s ease-in 2}
@keyframes jr-drop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(26px)}}
@keyframes jr-tilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-6deg)}70%{transform:rotate(4deg)}}
.jr.think .jr-bubble{border-style:dashed;color:#566077}
.jr.cheer::before,.jr.thumbs::before{content:"✦ ★ ✧";position:absolute;right:28px;top:-6px;color:#e1b72c;font-size:18px;letter-spacing:6px;animation:jr-twinkle .5s .3s ease-in-out 3 alternate}
.jr.scold::before{content:"!!";position:absolute;right:6px;top:-2px;color:#c2575d;font-size:26px;font-weight:950;animation:jr-twinkle .16s .3s 6 alternate}
@keyframes jr-twinkle{from{opacity:.2;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
.sound-toggle{min-width:36px;min-height:32px;padding:0 9px;border:1px solid var(--warm-line);border-radius:9px;background:#fff;font-size:14px;color:#566077}

<body>
<main class="studio" id="studio">
  <aside class="sidebar" id="sidebar" aria-label="학습 순서">
    <div class="brand-wrap">
      <img src="assets/oncuvate-brand-logo.png" alt="Oncuvate" class="brand-logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand-text',textContent:'Oncuvate'}))">
      <p>문장의 주인공과<br>은/는·이/가</p>
    </div>
    <nav class="step-nav" id="stepNav"></nav>
  </aside>
  <button class="sidebar-edge-toggle" id="menuButton" type="button" aria-expanded="true" aria-controls="sidebar" aria-label="학습 순서 접기">◀</button>

  <section class="workspace">
    <div class="progress-rail" aria-label="학습 진행"><span id="progressBar"></span></div>
    <section class="stage" id="stage">

      <section class="page fill active" data-page="0" data-title="받침 살피기" data-sub="은/는 · 이/가 모양 고르기" data-activity-id="batchim-form" data-measure-id="particleForm">
        <div class="work">
          <article class="activity-card" id="area0"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coach0"></div></aside>
        </div>
      </section>

      <section class="page fill" data-page="1" data-title="젤리런" data-sub="맞으면 O · 틀리면 X" data-activity-id="jelly-run" data-measure-id="particleForm">
        <div class="work solo">
          <article class="activity-card" id="areaR"></article>
        </div>
      </section>

      <section class="page fill" data-page="2" data-title="문장 기차" data-sub="주인공과 끝 말 찾기" data-activity-id="sentence-train" data-measure-id="predicateType">
        <div class="work">
          <article class="activity-card" id="area1"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coach1"></div></aside>
        </div>
      </section>

      <section class="page fill" data-page="3" data-title="짝 문장 읽기" data-sub="더 자연스러운 문장 고르기" data-activity-id="pair-reading" data-measure-id="particleMeaning">
        <div class="work">
          <article class="activity-card" id="area2"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coach2"></div></aside>
        </div>

      <section class="page fill" data-page="4" data-title="세종문답" data-sub="물음에 맞는 대답 · 이어지는 말" data-activity-id="king-qa" data-measure-id="particleMeaning">
        <div class="work">
          <article class="activity-card" id="areaQ"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coachQ"></div></aside>
        </div>
      </section>

      <section class="page fill" data-page="5" data-title="빈칸 채우기" data-sub="알맞은 은/는·이/가 넣기" data-activity-id="particle-fill" data-measure-id="particleUse">
        <div class="work">
          <article class="activity-card" id="area3"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coach3"></div></aside>
        </div>
      </section>

      <section class="page fill" data-page="6" data-title="틀린 문장 고치기" data-sub="찾고 · 고치고 · 이유 말하기" data-activity-id="error-correction" data-measure-id="errorCorrection">
        <div class="work">
          <article class="activity-card" id="area4"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coach4"></div></aside>
        </div>
      </section>

      <section class="page fill" data-page="7" data-title="내 문장 쓰기" data-sub="나와 가족 비교하기" data-activity-id="my-sentences" data-measure-id="sentenceProduction">
        <div class="work">
          <article class="activity-card" id="area5"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coach5"></div></aside>
        </div>
      </section>

      <section class="page fill" data-page="8" data-title="점검과 정리" data-sub="점검표 · 오늘의 문장" data-activity-id="self-check" data-measure-id="metacognitiveReflection">
        <div class="work">
          <article class="activity-card" id="area6"></article>
          <aside class="coach" aria-label="젤리코치"><header class="coach-head"><img src="assets/jelly-coach-square.png" alt="" aria-hidden="true"><strong>젤리코치</strong></header><div class="coach-scroll" id="coach6"></div></aside>
        </div>
      </section>

    </section>
    <footer class="actionbar">
      <button class="help-button" id="helpButton" type="button" data-track="hint"><span>?</span>도와주세요</button>
      <div class="step-dots" id="stepDots" aria-label="현재 단계"></div>
      <div class="nav-actions"><button class="back-button" id="backButton" type="button">이전</button><button class="next-button" id="nextButton" type="button">다음</button></div>
    </footer>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer class="rights">자체 제작 텍스트 · 활동 설계 © Oncuvate. All rights reserved.</footer>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 한글 도우미 ---------- */
const hasBatchim=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0;};
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const jong=w=>JONG[(w.charCodeAt(w.length-1)-0xAC00)%28];
const topicOf=w=>w+(hasBatchim(w)?'은':'는');
const subjOf=w=>w==='나'?'내가':w+(hasBatchim(w)?'이':'가');
/* [은] 처럼 대괄호로 표시한 조사를 형광펜으로 */
const mk=t=>esc(t).replace(/\[(.+?)\]/g,'<mark class="pt">$1</mark>');
/* 한 칸에 문장이 여럿이면 한 문장씩 줄바꿈 */
const br=h=>h.replace(/([.!?][”"]?) (?=\S)/g,'$1<br>');
const strip=t=>t.replace(/[\[\]]/g,'');

/* ---------- 기록: 첫 반응 · 도움 · 자기수정 ---------- */
const log={items:{},order:[]};
function item(key){if(!log.items[key]){log.items[key]={wrong:0,hint:0,done:false};log.order.push(key);}return log.items[key];}
function miss(key){item(key).wrong++;}
function hinted(key){if(key)item(key).hint++;}
function finish(key){item(key).done=true;emit('answer',{key,...log.items[key]});}
function stats(){
  const done=log.order.map(k=>log.items[k]).filter(x=>x.done);
  return{total:done.length,first:done.filter(x=>!x.wrong).length,indep:done.filter(x=>!x.wrong&&!x.hint).length,self:done.filter(x=>x.wrong>0).length};
}
function emit(type,detail){try{window.dispatchEvent(new CustomEvent('oc:track',{detail:{type,page:cur,...detail}}));}catch(e){}}

/* ---------- 젤리코치 ---------- */
function say(p,html){const c=$('coach'+p);c.innerHTML='<div class="coach-msg"><p>'+html+'</p></div>';}
function hint(p,html){const c=$('coach'+p);const d=document.createElement('div');d.className='coach-msg hint';d.innerHTML='<p>'+html+'</p>';c.appendChild(d);c.scrollTop=c.scrollHeight;}
function fb(el,cls,html){el.className='inline-feedback'+(cls?' '+cls:'');el.innerHTML=html;}
function reveal(el){requestAnimationFrame(()=>el&&el.scrollIntoView({block:'nearest',behavior:'smooth'}));}

const RULES={
  R1:'받침이 있으면 <b>은/이</b>, 받침이 없으면 <b>는/가</b>',
  R2:'처음 나온 것, \'누가?\'의 대답 → <b>이/가</b>',
  R3:'비교할 때, 다시 말할 때, 설명할 때 → <b>은/는</b>'
};
const ruleCard=()=>'<ol class="rule-card">'+['R1','R2','R3'].map((r,i)=>`<li><span>${i+1}</span><div>${RULES[r]}</div></li>`).join('')+'</ol>';

/* ================= 1. 받침 살피기 ================= */
const P0={i:0,tries:0,hintLv:0,
  items:['책','사과','연필','강아지','선생님','책','사과','연필','강아지','선생님'].map((w,k)=>({w,type:k<5?'topic':'subj'})),
  render(){
    const it=this.items[this.i],n=this.items.length;this.tries=0;this.hintLv=0;
    const forms=it.type==='topic'?[it.w+'은',it.w+'는']:[it.w+'이',it.w+'가'];
    const ans=it.type==='topic'?topicOf(it.w):subjOf(it.w);
    $('area0').innerHTML=`<div class="card-head"><span class="prompt-label">받침 살피기 · ${it.type==='topic'?'은/는':'이/가'}</span><span class="counter">${this.i+1} / ${n}</span></div>
      <h2>낱말 뒤에 무엇이 어울릴까요?</h2>
      <p class="support-copy">소리 내어 읽어 보고 골라요.</p>
      <div class="mini-progress"><span style="width:${(this.i+1)/n*100}%"></span></div>
      <div class="word-stage"><strong id="p0word">${esc(it.w)} + ?</strong></div>
      <div class="chip-row" style="--n:2" id="p0choices">${forms.map(f=>`<button type="button" data-f="${f}" data-track="answer">${f}</button>`).join('')}</div>
      <div class="inline-feedback" id="p0fb" role="status" aria-live="polite">두 가지를 모두 읽어 보고 골라요.</div>
      <div class="card-foot"><button class="primary hidden" id="p0next" type="button">${this.i<n-1?'다음 낱말':'받침 살피기 끝'}</button></div>`;
    const key='p0-'+this.i;item(key);
    $('p0choices').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.f===ans){b.classList.add('correct');[...$('p0choices').children].forEach(x=>x.disabled=true);
        $('p0word').innerHTML=`${esc(it.w)}<mark class="pt">${ans.slice(it.w.length)}</mark>`;
        fb($('p0fb'),'success',`맞았어요! '${it.w}'의 마지막 글자 '${it.w.slice(-1)}'${hasBatchim(it.w)?`에는 받침 ${jong(it.w)}이 있어요.`:'에는 받침이 없어요.'}`);
        finish(key);$('p0next').classList.remove('hidden');reveal($('p0next'));
      }else{b.classList.add('wrong');b.disabled=true;miss(key);this.tries++;
        fb($('p0fb'),'attention',this.tries===1?'다시 한번 소리 내어 읽어 볼까요?':`'${it.w}'의 마지막 글자 '${it.w.slice(-1)}'를 봐요. 받침이 ${hasBatchim(it.w)?'있어요':'없어요'}.`);}
    };
    $('p0next').onclick=()=>{if(this.i<n-1){this.i++;this.render();}else this.done();};
    say(0,this.i===0?'<b>낱말의 마지막 글자</b>를 잘 봐!<br>받침이 있는지 없는지에 따라 은/는·이/가 모양이 달라져.':'좋아, 다음 낱말이야. 소리 내어 읽어 봐.');
  },
  done(){
    $('area0').innerHTML=`<div class="done-panel"><span class="stamp" style="display:grid;place-items:center;width:52px;height:52px;border-radius:50%;color:#fff;background:#2f8a68;font-size:26px;font-weight:950">✓</span>
      <h2>받침 규칙을 찾았어요</h2><ol class="rule-card" style="width:min(100%,460px)"><li><span>1</span><div>${RULES.R1}</div></li></ol>
      <p class="support-copy">이제 젤리런을 하러 가요.</p><button class="secondary" type="button" id="p0again">다시 해보기</button></div>`;
    $('p0again').onclick=()=>{this.i=0;this.render();};
    say(0,'받침 규칙 완성! <b>다음</b>을 눌러 젤리런으로 가자.');
  },
  help(){const it=this.items[this.i];if(!it)return;hinted('p0-'+this.i);this.hintLv++;
    hint(0,this.hintLv===1?'낱말의 <b>마지막 글자</b>만 따로 소리 내어 읽어 봐.':`'${it.w.slice(-1)}'에는 받침이 ${hasBatchim(it.w)?`있어(${jong(it.w)}). 받침이 있으면 <b>${it.type==='topic'?'은':'이'}</b>!`:`없어. 받침이 없으면 <b>${it.type==='topic'?'는':'가'}</b>!`}`);}
};

/* ================= 1-2. 젤리런 (O X 고르기) ================= */
/* 짧은 문장만: 주인공(또는 받는 말) + 끝 말. 틀린 모양은 받침 규칙을 어긴 것. */
const RUN_BANK=[
  {w:'책',ok:'이',bad:'가',p:'있어요'},{w:'강아지',ok:'가',bad:'이',p:'뛰어요'},
  {w:'꽃',ok:'이',bad:'가',p:'예뻐요'},{w:'비',ok:'가',bad:'이',p:'와요'},
  {w:'동생',ok:'이',bad:'가',p:'자요'},{w:'새',ok:'가',bad:'이',p:'날아요'},
  {w:'눈',ok:'이',bad:'가',p:'와요'},{w:'아기',ok:'가',bad:'이',p:'울어요'},
  {w:'곰',ok:'은',bad:'는',p:'커요'},{w:'엄마',ok:'는',bad:'은',p:'바빠요'},
  {w:'친구',ok:'는',bad:'은',p:'착해요'},{w:'달',ok:'은',bad:'는',p:'밝아요'},
  {w:'토끼',ok:'는',bad:'은',p:'빨라요'},{w:'나',ok:'는',bad:'은',p:'웃어요'},
  {w:'사과',ok:'를',bad:'을',p:'먹어요'},{w:'물',ok:'을',bad:'를',p:'마셔요'},
  {w:'공',ok:'을',bad:'를',p:'차요'},{w:'우유',ok:'를',bad:'을',p:'마셔요'},
  {w:'빵',ok:'을',bad:'를',p:'먹어요'},{w:'나',okW:'내가',badW:'나가',p:'할게요'}];
const runWord=(b,good)=>b.okW?(good?b.okW:b.badW):b.w+(good?b.ok:b.bad);
const runLine=(b,good)=>{const t=runWord(b,good),n=b.okW?1:b.w.length;return esc(t.slice(0,n))+'<mark class="pt">'+esc(t.slice(n))+'</mark> '+esc(b.p)+'.';};
const runWhy=b=>b.okW?"'나' 뒤에 '가'가 오면 <b>내가</b>!":`'${b.w.slice(-1)}'에 받침이 ${hasBatchim(b.w)?`있어요(${jong(b.w)})`:'없어요'} → <b>${b.w+b.ok}</b>`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const OX_N=10,OX_SEC=15;
const PR={round:0,i:0,pick:null,state:'ready',list:[],marks:[],
  render(){this.start();},
  start(){
    this.round++;this.i=0;this.win=0;this.bumps=[];this.marks=[];
    const picks=shuffle(RUN_BANK.slice()).slice(0,OX_N),goods=shuffle(picks.map((b,k)=>k<OX_N/2));
    this.list=picks.map((b,k)=>({b,good:goods[k]}));
    $('areaR').innerHTML=`<div class="card-head"><span class="prompt-label">젤리런 · O X</span><span style="display:flex;gap:6px;align-items:center">${soundBtn()}<span class="ox-count" id="oxCount"></span></span></div>
      <div class="ox-top"><div class="ox-dots" id="oxDots">${'<i></i>'.repeat(OX_N)}</div></div>
      <div class="ox-stage" id="oxStage">
        <div id="oxCardBox"></div>
        <div class="ox-floor" id="oxFloor">
          <button type="button" class="ox-zone o" data-v="o" data-track="answer" aria-label="O 맞는 문장"><span class="arch"><b>O</b><small>맞아요</small></span><span class="hint">← 맞으면 O</span></button>
          <button type="button" class="ox-zone x" data-v="x" data-track="answer" aria-label="X 틀린 문장"><span class="arch"><b>X</b><small>틀려요</small></span><span class="hint">틀리면 X →</span></button>
          <div class="ox-jelly" aria-hidden="true"><img src="assets/jelly-coach-square.png" alt=""></div>
        </div>
      </div>
      <div class="ox-bar"><img src="assets/jelly-coach-square.png" alt=""><div id="coachR" aria-live="polite"></div><button class="primary" type="button" id="oxGo" disabled>정했어요</button></div>`;
    $('oxFloor').onclick=e=>{const z=e.target.closest('.ox-zone');if(z)this.choose(z.dataset.v);};
    $('oxGo').onclick=()=>this.state==='pick'?this.reveal():this.next();
    this.show();
  },
  show(){
    const it=this.list[this.i];this.pick=null;this.state='pick';this.key=`pR${this.round}-${this.i}`;item(this.key);
    $('oxCount').textContent=`${this.i+1} / ${OX_N}`;
    [...$('oxDots').children].forEach((d,k)=>d.className=this.marks[k]||(k===this.i?'now':''));
    $('oxCardBox').innerHTML=`<div class="ox-card"><span class="ox-timer" id="oxTimer"></span><small>문장 ${this.i+1}</small><p id="oxSent">${runLine(it.b,it.good)}</p></div>`;
    $('oxFloor').removeAttribute('data-pick');
    [...$('oxFloor').querySelectorAll('.ox-zone')].forEach(z=>{z.disabled=false;z.classList.remove('pick','right','wrong');});
    $('oxGo').disabled=true;$('oxGo').textContent='정했어요';
    this.timer();
    say('R',this.i===0?'문장을 소리 내어 읽고 <b>O</b>나 <b>X</b>로 가 봐.<br>고른 다음 <b>정했어요</b>를 눌러.':'형광펜 칠한 글자를 잘 봐!');
  },
  /* 시간 막대는 보여 주기만 — 다 되어도 틀린 것으로 치지 않음 */
  timer(){const t=$('oxTimer');if(!t)return;t.style.transition='none';t.style.transform='scaleX(1)';void t.offsetWidth;
    t.style.transition=`transform ${OX_SEC}s linear`;t.style.transform='scaleX(0)';
    clearTimeout(this.tNudge);this.tNudge=setTimeout(()=>{if(this.state==='pick'&&!this.pick)say('R','천천히 골라도 괜찮아. 받침을 봐!');},OX_SEC*1000);},
  choose(v){if(this.state!=='pick')return;this.pick=v;$('oxFloor').dataset.pick=v;
    [...$('oxFloor').querySelectorAll('.ox-zone')].forEach(z=>z.classList.toggle('pick',z.dataset.v===v));
    $('oxGo').disabled=false;SFX.tone(v==='o'?660:520,0,.08,'triangle',.08);},
  reveal(){

const TYPES={move:'움직이는 말',state:'상태나 느낌을 표현하는 말',what:'무엇인지 알려 주는 말'};

  items:[

    {s:'동생이',p:'먹어요',t:'move',test:'지금 먹고 있어요'},

  },

        fb($('p1fb'),'attention',this.tries===1?'다시 한번 읽어 볼까요?':(it.test?`'${it.test}'라고 말해 봐요. 자연스러운가요?`:`'~이에요'로 끝나는 말이에요.`));}

};

/* 효과음: 파일 없이 브라우저에서 합성(외부 전송 없음) */
const SFX={on:true,ctx:null,
  ac(){if(!this.on)return null;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;}catch(e){return null;}},
  tone(f,t0,dur,type,vol,f2){const c=this.ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);},
  happy(){[523,659,784,1047].forEach((f,k)=>this.tone(f,k*.08,.22,'triangle',.16));this.tone(1568,.34,.3,'sine',.08);},
  scold(){this.tone(220,0,.18,'sawtooth',.09,200);this.tone(196,.2,.18,'sawtooth',.09,180);this.tone(175,.42,.5,'sawtooth',.1,110);},
  think(){this.tone(392,0,.2,'sine',.12,370);this.tone(330,.24,.32,'sine',.12,300);},
  chomp(){this.tone(660,0,.07,'square',.07,990);this.tone(990,.06,.09,'triangle',.1,1320);},
  bump(){this.tone(160,0,.22,'sawtooth',.1,70);},
  whoosh(){this.tone(900,0,.16,'sine',.05,300);},
  cry(){[[523,440],[494,415],[440,330]].forEach(([a,b],k)=>this.tone(a,k*.26,.3,'sine',.13,b));}
};

const JR_LINES={cheer:['옳거니! 바로 그거다!','훌륭하도다!','얼씨구, 잘했다!'],thumbs:['잘했노라!','역시 귀가 밝구나!','최고로다!'],
  scold:['어허! 다시 읽어 보거라!','에헴! 귀를 쫑긋 세우거라!','이 문장은 아니 되오!'],cry:['흑흑… 과인이 슬프도다.','엉엉, 다시 한 번 읽어 주거라…','훌쩍… 은/는·이/가를 보거라…'],think:['흠… 상황을 다시 읽어 보거라.','흠… 은/는·이/가만 다르구나.']};
function jellyReact(box,kind){
  if(kind==='happy')kind=Math.random()<.5?'cheer':'thumbs';
  if(kind==='scold'){jellyReact.flip=!jellyReact.flip;kind=jellyReact.flip?'scold':'cry';} /* 오답 반응은 호통 ↔ 울음 번갈아 */
  let j=box.querySelector('.jr');
  if(!j){j=document.createElement('div');j.className='jr';j.setAttribute('aria-hidden','true');j.innerHTML='<img alt=""><div class="jr-bubble"></div>';box.appendChild(j);}
  const img=j.querySelector('img');img.onerror=()=>{img.onerror=null;img.src='assets/jelly-coach-square.png';};
  img.src='assets/king-'+kind+'.webp';
  const L=JR_LINES[kind];j.querySelector('.jr-bubble').textContent=L[Math.floor(Math.random()*L.length)];
  j.className='jr';void j.offsetWidth;j.className='jr show '+kind;
  if(kind==='scold')SFX.scold();else if(kind==='cry')SFX.cry();else if(kind==='think')SFX.think();else SFX.happy();
}
function sparkle(btn){['✦','★','✧','✦','★'].forEach((c,k)=>{const e=document.createElement('span');e.className='spark';e.textContent=c;

  e.style.setProperty('--dx',Math.round(Math.cos(a)*70)+'px');e.style.setProperty('--dy',Math.round(Math.sin(a)*50)+'px');btn.appendChild(e);setTimeout(()=>e.remove(),820);});}

  bindNext(){const n=this.items.length;

  /* ② 이어 말하기: ①과 다른 화면. 보기마다 두 문장을 1 → 2 순서로 보여 준다 */

    else hint('Q',this.hintLv===1?"물음에 <b>'누가?·무엇이?'</b>가 있을까, 아니면 <b>'○○은/는'</b>이 있을까?":it.why);}
};

/* ================= 4. 빈칸 채우기 ================= */
const GROUP={은:'topic',는:'topic',이:'subj',가:'subj'};
const P3={i:0,tries:0,hintLv:0,
  items:[
    {t:'형은 키가 큰데 나{_} 키가 작아요.',w:'나',a:'는',r:'R3'},

/* ================= 5. 틀린 문장 고치기 ================= */
const REASONS=[['R1','받침 규칙'],['R2','처음 나옴 · 누가? → 이/가'],['R3','비교 · 다시 · 설명 → 은/는']];
const P4={i:0,phase:'',tries:0,hintLv:0,errs:0,
  items:[
    {lv:1,toks:['내','동생는','여덟','살이에요.'],bad:1,fixes:['동생은','동생가'],ans:'동생은',r:'R1'},
    {lv:1,toks:['책상','위에','책가','있어요.'],bad:2,fixes:['책는','책이'],ans:'책이',r:'R1'},
    {lv:2,ctx:'“누가 창문을 깼니?”',toks:['철수는','깼어요.'],bad:0,fixes:['철수가','철수를'],ans:'철수가',r:'R2'},
    {lv:2,toks:['형은','안경을','썼는데','내가','안경을','안','썼어요.'],bad:3,fixes:['나를','나는'],ans:'나는',r:'R3'},
    {lv:2,kind:'end',toks:['우리','집','강아지가','아주','빠르게.'],fixes:['강아지','달려요','빠르게'],ans:'달려요'},
    {lv:3,toks:['사과는','빨갛고','바나나는','노래요.'],ok:true},
    {lv:3,toks:['나는','수학은','좋아하지만','국어가','싫어요.'],bad:3,fixes:['국어는','국어를'],ans:'국어는',r:'R3'},
    {lv:3,ctx:'“누가 먹었어?”',toks:['동생은','먹었어.'],bad:0,fixes:['동생이','동생을'],ans:'동생이',r:'R2'},
    {lv:3,toks:['고양이가','소파','위에서','자요.'],ok:true}],
  lvName:{1:'1단계 · 표시된 곳 고치기',2:'2단계 · 틀린 곳 찾기',3:'3단계 · 맞는 문장일까?'},
  key(){return 'p4-'+this.i;},
  tokens(it,opt={}){
    return `<div class="token-line" id="p4toks">${it.toks.map((t,j)=>{
      let cls='token';if(opt.tap)cls+=' tappable';if(opt.flag&&j===it.bad)cls+=' flag';
      let html=esc(t);
      if(opt.fixed&&j===it.bad){cls+=' fixed';const w=it.ans;html=esc(w.slice(0,-1))+'<mark class="pt">'+esc(w.slice(-1))+'</mark>';}
      if(opt.fixed&&it.kind==='end'&&j===it.toks.length-1)html=esc(t.replace('.',''))+' <b style="color:var(--sx-pred)">'+esc(it.ans)+'.</b>';
      return opt.tap?`<button type="button" class="${cls}" data-j="${j}">${html}</button>`:`<span class="${cls}">${html}</span>`;}).join('')}</div>`;
  },
  frame(inner){
    const it=this.items[this.i],n=this.items.length;
    $('area4').innerHTML=`<div class="card-head"><span class="level-tag">${this.lvName[it.lv]}</span><span class="counter">${this.i+1} / ${n}</span></div>
      <div class="sent-stage" style="margin-top:10px">${it.ctx?`<span class="ctx">${esc(it.ctx)}</span>`:''}<div id="p4sent"></div></div>
      <div id="p4work">${inner||''}</div>
      <div class="inline-feedback" id="p4fb" role="status" aria-live="polite"></div>
      <div class="card-foot"><button class="primary hidden" id="p4next" type="button">${this.i<n-1?'다음 문장':'고치기 끝'}</button></div>`;
    $('p4next').onclick=()=>{if(this.i<n-1){this.i++;this.render();}else this.done();};
  },
  render(){
    const it=this.items[this.i];this.tries=0;this.hintLv=0;item(this.key());
    this.frame();
    if(it.lv===3){this.phase='judge';$('p4sent').innerHTML=this.tokens(it);
      $('p4work').innerHTML=`<p class="phase-label">① 소리 내어 읽고, 맞는 문장인지 판단해요.</p>
        <div class="choice-pair" id="p4ox"><button class="yes" type="button" data-v="o" data-track="answer"><span class="sym">O</span>자연스러워요</button><button class="no" type="button" data-v="x" data-track="answer"><span class="sym">X</span>어색해요</button></div>`;
      fb($('p4fb'),'','천천히 소리 내어 읽어요.');
      $('p4ox').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const v=b.dataset.v;
        const right=(v==='o')===!!it.ok;
        if(!right){b.style.borderColor='#efb6b8';b.style.background='var(--oc-danger-bg)';b.disabled=true;this.err('다시 한번 소리 내어 읽어 볼까요?');return;}
        [...$('p4ox').children].forEach(x=>x.disabled=true);b.style.borderColor='#9dd8c1';b.style.background='var(--oc-success-bg)';
        if(it.ok){$('p4sent').innerHTML=this.tokens(it,{fixed:true});fb($('p4fb'),'success','맞아요! 틀린 곳이 없는 문장이에요.');this.complete();}
        else this.find();};
      say(4,'이번엔 <b>맞는 문장</b>도 섞여 있어.<br>읽어 보고 판단해!');
    }else if(it.kind==='end'){this.phase='fix';$('p4sent').innerHTML=this.tokens(it);
      $('p4work').innerHTML=`<div class="train" style="min-height:0;margin-top:10px"><div class="car subject"><div class="box" style="font-size:18px"><span class="subj">강아지<mark class="pt">가</mark></span></div><small>문장의 주인공</small></div><i class="link"></i><div class="car pred empty"><div class="box" style="font-size:18px">?</div><small>끝 말</small></div></div>
        <p class="phase-label">문장 기차의 끝 칸이 비었어요. 어떤 말을 넣을까요?</p>${this.fixChips(it)}`;

    }else if(it.lv===1){this.phase='fix';$('p4sent').innerHTML=this.tokens(it,{flag:true});
      $('p4work').innerHTML=`<p class="phase-label">② 표시된 낱말을 알맞게 고쳐요.</p>${this.fixChips(it)}`;
      fb($('p4fb'),'','표시된 낱말을 소리 내어 읽어 봐요.');this.bindFix();
      say(4,this.i===0?'<b>틀린 문장 고치기</b>야!<br>① 찾기 ② 고치기 ③ 이유 말하기 순서로 해.':'표시된 곳을 고쳐 봐.');
    }else this.find();
  },
  err(msg){miss(this.key());this.tries++;this.errs++;fb($('p4fb'),'attention',msg);},
  find(){
    const it=this.items[this.i];this.phase='find';
    $('p4sent').innerHTML=this.tokens(it,{tap:true});
    $('p4work').innerHTML=`<p class="phase-label">② 어색한 낱말을 눌러요.</p>`;
    fb($('p4fb'),'','어느 낱말이 어색한지 찾아요.');
    say(4,'어색한 <b>낱말</b>을 눌러 봐.');
    $('p4toks').onclick=e=>{const b=e.target.closest('button');if(!b)return;const j=+b.dataset.j;
      if(j===it.bad){$('p4sent').innerHTML=this.tokens(it,{flag:true});
        $('p4work').innerHTML=`<p class="phase-label">③ 알맞게 고쳐요.</p>${this.fixChips(it)}`;fb($('p4fb'),'','찾았어요! 이제 고쳐 봐요.');this.bindFix();}
      else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),700);
        this.err(this.tries===0?'그 낱말은 괜찮아요. 은/는·이/가를 살펴봐요.':'주인공에 붙은 은/는·이/가를 살펴봐요.');}};
  },
  fixChips(it){return `<div class="chip-row" style="--n:${it.fixes.length}" id="p4fix">${it.fixes.map(f=>`<button type="button" data-f="${f}" data-track="answer">${f}</button>`).join('')}</div>`;},
  bindFix(){
    const it=this.items[this.i];
    $('p4fix').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.f===it.ans){b.classList.add('correct');[...$('p4fix').children].forEach(x=>x.disabled=true);
        $('p4sent').innerHTML=this.tokens(it,{fixed:true});
        if(it.kind==='end'){const e=document.querySelector('#p4work .car.empty');if(e){e.classList.remove('empty');e.innerHTML='<div class="box" style="font-size:18px"><span class="pred-move">달려요.</span></div><small>움직이는 말</small>';}fb($('p4fb'),'success','맞아요! 끝 칸에 움직이는 말이 들어가서 문장이 끝났어요.');this.complete();}
        else this.reason();}
      else{b.classList.add('wrong');b.disabled=true;this.err('다시 소리 내어 읽어 볼까요?');}};
  },
  reason(){
    const it=this.items[this.i];this.phase='reason';
    $('p4work').innerHTML=`<p class="phase-label">④ 왜 틀렸을까요? 규칙 카드에서 골라요.</p>
      <div class="chip-row" style="--n:3" id="p4why">${REASONS.map(([k,v])=>`<button type="button" data-r="${k}" style="font-size:13px" data-track="answer">${v}</button>`).join('')}</div>`;
    fb($('p4fb'),'success','고쳤어요! 이제 이유를 골라요.');
    $('p4why').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.r===it.r){b.classList.add('correct');[...$('p4why').children].forEach(x=>x.disabled=true);fb($('p4fb'),'success','맞아요! '+RULES[it.r]);this.complete();}
      else{b.classList.add('wrong');b.disabled=true;this.err('다른 규칙도 살펴볼까요?');}};
  },
  complete(){finish(this.key());this.phase='done';$('p4next').classList.remove('hidden');reveal($('p4next'));},
  done(){
    $('area4').innerHTML=`<div class="done-panel"><span style="display:grid;place-items:center;width:52px;height:52px;border-radius:50%;color:#fff;background:#2f8a68;font-size:26px;font-weight:950">✓</span>
      <h2>문장 탐정 성공!</h2><p class="support-copy">틀린 곳을 찾고, 고치고, 이유까지 말했어요.</p>
      <button class="secondary" type="button" id="p4again">다시 해보기</button></div>`;
    $('p4again').onclick=()=>{this.i=0;this.render();};
    say(4,'멋져! 이제 <b>내 문장</b>을 써 볼 차례야.');
  },
  help(){const it=this.items[this.i];if(!it)return;hinted(this.key());this.hintLv++;
    const m={judge:['주인공 뒤의 은/는·이/가를 하나씩 소리 내어 읽어 봐.',it.ok?'이 문장은 규칙에 맞게 쓰였어.':`'${it.toks[it.bad]}' 부분을 잘 봐.`],
      find:['은/는·이/가가 붙은 낱말만 살펴봐.',`'${it.toks[it.bad]}'가 어색하지 않아?`],
      fix:[it.kind==='end'?'끝 칸에는 움직이는 말이나 상태·느낌을 표현하는 말이 와.':'규칙 카드를 떠올려 봐.',it.kind==='end'?'강아지가 무엇을 하는지 알려 주는 말이야.':`'${it.ans}'를 넣어 소리 내어 읽어 봐.`],
      reason:['받침 때문일까, 뜻 때문일까?','규칙 카드: '+(it.r?RULES[it.r]:'')]};
    const arr=m[this.phase]||m.fix;hint(4,arr[Math.min(this.hintLv,2)-1]);}
};

/* ================= 6. 내 문장 쓰기 ================= */
const FAMILY=['엄마','아빠','형','오빠','누나','언니','동생','할머니','할아버지'];
const QUESTIONS=['일찍 자요','많이 먹어요','잘 웃어요','키가 커요'];
const P5={who:null,whoOk:false,q:null,ansWho:null,ansOk:false,part:0,
  render(){
    const wk=this.who,part=this.part;
    const segs=['① 누구와 비교할까','② 다른 점 쓰기','③ 질문과 대답'].map((t,k)=>`<span class="${k===part?'on':k<part?'done':''}">${t}</span>`).join('');
    $('area5').innerHTML=`<div class="card-head"><span class="prompt-label">나와 가족 비교하기</span><button class="secondary" type="button" id="p5ex" style="min-height:34px;font-size:12px">예시 보기</button></div>
      <div class="seg">${segs}</div><div id="p5body"></div>
      <div class="card-foot"><button class="secondary ${part?'':'hidden'}" id="p5prev" type="button">← 앞 단계</button><button class="primary ${part<2&&(part>0||this.whoOk)?'':'hidden'}" id="p5go" type="button">${part===0?'다른 점 쓰러 가기':'질문과 대답으로'}</button></div>`;
    $('p5ex').onclick=()=>hint(5,'예시<br>아빠는 커피를 좋아해요. 나는 우유를 좋아해요.<br>우리 집에서 누가 제일 일찍 자요? 동생이 제일 일찍 자요.');
    $('p5prev').onclick=()=>{this.part--;this.render();};
    $('p5go').onclick=()=>{this.part++;this.render();};
    if(part===0)this.partWho();else if(part===1)this.partPairs();else this.partQA();
  },
  partWho(){
    const wk=this.who;
    $('p5body').innerHTML=`<h2 style="font-size:21px">누구와 나를 비교할까요?</h2>
      <div class="family-row" id="p5fam">${FAMILY.map(f=>`<button type="button" class="${f===wk?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>
      ${wk?`<p class="phase-label">'${esc(wk)}' 뒤에 은/는 중 무엇이 어울릴까요?</p><div class="frame" style="grid-template-columns:auto"><div class="mini-pick" id="p5pick">${[wk+'은',wk+'는'].map(f=>`<button type="button" data-f="${f}" data-track="answer">${f}</button>`).join('')}</div></div>`:''}`;
    $('p5fam').onclick=e=>{const b=e.target.closest('button');if(!b)return;this.who=b.dataset.f;this.whoOk=false;this.render();};
    if(!wk){say(5,'가족 중 한 명을 골라 봐!<br>나와 <b>다른 점</b>을 두 가지 쓸 거야.');return;}
    const key='p5-who',pick=$('p5pick');item(key);
    if(this.whoOk){[...pick.children].forEach(x=>{x.disabled=true;if(x.dataset.f===topicOf(wk))x.classList.add('correct');});say(5,'좋아! <b>다른 점 쓰러 가기</b>를 눌러.');return;}
    say(5,`'${wk}'${hasBatchim(wk)?'과':'와'} 나를 <b>비교</b>할 거야.<br>비교할 때 쓰는 말을 골라 봐.`);
    pick.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.f===topicOf(wk)){b.classList.add('correct');this.whoOk=true;[...pick.children].forEach(x=>x.disabled=true);finish(key);$('p5go').classList.remove('hidden');say(5,'맞아! 비교할 때는 은/는, 받침도 딱 맞아.<br><b>다른 점 쓰러 가기</b>를 눌러.');}
      else{b.classList.add('wrong');b.disabled=true;miss(key);hint(5,`'${wk}'의 마지막 글자 '${wk.slice(-1)}'에 받침이 ${hasBatchim(wk)?'있어':'없어'}.`);}};
  },
  partPairs(){
    const wk=this.who;if(!wk||!this.whoOk){this.part=0;return this.render();}
    const t=topicOf(wk);
    $('p5body').innerHTML=`<h2 style="font-size:21px">${esc(wk)}${hasBatchim(wk)?'과':'와'} 나의 다른 점을 써요</h2>`+[0,1].map(k=>`<div class="pair-block" style="margin-top:8px"><h3>다른 점 ${k+1}</h3><div class="pair-row">
        <div class="frame"><span class="who"><span class="subj">${esc(wk)}<mark class="pt">${t.slice(wk.length)}</mark></span></span><input id="p5a${k}" maxlength="30" placeholder="${k?'책을 읽어요.':'커피를 좋아해요.'}" value="${esc(this['a'+k]||'')}"></div>
        <div class="frame"><span class="who"><span class="subj">나<mark class="pt">는</mark></span></span><input id="p5b${k}" maxlength="30" placeholder="${k?'그림을 그려요.':'우유를 좋아해요.'}" value="${esc(this['b'+k]||'')}"></div></div></div>`).join('');
    [0,1].forEach(k=>{$('p5a'+k).oninput=e=>this['a'+k]=e.target.value;$('p5b'+k).oninput=e=>this['b'+k]=e.target.value;});
    say(5,'주인공은 이미 들어 있어.<br>빈칸에는 끝 칸까지 써야 해. <b>끝 말</b>을 잊지 마!');
  },
  partQA(){
    $('p5body').innerHTML=`<h2 style="font-size:21px">우리 집에서 누가 제일 그럴까요?</h2>
      <div class="family-row" id="p5q">${QUESTIONS.map(q=>`<button type="button" class="${q===this.q?'on':''}" data-q="${q}">누가 제일 ${q}?</button>`).join('')}</div><div id="p5ans"></div>`;
    $('p5q').onclick=e=>{const b=e.target.closest('button');if(!b)return;this.q=b.dataset.q;this.ansWho=null;this.ansOk=false;[...$('p5q').children].forEach(x=>x.classList.toggle('on',x===b));this.renderAns();};
    if(this.q)this.renderAns();
    say(5,'질문을 하나 골라 봐.<br>대답할 때는 <b>\'누가?\'의 대답</b> 규칙!');
  },
  renderAns(){
    const who=['나',...FAMILY];const aw=this.ansWho;
    $('p5ans').innerHTML=`<p class="phase-label" style="margin-top:8px">누구인지 고르고, 이/가를 골라요.</p>
      <div class="family-row" id="p5aw">${who.map(f=>`<button type="button" class="${f===aw?'on':''}" data-f="${f}">${f}</button>`).join('')}</div>
      ${aw?`<div class="frame"><div class="mini-pick" id="p5ap">${(aw==='나'?['나가','내가']:[aw+(hasBatchim(aw)?'가':'이'),subjOf(aw)].sort()).map(f=>`<button type="button" data-f="${f}" data-track="answer">${f}</button>`).join('')}</div><span id="p5full" style="font-size:16px;font-weight:850"></span></div>`:''}`;
    $('p5aw').onclick=e=>{const b=e.target.closest('button');if(!b)return;this.ansWho=b.dataset.f;this.ansOk=false;this.renderAns();};
    if(!aw)return;const key='p5-ans-'+aw;item(key);
    const ok=subjOf(aw);
    const full=()=>{$('p5full').innerHTML=`→ <span class="subj">${esc(aw==='나'?'내':aw)}<mark class="pt">${ok.slice(aw==='나'?1:aw.length)}</mark></span> 제일 ${esc(this.q)}.`;};
    if(this.ansOk){[...$('p5ap').children].forEach(x=>{x.disabled=true;if(x.dataset.f===ok)x.classList.add('correct');});full();}
    $('p5ap').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.f===ok){b.classList.add('correct');[...$('p5ap').children].forEach(x=>x.disabled=true);this.ansOk=true;finish(key);full();
        say(5,aw==='나'?'맞아! \'나\' 뒤에 \'가\'가 오면 <b>내가</b>로 바뀌어.':'맞아! \'누가?\'의 대답에는 <b>이/가</b>!');}
      else{b.classList.add('wrong');b.disabled=true;miss(key);hint(5,aw==='나'?'"나가 제일 일찍 자요"라고 말하면 어색하지? 소리 내어 비교해 봐.':'\'누가?\'의 대답이니까 이/가를 써. 받침도 확인해!');}};
  },
  sentences(){
    const out=[];if(!this.who)return out;const t=topicOf(this.who);
    [0,1].forEach(k=>{const a=(this['a'+k]||'').trim(),b=(this['b'+k]||'').trim();if(a)out.push(this.who+'['+t.slice(this.who.length)+'] '+a);if(b)out.push('나[는] '+b);});
    if(this.q&&this.ansWho&&this.ansOk){const sw=subjOf(this.ansWho),base=this.ansWho==='나'?'내':this.ansWho;out.push(`우리 집에서 누가 제일 ${this.q}? ${base}[${sw.slice(base.length)}] 제일 ${this.q}.`);}
    return out.map(s=>/[.?!]$/.test(s)?s:s+'.');
  },
  help(){hinted('p5-who');hint(5,this.part===2?'\'누가?\'의 대답에는 이/가! \'나\'는 \'내가\'로 바뀌어.':!this.who?'나랑 제일 다른 가족을 떠올려 봐. 좋아하는 음식, 하는 일, 모습!':'끝 칸에 움직이는 말(먹어요, 읽어요)이나 상태·느낌 말(커요, 좋아요)을 꼭 넣어.');}
};

/* ================= 7. 점검과 정리 ================= */
const CHECKS=['문장의 주인공이 있나요?','끝 칸에 끝 말이 있나요?','은/는 · 이/가를 맞게 썼나요?','소리 내어 읽었을 때 자연스러운가요?','마침표를 찍었나요?'];
const P6={today:null,saved:false,
  render(){
    const ss=P5.sentences();const st=stats();
    $('area6').innerHTML=`<div class="card-head"><span class="prompt-label">내 문장 점검표</span><span class="counter">${ss.length}문장</span></div>
      <div class="sum-grid"><div><h3>내 문장 · 눌러서 오늘의 문장 고르기</h3><div class="my-sentences" id="p6s">${ss.length?ss.map((s,k)=>`<button type="button" data-k="${k}" class="${this.today===k?'on':''}">${mk(s)}</button>`).join(''):'<div class="empty-note">8단계에서 쓴 문장이 여기에 나와요.</div>'}</div></div>
      <div><h3>점검표</h3><div class="check-list">${CHECKS.map((c,k)=>`<label><input type="checkbox" data-c="${k}"><i></i><span>${c}</span></label>`).join('')}</div></div></div>
      <div class="metrics"><div><strong>${st.first} / ${st.total}</strong><span>첫 반응 정확</span></div><div><strong>${st.indep} / ${st.total}</strong><span>도움 없이 해결</span></div><div><strong>${st.self}회</strong><span>스스로 고침</span></div></div>
      <div class="inline-feedback hidden" id="p6fb" role="status" aria-live="polite"></div>
      <div class="card-foot"><a class="secondary" href="session01-review.html" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">복습 워크지 열기</a><button class="primary" id="p6save" type="button" data-track="activity-complete">오늘 기록 저장하기</button></div>`;
    $('p6s').onclick=e=>{const b=e.target.closest('button');if(!b)return;this.today=+b.dataset.k;[...$('p6s').children].forEach(x=>x.classList.toggle('on',x===b));say(6,'좋은 문장이야! 이 문장을 <b>규칙 카드 뒷면</b>에 옮겨 써 줘.');};
    $('p6save').onclick=()=>{
      const checks=[...document.querySelectorAll('#area6 .check-list input')].map(x=>x.checked);
      window.ocLessonResult={lesson:'grammar-sentence-s01',today:this.today!=null?strip(ss[this.today]):null,sentences:ss.map(strip),checks,stats:stats(),items:log.items};
      emit('lesson-complete',{result:window.ocLessonResult});
      fb($('p6fb'),'success','<b>오늘의 문장 공부 완료!</b> 다음 시간에는 \'에\'와 \'를\'을 배워요.');$('p6fb').classList.remove('hidden');reveal($('p6fb'));
      ocToast('오늘 기록을 저장했어요.');this.saved=true;};
    say(6,ss.length?'내 문장을 하나씩 점검표로 확인해 봐.<br>가장 마음에 드는 문장을 눌러 <b>오늘의 문장</b>으로 골라!':'8단계에서 문장을 먼저 써 줘.');
  },
  help(){hint(6,'문장마다 빨간 동그라미(주인공)와 파란 밑줄(끝 말)을 손가락으로 짚어 봐.');}
};

const PAGES=[P0,PR,P1,P2,QA,P3,P4,P5,P6];

/* ---------- 셸: 이동 · 사이드바 · 도움 ---------- */
const pages=[...document.querySelectorAll('.page')];
const nav=$('stepNav'),dots=$('stepDots'),studio=$('studio'),sidebar=$('sidebar'),menu=$('menuButton');
let cur=0;const rendered=new Set();
pages.forEach((p,i)=>{
  const b=document.createElement('button');b.type='button';b.className='step-link';
  b.innerHTML=`<span class="step-no">${i+1}</span><span><b>${p.dataset.title}</b><small>${p.dataset.sub||''}</small></span>`;
  b.onclick=()=>go(i);nav.appendChild(b);
  const d=document.createElement('button');d.type='button';d.setAttribute('aria-label',`${i+1}단계 ${p.dataset.title}`);d.onclick=()=>go(i);dots.appendChild(d);
});
function go(i){
  cur=Math.max(0,Math.min(pages.length-1,i));
  pages.forEach((p,k)=>p.classList.toggle('active',k===cur));
  nav.querySelectorAll('.step-link').forEach((b,k)=>{b.classList.toggle('active',k===cur);if(k===cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
  dots.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('active',k===cur));
  $('progressBar').style.width=((cur+1)/pages.length*100)+'%';
  $('backButton').disabled=cur===0;$('nextButton').disabled=cur===pages.length-1;
  $('stage').scrollTop=0;
  PAGES.forEach((P,k)=>{if(k!==cur&&P.leave)P.leave();});
  if(!rendered.has(cur)||PAGES[cur]===P6){PAGES[cur].render();rendered.add(cur);}
  if(window.innerWidth<900){sidebar.classList.remove('open');menu.textContent='▶';}
  emit('nav',{});
}
$('backButton').onclick=()=>go(cur-1);
$('nextButton').onclick=()=>go(cur+1);
menu.onclick=()=>{
  if(window.innerWidth<900){const o=sidebar.classList.toggle('open');menu.setAttribute('aria-expanded',o);menu.textContent=o?'◀':'▶';return;}
  const c=studio.classList.toggle('sidebar-collapsed');menu.setAttribute('aria-expanded',!c);menu.textContent=c?'▶':'◀';
  menu.setAttribute('aria-label',c?'학습 순서 펼치기':'학습 순서 접기');
};
if(window.innerWidth<900)menu.textContent='▶';
const toast=$('toast');
window.ocToast=msg=>{toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2200);};
$('helpButton').onclick=()=>{PAGES[cur].help();emit('hint',{});};
go(0);
})();
</script>
</body>
