<!doctype html>
<html lang="ko" data-lesson-id="folk45-stonesoup-k5-review" data-lesson-version="0.1.0">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,noarchive">
<title>돌멩이 수프 복습 — 모두가 조금씩 보태면</title>
<style>
/* 세계 전래 동화 읽기 — 복습(세로 A4 인쇄 교재). 모양은 「바른 문장 쓰기」 복습 워크지 결을 따른다(2026-10-08 사용자 「출판 고려」).
 * 데이터는 맨 아래 window.RV 하나 — _tools/make_review.py 가 세트 파일의 REVIEW 로 채운다. 이 파일을 손으로 고치지 말 것. */
@font-face{font-family:Pretendard;src:url('assets/review-pretendard.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--ink:#27344e;--muted:#6f7789;--line:#e2ddd2;--paper:#fffdf7;--violet:#4b24a5;--violet-900:#35206f;--violet-soft:#eee9fb;
  --cyan-soft:#e9f8fa;--cyan-line:#9fd9e3;--ok:#27866a;--ok-bg:#eef9f5;--no:#c2575d;--no-bg:#fff3f3;--mark:#fde9a6;--warm:#d68a1f;--warm-bg:#fff7e8}
*{box-sizing:border-box}
html{background:#eef0ec;scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;color:var(--ink);font:16px/1.6 Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;line-break:strict;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,textarea{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(75,201,220,.6);outline-offset:3px}
.pt{padding:0 1px;border-radius:3px;background:linear-gradient(transparent 50%,var(--mark) 50%);font-weight:900}

/* 도구 막대 (화면 전용) */
.toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 12px;background:rgba(238,240,236,.94);border-bottom:1px solid var(--line)}
.toolbar a,.toolbar button{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font-size:13px;font-weight:850}
.toolbar a:hover{border-color:var(--cyan-line)}
.toolbar .spacer{width:10px}
.toolbar .main{border:0;color:#fff;background:var(--violet)}
.toolbar button[aria-pressed=true]{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}

/* A4 종이 */
.sheet{position:relative;display:flex;flex-direction:column;width:210mm;min-height:297mm;margin:16px auto;padding:12mm 13mm 10mm;background:var(--paper);box-shadow:0 10px 30px rgba(37,45,81,.12)}
.head{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px 12px 18px;border:1.5px solid #ddd3f3;border-radius:18px;background:linear-gradient(120deg,#f6f2ff 0%,#fffdf7 55%,#eaf8fa 100%)}
.head::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 5px 5px 0;background:linear-gradient(180deg,#4b24a5,#4bc9dc)}
.series{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.series-name{font-size:27px;font-weight:900;letter-spacing:-.05em;color:var(--violet-900);background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 90%,transparent 90%);padding:0 2px}
.series-sub{color:#566077;font-size:12.5px;font-weight:800}
.lesson{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px;font-size:15px;font-weight:850}
.lesson-no{padding:3px 9px;border-radius:999px;color:#fff;background:var(--violet-900);font-size:12px;font-weight:900}
.head>img{height:84px;margin:-6px 0 -8px}
.print-name{display:none;gap:18px;margin-top:8px;font-size:13px;font-weight:800}
.print-name span{flex:1;border-bottom:1px solid #9aa1ad;padding-bottom:2px}
.mini{color:var(--muted);font-size:11.5px;font-weight:800}
.mini b{color:var(--violet-900)}
.coach{position:absolute;top:8mm;right:13mm;display:flex;align-items:flex-end;gap:4px}
.coach img{height:70px}
.coach .say{margin-bottom:22px;padding:7px 12px;border:2px solid #2e2848;border-radius:14px 14px 4px 14px;background:#fff;font-size:13px;font-weight:850;line-height:1.4}
.coach .say b{color:var(--violet)}
.page-top{min-height:66px;padding-right:250px}
.title-row{display:flex;align-items:center;gap:9px;margin-top:14px}
.number{display:grid;place-items:center;flex-shrink:0;width:30px;height:30px;border-radius:9px;color:#fff;background:var(--ink);font-size:15px;font-weight:900}
h1,h2{margin:0;font-size:21px;line-height:1.3;letter-spacing:-.03em;font-weight:900}
.intro{margin:5px 0 10px;color:var(--muted);font-size:13.5px;font-weight:700}
.part{display:inline-block;margin:12px 0 6px;padding:3px 12px;border-radius:999px;color:#1f5f8f;background:#e3f1fb;font-size:12.5px;font-weight:900}
.top-note{margin:0 0 10px;padding:8px 12px;border:1px solid var(--cyan-line);border-radius:12px;background:var(--cyan-soft);font-size:12.5px;font-weight:750;line-height:1.6}
.top-note b{color:var(--violet)}
.feedback{margin-top:5px;color:var(--ok);font-size:12.5px;font-weight:800;line-height:1.5}
.feedback.warm{color:#a35f12}
.feedback:empty{display:none}
.key{display:none;margin:6px 0 0;padding:6px 9px;border-radius:9px;background:#f6f3fb;color:#4b3f73;font-size:12px;font-weight:750;line-height:1.6}
.show-key .key{display:block}
.teacher-note{margin:10px 0 0;padding:8px 12px;border:1px dashed #d4c9ee;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:700}
.listen{display:inline-flex;align-items:center;gap:3px;min-height:30px;padding:0 11px;border:1px solid var(--cyan-line);border-radius:999px;background:var(--cyan-soft);color:#1f5f8f;font-size:12.5px;font-weight:900}
.listen.slow{border-color:#e3dcf3;background:#f6f3fb;color:var(--violet)}
.listen.playing{box-shadow:0 0 0 3px rgba(75,201,220,.35)}

/* 보기 고르기(공통) */
.option{position:relative;display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 11px;border:1.5px solid #cfc9bd;border-radius:10px;background:#fff;font-size:15px;font-weight:800;line-height:1.4;cursor:pointer}
.option:hover{border-color:var(--cyan-line)}
.option input{position:absolute;opacity:0;width:1px;height:1px}
.radio-mark{flex-shrink:0;width:14px;height:14px;border:1.5px solid #9995a1;border-radius:50%}
.option:has(input:checked){border-color:var(--violet);background:var(--violet-soft)}
.option input:checked+.radio-mark{border:4.5px solid var(--violet)}
.option:has(input:focus-visible){outline:3px solid rgba(75,201,220,.6);outline-offset:2px}
.option.right{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.option.retry{border-color:var(--warm)!important;background:var(--warm-bg)!important}

/* 1쪽 ㉮ 소리 듣고 글자 고르기 */
.sounds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sound{padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;break-inside:avoid}
.sound-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sound-no{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;background:var(--violet-900);font-size:11px;font-weight:900}
.heard{font-size:18px;font-weight:900;color:#1f5f8f;letter-spacing:.02em}
.heard small{margin-left:4px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:0}
.sound .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.sound .option{justify-content:center;font-size:16px}
.sound-hint{margin:2px 0 0;color:var(--muted);font-size:11.5px;font-weight:700}
.sound-ctx{margin-top:4px;color:#465269;font-size:12.5px;font-weight:700}
/* 1쪽 ㉯ 늘려 읽기 */
.ladders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ladder{padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;break-inside:avoid}
.ladder ol{margin:0;padding:0;list-style:none}
.ladder li{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:3px 0;padding:3px 8px;border-radius:9px;background:linear-gradient(155deg,#fff,#f8f6fd);font-size:18px;font-weight:850}
.ladder li:nth-child(2){padding-left:16px}.ladder li:nth-child(3){padding-left:24px}
.ladder li mark{padding:0 1px;border-radius:3px;background:linear-gradient(transparent 55%,#ffd8a8 55%);color:inherit}
.ladder li .listen{min-height:26px;padding:0 8px;font-size:11.5px}
.ladder .say-it{margin-top:5px;color:var(--muted);font-size:11.5px;font-weight:800}
.ladder .say-it b{color:#1f5f8f}
.reps{display:flex;align-items:center;gap:5px;margin-top:6px;color:var(--muted);font-size:11.5px;font-weight:800}
.rep{width:22px;height:22px;padding:0;border:1.5px solid #b9b3a8;border-radius:50%;background:#fff}
.rep[aria-pressed=true]{border-color:var(--violet);background:radial-gradient(circle,var(--violet) 0 45%,#fff 47%)}

/* 2쪽 ㉮ 낱말 카드 잇기 */
.link-set{position:relative;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;break-inside:avoid}
.link-grid{position:relative;display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.45fr);column-gap:70px;row-gap:9px}
.link-card{position:relative;z-index:2;display:flex;align-items:center;min-height:46px;padding:7px 12px;border:1.5px solid #cfc9bd;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;font-weight:850;line-height:1.45;text-align:left;cursor:pointer}
.link-card.l{grid-column:1;justify-content:center;background:linear-gradient(155deg,#fff,#f8f6fd);font-size:17.5px}
.link-card.r{grid-column:2}
.link-card .dot{position:absolute;top:50%;width:13px;height:13px;margin-top:-6.5px;border:2.5px solid #8d83a3;border-radius:50%;background:#fff}
.link-card.l .dot{right:-8px}.link-card.r .dot{left:-8px}
.link-card:hover{border-color:var(--cyan-line)}
.link-card.sel{border-color:var(--violet);background:var(--violet-soft);box-shadow:0 0 0 3px rgba(141,112,215,.18)}
.link-card.sel .dot{border-color:var(--violet);background:var(--violet)}
.link-card.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.link-card.ok .dot{border-color:var(--ok);background:var(--ok)}
.link-card.bad{border-color:var(--warm);background:var(--warm-bg);animation:lk-shake .35s}
@keyframes lk-shake{25%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.link-card .slot{display:inline-block;min-width:84px;margin:0 3px;border-bottom:2px solid var(--violet);color:transparent}
.link-card .slot.filled{min-width:0;color:var(--violet);border-bottom-color:transparent;background:linear-gradient(transparent 55%,var(--mark) 55%)}
.link-svg{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;overflow:visible}
/* 쓰기 줄(공통) */
.write-block{margin-top:7px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;break-inside:avoid}
.write-q{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:850;line-height:1.45}
.write-q .qid{flex-shrink:0;padding:1px 9px;border-radius:999px;color:#fff;background:var(--violet-900);font-size:11px;font-weight:900}
.starter{margin:3px 0 0;color:var(--muted);font-size:12.5px;font-weight:750}
.starter b{color:var(--violet)}
.lines textarea{display:block;width:100%;min-height:76px;height:76px;padding:7px 4px 4px;border:0;border-bottom:1.5px solid #9aa1ad;background:transparent;color:var(--ink);font-size:17px;font-weight:700;line-height:1.5;resize:vertical;overflow:hidden}
.lines textarea:focus{outline:none;border-bottom-color:var(--violet)}
.answer-mirror,.paper-lines{display:none}

/* 3쪽 새 이야기 */
.story-box{padding:12px 16px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;break-inside:avoid}
.story-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.story-head h3{margin:0;padding:2px 12px;border-radius:999px;color:#fff;background:var(--violet-900);font-size:14px;font-weight:900}
.story{margin:0;font-size:17.5px;font-weight:700;line-height:1.8}
.sent{border-radius:4px;transition:background .2s}
.sent.on{background:linear-gradient(transparent 50%,#d8f3f7 50%)}
.read-log{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;font-weight:850}
.timer{min-height:32px;padding:0 12px;border:1px solid #d9cff5;border-radius:999px;background:#fff;color:var(--violet);font-size:12.5px;font-weight:900}
.timer.running{border-color:var(--violet);color:#fff;background:var(--violet)}
.times{display:flex;gap:10px;color:var(--muted);font-size:12.5px;font-weight:800}
.times b{color:var(--violet-900);font-variant-numeric:tabular-nums}
.times-paper{display:none}
.qs{display:grid;gap:7px}
.q{padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;break-inside:avoid}
.q.wide{grid-column:1/-1}
.q h3{display:inline-block;margin:0 0 4px;padding:3px 11px;border:1.5px solid var(--cyan-line);border-radius:14px 14px 14px 4px;background:var(--cyan-soft);font-size:14px;font-weight:850;line-height:1.45}
.q .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.q .option{min-height:31px;padding:3px 10px;font-size:14.5px}

/* 4쪽 내 이야기 */
.picture{margin:0;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff}
.picture img{display:block;width:100%;height:225px;object-fit:contain;border-radius:10px;background:#f6f5ed}
.picture figcaption{margin:5px 2px 0;color:var(--muted);font-size:11px;font-weight:750}
.help-words{margin:8px 0 2px;padding:7px 12px;border-radius:10px;background:#f6f3fb;color:#4b3f73;font-size:12.5px;font-weight:750;line-height:1.7}
.help-words b{color:var(--violet)}
.assembled{margin-top:8px;padding:10px 14px;border:1.5px dashed #d4c9ee;border-radius:12px;background:#fbfaff;break-inside:avoid}
.assembled h3{margin:0 0 4px;color:var(--violet);font-size:13.5px;font-weight:900}
.story-output{margin:0;font-size:16.5px;font-weight:750;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.write-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.read-mine{min-height:42px;padding:0 18px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#2785c7,#4bc9dc);font-size:14.5px;font-weight:900}
.read-mine.ready{animation:read-glow 1.4s ease-in-out infinite alternate}
@keyframes read-glow{from{box-shadow:0 6px 14px rgba(39,133,199,.28)}to{box-shadow:0 0 0 6px rgba(75,201,220,.35),0 6px 18px rgba(39,133,199,.4)}}
.count{color:var(--muted);font-size:12px;font-weight:700}

/* 쪽 아래 */
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}
.pager{display:flex;gap:6px}
.wm{margin-right:8px;opacity:.45;font-size:9px}
.pager a{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-decoration:none;font-size:12px;font-weight:800}
.finish-btn{display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border:0;border-radius:10px;color:#fff;background:var(--ok);font-size:13.5px;font-weight:900}

/* 실행기능: 시작 전 계획 · 학습 시간 · 돌아보기 */
.ef-clock{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:16px;font-weight:850}
.ef-clock b{color:var(--violet);font-variant-numeric:tabular-nums}
.ef-clock .ef-times{font-size:13px}.ef-clock .away{color:#b06a1f}
.ef-cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(39,52,78,.42)}
.ef-card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;border:1.5px solid #ddd3f3;border-radius:22px;background:var(--paper);box-shadow:0 20px 50px rgba(37,20,78,.25)}
.ef-card-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.ef-card-head img{height:74px}
.ef-card h2{font-size:22px}
.ef-card .lead{margin:4px 0 0;color:var(--muted);font-size:13.5px;font-weight:750}
.ef-list,.miss-list{display:grid;gap:6px;margin:12px 0;padding:0;list-style:none}
.ef-list li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14.5px;font-weight:800}
.ef-list li i{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;color:#fff;background:var(--ink);font-style:normal;font-size:13px;font-weight:900}
.ef-list li small{color:var(--muted);font-size:12px;font-weight:750}
.ef-q{margin:14px 0 6px;font-size:15.5px;font-weight:900}
.ef-est{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ef-est button{min-height:44px;border:1.5px solid #cfc9bd;border-radius:12px;background:#fff;color:var(--ink);font-size:14px;font-weight:900}
.ef-est button[aria-pressed=true]{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
.ef-note{margin:10px 0 0;color:var(--muted);font-size:12px;font-weight:700}
.ef-go{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#4b24a5,#8d70d7);font-size:16px;font-weight:900}
.ef-go:disabled{opacity:.45;cursor:not-allowed}
.ef-go.sub{margin-top:6px;border:1px solid var(--line);color:var(--ink);background:#fff;font-size:14px;min-height:42px}
.miss-list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:800}
.miss-list li b{padding:2px 9px;border-radius:999px;color:#fff;background:var(--ink);font-size:12px}
.miss-flash{animation:miss-flash 1.6s ease-out}
@keyframes miss-flash{0%,60%{box-shadow:0 0 0 4px rgba(214,138,31,.55)}100%{box-shadow:0 0 0 0 rgba(214,138,31,0)}}
.ef-toast{position:fixed;z-index:60;left:50%;bottom:22px;max-width:min(520px,calc(100vw - 32px));padding:11px 16px;border-radius:13px;color:#fff;background:#403a46;font-size:13.5px;font-weight:800;transform:translate(-50%,20px);opacity:0;transition:.25s;pointer-events:none}
.ef-toast.show{opacity:1;transform:translate(-50%,0)}
.time-card{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.time-card div{padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center}
.time-card span{display:block;color:var(--muted);font-size:11.5px;font-weight:800}
.time-card b{display:block;margin-top:2px;color:var(--violet-900);font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.time-card .away b{color:#b06a1f}
.time-compare{margin:6px 0 0;padding:8px 12px;border-radius:11px;background:var(--cyan-soft);border:1px solid var(--cyan-line);font-size:14px;font-weight:850}
.time-paper{display:none}
.time-paper .row{display:flex;flex-wrap:wrap;gap:10px 22px;margin:6px 0;font-size:15px;font-weight:850}
.blank{display:inline-block;min-width:54px;border-bottom:1.5px solid #9aa1ad;text-align:center;color:var(--violet)}
.ref{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;break-inside:avoid}
.ref h3{margin:0 0 6px;font-size:15px;font-weight:900}
.ref h3 i{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:6px;border-radius:50%;color:#fff;background:var(--violet-900);font-style:normal;font-size:12px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

const shuffle = (a, seed) => { const o = [...a]; let s = seed || 7; for (let i = o.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
function emit(type, detail) { try { window.dispatchEvent(new CustomEvent("oc:track", { detail: { type, page: RV.id, ...detail } })); } catch (e) {} }

// ── 소리: 글 → 클립(make_review.py 가 만든 RV.audio). 클립이 없으면 조용히 넘어간다(기계음 쓰지 않음). ──
let nowAudio = null, nowBtn = null, seqStop = null;
function stopAudio() { if (nowAudio) { nowAudio.pause(); nowAudio = null; } if (seqStop) { seqStop(); seqStop = null; } document.querySelectorAll(".listen.playing").forEach(x => x.classList.remove("playing")); document.querySelectorAll(".sent.on").forEach(x => x.classList.remove("on")); }
function clip(text) { const f = RV.audio[text]; return f ? "assets/audio/" + f + ".mp3" : null; }
function playText(text, btn, slow) {
  const src = clip(text); stopAudio(); if (!src) return Promise.resolve();
  return new Promise(res => { const a = new Audio(src); a.playbackRate = slow ? 0.8 : 1; nowAudio = a; if (btn) btn.classList.add("playing");
    a.onended = a.onerror = () => { if (btn) btn.classList.remove("playing"); if (nowAudio === a) nowAudio = null; res(); }; a.play().catch(() => res()); });
}
const listen = (text, label) => `<button type="button" class="listen" data-say="${esc(text)}" aria-label="${esc(label || "듣기")}">🔊${label ? " " + esc(label) : ""}</button>`;
document.addEventListener("click", e => { const b = e.target.closest(".listen[data-say]"); if (b) playText(b.dataset.say, b, b.classList.contains("slow")); });

function choice(grp, value, text) { return `<label class="option"><input type="radio" name="${grp}" value="${value}" data-track="answer"><span class="radio-mark" aria-hidden="true"></span><span>${text}</span></label>`; }
function coach(img, say) { return `<div class="coach"><div class="say">${say}</div><img src="assets/jelly-${img}.png" alt="젤리 선생님"></div>`; }
function top(p) { return `<header class="page-top"><div class="mini"><b>${esc(RV.series)}</b> · 「${esc(RV.story)}」 복습 · ${esc(p.mini)}</div></header>${coach(p.jelly, p.say)}`; }
function foot(i, prev, next) {
  const pager = `${prev ? `<a href="#p${i - 1}">← 이전</a>` : ""}${next === "done" ? `<button type="button" class="finish-btn" id="efDone">다 했어요 ✓</button>` : next ? `<a href="#p${i + 1}">다음: ${esc(next)} →</a>` : `<a href="#p1">처음으로 ↑</a>`}`;
  return `<footer class="foot"><span>${i === 1 ? '<span class="wm" id="wm" aria-hidden="true"></span>' : ""}Oncuvate · 자체 제작 텍스트${i === 4 && RV.p4.picture ? " · 그림 「" + esc(RV.story) + "」 수업 장면" : ""} · ${i} / 5</span><div class="pager">${pager}</div></footer>`;
}

document.querySelectorAll(".sound").forEach((el, i) => {

    else { lab.classList.add("retry"); fb.className = "feedback warm"; fb.textContent = v === x.heard ? "들리는 소리 그대로 골랐어요. 글자로는 어떻게 쓸까요?" : "다시 들어 보고 골라요."; }
    emit("answer", { activity: "sound_spelling", item: x.word, response: v, correct: v === x.word, attempt: tries, rule: x.rule });
  });
});
document.addEventListener("click", e => { const r = e.target.closest(".rep"); if (!r) return; const on = r.getAttribute("aria-pressed") !== "true"; r.setAttribute("aria-pressed", on); emit("reread", { activity: "ladder", on }); });

// ── 2쪽 동작: 카드 잇기 ──
const set = $("links"); let selL = null, selR = null;
function drawLine(li, ri) {
  const svg = set.querySelector(".link-svg"), box = set.getBoundingClientRect();
  const d1 = set.querySelector(`.l[data-i="${li}"] .dot`).getBoundingClientRect(), d2 = set.querySelector(`.r[data-i="${ri}"] .dot`).getBoundingClientRect();
  const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
  ln.setAttribute("x1", d1.left + d1.width / 2 - box.left); ln.setAttribute("y1", d1.top + d1.height / 2 - box.top);
  ln.setAttribute("x2", d2.left + d2.width / 2 - box.left); ln.setAttribute("y2", d2.top + d2.height / 2 - box.top);
  ln.setAttribute("stroke", "#27866a"); ln.setAttribute("stroke-width", "3"); ln.setAttribute("stroke-linecap", "round"); ln.dataset.li = li; ln.dataset.ri = ri; svg.append(ln);
}
function redraw() { const done = [...set.querySelectorAll(".link-svg line")].map(l => [l.dataset.li, l.dataset.ri]); set.querySelector(".link-svg").innerHTML = ""; done.forEach(([a, b]) => drawLine(a, b)); }
window.addEventListener("resize", redraw); window.addEventListener("beforeprint", redraw);
let linkTries = 0;
set.addEventListener("click", e => {
  const c = e.target.closest(".link-card"); if (!c || c.classList.contains("ok")) return;
  if (c.classList.contains("l")) { set.querySelectorAll(".l.sel").forEach(x => x.classList.remove("sel")); selL = c; } else { set.querySelectorAll(".r.sel").forEach(x => x.classList.remove("sel")); selR = c; }
  c.classList.add("sel");
  if (!selL || !selR) return;
  const li = +selL.dataset.i, ri = +selR.dataset.i, ok = li === ri, fb = set.querySelector(".feedback"); linkTries++;
  emit("answer", { activity: "word_link", item: s2.links[li].word, response: s2.links[ri].ctx, correct: ok, attempt: linkTries });
  if (ok) { [selL, selR].forEach(x => { x.classList.remove("sel"); x.classList.add("ok"); }); const slot = selR.querySelector(".slot"); slot.textContent = s2.links[li].fill; slot.classList.add("filled");
    drawLine(li, ri); fb.className = "feedback"; fb.textContent = set.querySelectorAll(".l.ok").length === s2.links.length ? "모두 이었어요! 빈칸에 넣어 소리 내어 읽어 봐요." : "잘 이었어요!"; }
  else { const a = selL, b = selR; [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("bad"); }); setTimeout(() => [a, b].forEach(x => x.classList.remove("bad")), 400);
    fb.className = "feedback warm"; fb.textContent = s2.linkWrong; }
  selL = selR = null;
});

// ── 쓰기 칸(공통): 높이 맞추기 + 인쇄 거울 ──
function fit(t) { t.style.height = "auto"; t.style.height = Math.max(76, t.scrollHeight) + "px"; }
document.addEventListener("input", e => { if (e.target.matches(".lines textarea")) { fit(e.target); e.target.nextElementSibling.textContent = e.target.value; if (e.target.closest("#mine")) updateMine(); } });

// ── 3쪽 동작: 글 듣기(문장마다 밝힘) · 읽기 시간 · 질문 ──
function playStory(btn, slow) {
  const was = btn.classList.contains("playing"); stopAudio(); if (was) return;
  let stop = false; seqStop = () => { stop = true; }; btn.classList.add("playing");
  const sents = [...document.querySelectorAll("#p3 .sent")];
  (async () => { for (let k = 0; k < sents.length && !stop; k++) { sents[k].classList.add("on"); const src = clip(s3.sentences[k]);
      if (src) await new Promise(res => { const a = new Audio(src); a.playbackRate = slow ? 0.8 : 1; nowAudio = a; a.onended = a.onerror = res; a.play().catch(res); });
      sents[k].classList.remove("on"); }
    btn.classList.remove("playing"); })();
}
$("storyPlay").onclick = e => playStory(e.currentTarget, false);
$("storySlow").onclick = e => playStory(e.currentTarget, true);
const readTimes = []; let t0 = 0;
$("timer").onclick = e => { const b = e.currentTarget;
  if (!t0) { if (readTimes.length >= 3) readTimes.length = 0; t0 = performance.now(); b.classList.add("running"); b.textContent = "⏹ 다 읽었어요"; return; }
  const sec = Math.round((performance.now() - t0) / 1000); t0 = 0; readTimes.push(sec); b.classList.remove("running"); b.textContent = readTimes.length >= 3 ? "⏱ 다시 재기" : "⏱ 읽기 시작";
  [...$("times").querySelectorAll("b")].forEach((x, k) => x.textContent = readTimes[k] != null ? readTimes[k] + "초" : "-");
  document.querySelectorAll(".times-paper .blank").forEach((x, k) => x.textContent = readTimes[k] != null ? readTimes[k] : " ");
  emit("read_time", { activity: "new_story_reading", attempt: readTimes.length, seconds: sec, syllables: s3.syllables });
};
document.querySelectorAll(".q").forEach((el, i) => {
  const x = s3.questions[i], fb = el.querySelector(".feedback"); let tries = 0;
  el.addEventListener("change", e => { tries++; const v = +e.target.value; el.querySelectorAll(".option").forEach(o => o.classList.remove("right", "retry"));
    e.target.closest(".option").classList.add(v === x.a ? "right" : "retry");
    fb.className = v === x.a ? "feedback" : "feedback warm"; fb.textContent = v === x.a ? (tries > 1 ? "고쳐 골랐어요! " : "맞아요! ") + x.why : x.hint;
    emit("answer", { activity: "new_story_question", item: "q" + (i + 1), response: v, correct: v === x.a, attempt: tries }); });
});

function updateMine() { const n = [...document.querySelectorAll("#mine textarea")].filter(t => t.value.trim()).length; $("mineCount").textContent = `${n} / ${s4.questions.length}`;
  $("readMine").classList.toggle("ready", n === s4.questions.length); if (!$("assembled").hidden) $("storyOut").textContent = mineText(); }
$("readMine").onclick = e => { const open = $("assembled").hidden; $("assembled").hidden = !open; e.currentTarget.setAttribute("aria-expanded", open); $("storyOut").textContent = mineText(); if (open) emit("read_own_story", { length: mineText().length }); };

// ── 도구 막대 ──
$("keyBtn").onclick = e => { const on = !document.body.classList.contains("show-key"); document.body.classList.toggle("show-key", on); e.currentTarget.setAttribute("aria-pressed", on); };
function doPrint(blank) { document.body.classList.toggle("print-blank", blank); redraw(); setTimeout(() => { window.print(); }, 50); }
$("blankPrint").onclick = () => doPrint(true); $("answerPrint").onclick = () => doPrint(false);
window.addEventListener("afterprint", () => document.body.classList.remove("print-blank"));

// ── 실행기능: 계획 → 시간 → 빈 곳 확인 → 돌아보기 (바른 문장 쓰기 복습과 같은 방식, 기기 저장만) ──
const KEY = "oncuvate-folktale:" + RV.id + ":ef", IDLE = 180000;
let st = { est: null, start: null, end: null, active: 0, away: 0, awayCount: 0, ref: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch (e) {}
let last = Date.now(), hiddenAt = null;
const running = () => st.start && !st.end;
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const mins = ms => Math.round(ms / 60000);
const hm = t => { const d = new Date(t); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
function toast(m) { const t = $("efToast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 3200); }
function settle(now) { const gap = now - last; if (gap <= 0) return; if (gap >= IDLE) { st.away += gap; st.awayCount++; } else st.active += gap; last = now; }
function activity() { if (!running() || document.hidden) return; const now = Date.now(); const idle = now - last >= IDLE; settle(now); save(); if (idle) toast("다시 왔네요! 멈춘 시간은 따로 적어 두었어요."); }
["pointerdown", "keydown", "input"].forEach(ev => document.addEventListener(ev, activity, true));
document.addEventListener("visibilitychange", () => { if (!running()) return; const now = Date.now();
  if (document.hidden) { settle(now); hiddenAt = now; } else if (hiddenAt) { const gap = now - hiddenAt; if (gap >= 5000) { st.away += gap; st.awayCount++; toast("다시 왔네요! 다른 화면에 있던 시간은 「멈춘 시간」으로 적었어요."); } last = now; hiddenAt = null; } save(); });
setInterval(() => { if (!running()) return; const now = Date.now(), gap = document.hidden ? 0 : now - last, idle = gap >= IDLE;
  $("efActive").textContent = mmss(st.active + (idle ? 0 : gap)); $("efAway").textContent = mmss(st.away + (idle ? gap : 0)); }, 1000);
$("efClock").onclick = e => { const t = e.currentTarget.querySelector(".ef-times"); t.hidden = !t.hidden; e.currentTarget.setAttribute("aria-expanded", !t.hidden); };
function fill() {
  if (!st.end) return; const total = st.end - st.start;
  $("tStart").textContent = hm(st.start); $("tEnd").textContent = hm(st.end); $("tTotal").textContent = mins(total) + "분";
  $("tEst").textContent = st.est ? st.est + "분" : "-"; $("tActive").textContent = mins(st.active) + "분"; $("tAway").textContent = mins(st.away) + "분";
  const real = mins(st.active); let cmp = "예상한 시간을 고르지 않았어요.";
  if (st.est) cmp = real < st.est - 2 ? `예상(${st.est}분)보다 빨리 끝냈어요!` : real > st.est + 2 ? `예상(${st.est}분)보다 ${real - st.est}분 더 걸렸어요. 어디서 오래 걸렸는지 떠올려 봐요.` : `예상(${st.est}분)과 비슷하게 끝냈어요!`;
  $("tCompare").textContent = cmp;
  $("pEst").textContent = st.est || " "; $("pStart").textContent = hm(st.start); $("pEnd").textContent = hm(st.end); $("pReal").textContent = real;
  $("efResume").hidden = false;
}
let est = null;
function openCover() { $("efStart").hidden = false; $("efNew").hidden = !running() && !st.end; $("efGo").textContent = running() ? "이어서 하기" : "시작하기"; $("efGo").disabled = !running() && !est; }
$("efEst").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; est = +b.dataset.min; $("efEst").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("efGo").disabled = false; });
$("efGo").onclick = () => { if (!running()) { st = { est, start: Date.now(), end: null, active: 0, away: 0, awayCount: 0, ref: {} }; emit("plan", { estimate_min: est }); } last = Date.now(); save(); $("efStart").hidden = true; $("efClock").hidden = false; };
$("efNew").onclick = () => { st = { est: null, start: null, end: null, active: 0, away: 0, awayCount: 0, ref: {} }; save(); est = null; $("efEst").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", false)); openCover(); };
function findMissing() {
  const out = [];
  document.querySelectorAll(".sound").forEach((el, i) => { if (!el.querySelector(".option.right")) out.push({ page: "1쪽", text: `소리 듣고 글자 고르기 ${i + 1}번`, el }); });
  if (set.querySelectorAll(".l.ok").length < s2.links.length) out.push({ page: "2쪽", text: "낱말 카드 잇기", el: set });
  document.querySelectorAll("#p2 .write-block").forEach(el => { if (!el.querySelector("textarea").value.trim()) out.push({ page: "2쪽", text: el.dataset.label, el }); });
  if (!readTimes.length) out.push({ page: "3쪽", text: "새 이야기 소리 내어 읽기", el: $("timer").closest(".story-box") });
  document.querySelectorAll(".q").forEach((el, i) => { if (!el.querySelector(".option.right")) out.push({ page: "3쪽", text: `이야기 확인하기 ${i + 1}번`, el }); });
  document.querySelectorAll("#mine .write-block").forEach((el, i) => { if (!el.querySelector("textarea").value.trim()) out.push({ page: "4쪽", text: `내 이야기 ${i + 1}번`, el }); });
  return out;
}
let missFirst = null;
function finishNow() { if (!running()) { location.hash = "#p5"; return; } const now = Date.now(); settle(now); st.end = now; save(); $("efClock").hidden = true; fill(); emit("finish", { active_ms: st.active, away_ms: st.away }); $("efMiss").hidden = true; location.hash = "#p5"; }
document.addEventListener("click", e => { if (e.target.id === "efDone") { if (!st.start) { openCover(); return; } const m = findMissing(); if (!m.length) return finishNow();
  missFirst = m[0].el; $("efMissList").innerHTML = m.slice(0, 6).map(x => `<li><b>${x.page}</b><span>${esc(x.text)}</span></li>`).join("") + (m.length > 6 ? `<li><b>…</b><span>그 밖에 ${m.length - 6}곳</span></li>` : ""); $("efMiss").hidden = false; } });
$("efMissGo").onclick = () => { $("efMiss").hidden = true; if (missFirst) { missFirst.scrollIntoView({ behavior: "smooth", block: "center" }); missFirst.classList.add("miss-flash"); setTimeout(() => missFirst.classList.remove("miss-flash"), 1700); } };
$("efMissEnd").onclick = finishNow;
$("efResume").onclick = () => { st.end = null; last = Date.now(); save(); $("efResume").hidden = true; $("efClock").hidden = false; location.hash = "#p1"; toast("이어서 해요. 시간도 이어서 잴게요."); };
function collect() { const ch = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value); const sm = document.querySelector('input[name="efSmooth"]:checked');
  return { smooth: sm ? +sm.value : null, why: ch("efWhy"), skill: ch("efSkill"), better: ch("efBetter") }; }
function restoreRef() { const r = st.ref || {}; document.querySelectorAll('input[name="efSmooth"]').forEach(x => x.checked = +x.value === r.smooth);
  [["efWhy", "why"], ["efSkill", "skill"], ["efBetter", "better"]].forEach(([n, k]) => document.querySelectorAll(`input[name="${n}"]`).forEach(x => x.checked = (r[k] || []).includes(x.value))); }
$("efSave").onclick = () => { st.ref = collect(); save(); emit("reflection", st.ref); $("efMsg").textContent = "저장했어요!"; setTimeout(() => $("efMsg").textContent = "", 2500); };
// 결과표 그림(PNG) — 학습 시간 · 쪽별 활동 · 돌아보기
function wrapText(c, t, x, y, w, lh) { let line = "", yy = y; for (const ch of [...t]) { const tt = line + ch; if (c.measureText(tt).width > w && line) { c.fillText(line, x, yy); line = ch; yy += lh; } else line = tt; } if (line) c.fillText(line, x, yy); return yy + lh; }
$("efImg").onclick = async () => {
  try { await document.fonts.ready; } catch (e) {}
  const r = collect(), W = 1000, F = 'Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif', cv = document.createElement("canvas"), c = cv.getContext("2d");
  cv.width = W * 2; cv.height = 1400 * 2; c.scale(2, 2); c.fillStyle = "#fffdf7"; c.fillRect(0, 0, W, 1400);
  const g = c.createLinearGradient(0, 0, W, 0); g.addColorStop(0, "#f3edff"); g.addColorStop(1, "#e6f6f9"); c.fillStyle = g; c.fillRect(0, 0, W, 120);
  c.fillStyle = "#35206f"; c.font = `900 34px ${F}`; c.fillText(`「${RV.story}」 복습 결과표`, 40, 66); c.fillStyle = "#6f7789"; c.font = `800 17px ${F}`; c.fillText(RV.series + " · " + RV.seriesSub, 40, 98);
  let y = 170; const head = t => { c.fillStyle = "#27344e"; c.font = `900 22px ${F}`; c.fillText(t, 40, y); y += 14; c.fillStyle = "#e2ddd2"; c.fillRect(40, y, W - 80, 2); y += 30; };
  const row = (k, v) => { c.fillStyle = "#6f7789"; c.font = `800 17px ${F}`; c.fillText(k, 56, y); c.fillStyle = "#27344e"; c.font = `900 19px ${F}`; y = wrapText(c, v, 300, y, W - 360, 28) + 6; };
  head("학습 시간");
  if (st.start) { row("시작 · 끝", `${hm(st.start)} → ${st.end ? hm(st.end) : "진행 중"}`); row("예상한 시간", st.est ? st.est + "분" : "-"); row("실제 학습 시간", mins(st.active) + "분"); row("멈춘 시간", mins(st.away) + "분"); } else row("학습 시간", "시작하기를 누르지 않았어요");
  y += 10; head("쪽별 활동");
  const sOk = document.querySelectorAll(".sound .option.right").length, lOk = set.querySelectorAll(".l.ok").length, qOk = document.querySelectorAll(".q .option.right").length, mine = [...document.querySelectorAll("#mine textarea")].filter(t => t.value.trim()).length;
  row("1쪽 소리와 글자", `${sOk} / ${s1.sounds.length} · 늘려 읽기 ${document.querySelectorAll('.rep[aria-pressed="true"]').length}번`);
  row("2쪽 낱말 잇기", `${lOk} / ${s2.links.length}`);
  row("3쪽 새 이야기", `읽기 ${readTimes.length}번${readTimes.length ? " (" + readTimes.map(s => s + "초").join(" · ") + ")" : ""} · 질문 ${qOk} / ${s3.questions.length}`);
  row("4쪽 내 이야기", `${mine} / ${s4.questions.length}칸`);
  y += 10; head("돌아보기");
  const faces = { 1: "😣 많이 막혔어요", 2: "🙁 조금 막혔어요", 3: "😐 보통이에요", 4: "🙂 잘 됐어요", 5: "😄 술술 됐어요" };
  row("술술 되었나요", r.smooth ? faces[r.smooth] : "-"); row("그 까닭", r.why.join(", ") || "-"); row("기억할 방법", r.skill.join(", ") || "-"); row("더 잘할 점", r.better.join(", ") || "-");
  const H = Math.ceil(y + 30), out = document.createElement("canvas"); out.width = W * 2; out.height = H * 2; out.getContext("2d").drawImage(cv, 0, 0);
  const a = document.createElement("a"), d = new Date(); a.download = `${RV.story}_복습_결과표_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.png`; a.href = out.toDataURL("image/png"); a.click();
};
try { const child = window.ONCUVATE && window.ONCUVATE.child; if (child) $("wm").textContent = String(child); } catch (e) {}
restoreRef(); fill();
if (running()) { $("efClock").hidden = false; openCover(); } else if (!st.end) openCover();
})();
</script>
