<!doctype html>
<html lang="ko" data-lesson-id="opposite-press" data-lesson-title="반대로 누르기 행동억제 게임" data-lesson-version="1.1.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>반대로 누르기</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/opposite-press.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   kinds  : 그림 가짓수. 하나에
            name      카드 그림 이름(코치 말풍선에 씀: 「해를 보면 '밤'이에요」)
            word      이 그림이 뜻하는 낱말(단추에 쓰는 말)
            opposite  반대 그림의 key — 이 그림을 보면 그 그림의 word 단추를 누른다
            img 또는 emoji  카드와 단추에 나오는 그림. 둘 다 없으면 카드에 name 글자가 나온다
            ※ 적은 순서가 단추 순서
   rounds : 판 순서. 판 하나에
            kinds  이 판에 나올 그림 key 목록(반대 짝째로 넣어 2가지 → 4가지 → 6가지로 늘리기)
            count  카드 수(그림마다 고르게, 같은 그림이 오래 이어지지 않게 섞음)
            rule   'opposite'(반대로, 기본) 또는 'same'(똑같이 — 몸풀기용)
*/
var CARD = 'assets/images/cards/';
var GAME = {
  activityId: 'opposite-press',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「행동억제를 위한 훈련」 · 그림 © Oncuvate',
  kinds: {
    sun:      { name: '해',     word: '낮', opposite: 'star',     img: CARD + 'sun.webp' },
    star:     { name: '별',     word: '밤', opposite: 'sun',      img: CARD + 'star.webp' },
    snowman:  { name: '눈사람', word: '눈', opposite: 'umbrella', emoji: '⛄' },
    umbrella: { name: '우산',   word: '비', opposite: 'snowman',  emoji: '☔' },
    cat:      { name: '고양이', word: '야옹', opposite: 'dog',    img: CARD + 'cat.webp' },
    dog:      { name: '강아지', word: '멍멍', opposite: 'cat',    img: CARD + 'dog.webp' }
  },
  rounds: [
    { id: 'r1', kinds: ['sun', 'star'], count: 12 },                                        // 짝 1 · 그림 2가지
    { id: 'r2', kinds: ['sun', 'star', 'snowman', 'umbrella'], count: 16 },                 // 짝 2 · 그림 4가지
    { id: 'r3', kinds: ['sun', 'star', 'snowman', 'umbrella', 'cat', 'dog'], count: 20 }    // 짝 3 · 그림 6가지
  ]
};

OppositePress.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
