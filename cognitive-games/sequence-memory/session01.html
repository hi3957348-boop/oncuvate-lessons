<!doctype html>
<html lang="ko" data-lesson-id="sequence-memory" data-lesson-title="순서대로 콕콕 순서 기억 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>순서대로 콕콕</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/sequence-memory.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   pool   : 쓸 그림 목록. key · label(낱말) · img(그림 파일) 또는 emoji. 둘 다 없으면 낱말 카드(숫자 「7」도 됨)
   rounds : 판 순서. 판 하나에
            mode         'forward'(본 순서대로) 또는 'backward'(거꾸로, 마지막 그림부터)
            length       한 번에 보여 줄 그림 수
            trials       같은 길이로 몇 번 할지
            distractors  받침에 섞을 「안 나온 그림」 수(기본 2)
   showMs / gapMs : 그림 하나 보여 주는 시간 / 그림 사이 쉬는 시간(밀리초)
*/
var CARD = 'assets/images/cards/';
var GAME = {
  activityId: 'sequence-memory',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「숫자 따라 말하기」「거꾸로 말하기」 · 그림 © Oncuvate',
  pool: [
    { key: 'bear',  label: '곰',     img: CARD + 'bear.webp' },
    { key: 'cat',   label: '고양이', img: CARD + 'cat.webp' },
    { key: 'dog',   label: '강아지', img: CARD + 'dog.webp' },
    { key: 'duck',  label: '오리',   img: CARD + 'duck.webp' },
    { key: 'fox',   label: '여우',   img: CARD + 'fox.webp' },
    { key: 'goat',  label: '염소',   img: CARD + 'goat.webp' },
    { key: 'hen',   label: '닭',     img: CARD + 'hen.webp' },
    { key: 'mouse', label: '쥐',     img: CARD + 'mouse.webp' },
    { key: 'snake', label: '뱀',     img: CARD + 'snake.webp' },
    { key: 'bee',   label: '벌',     img: CARD + 'bee.webp' },
    { key: 'fish',  label: '물고기', img: CARD + 'fish.webp' },
    { key: 'shell', label: '조개',   img: CARD + 'shell.webp' },
    { key: 'boat',  label: '배',     img: CARD + 'boat.webp' },
    { key: 'car',   label: '자동차', img: CARD + 'car.webp' },
    { key: 'truck', label: '트럭',   img: CARD + 'truck.webp' },
    { key: 'kite',  label: '연',     img: CARD + 'kite.webp' },
    { key: 'house', label: '집',     img: CARD + 'house.webp' },
    { key: 'chair', label: '의자',   img: CARD + 'chair.webp' },
    { key: 'box',   label: '상자',   img: CARD + 'box.webp' },
    { key: 'bell',  label: '종',     img: CARD + 'bell.webp' },
    { key: 'light', label: '전구',   img: CARD + 'light.webp' },
    { key: 'pen',   label: '펜',     img: CARD + 'pen.webp' },
    { key: 'spoon', label: '숟가락', img: CARD + 'spoon.webp' },
    { key: 'dish',  label: '접시',   img: CARD + 'dish.webp' },
    { key: 'hat',   label: '모자',   img: CARD + 'hat.webp' },
    { key: 'cake',  label: '케이크', img: CARD + 'cake.webp' },
    { key: 'bun',   label: '빵',     img: CARD + 'bun.webp' },
    { key: 'log',   label: '통나무', img: CARD + 'log.webp' },
    { key: 'tree',  label: '나무',   img: CARD + 'tree.webp' },
    { key: 'sun',   label: '해',     img: CARD + 'sun.webp' },
    { key: 'moon',  label: '달',     img: CARD + 'moon.webp' },
    { key: 'star',  label: '별',     img: CARD + 'star.webp' }
  ],
  rounds: [
    { id: 'r1', mode: 'forward',  length: 3, trials: 3 },
    { id: 'r2', mode: 'forward',  length: 4, trials: 3 },
    { id: 'r3', mode: 'backward', length: 3, trials: 3 },
    { id: 'r4', mode: 'backward', length: 4, trials: 3 }
  ]
};

SequenceMemory.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
