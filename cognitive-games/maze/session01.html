<!doctype html>
<html lang="ko" data-lesson-id="maze" data-lesson-title="젤리 미로 미로 찾기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>젤리 미로</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/maze.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   rounds    : 판 순서. 판 하나에 size(가로·세로 칸 수, 3~12). 미로는 판마다 새로 만든다
   player    : 움직이는 그림 · goal : 도착 그림
   hintSteps : 「길 보기」로 보여 줄 칸 수
*/
var GAME = {
  activityId: 'maze',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「미로 찾기」 · 그림 © Oncuvate',
  player: 'assets/images/jelly/jelly-default.webp',
  goal: 'assets/images/cards/cake.webp',
  hintSteps: 5,
  rounds: [
    { id: 'r1', size: 5 },
    { id: 'r2', size: 7 },
    { id: 'r3', size: 9 }
  ]
};

Maze.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
