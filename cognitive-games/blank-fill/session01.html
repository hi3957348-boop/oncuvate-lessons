<!doctype html>
<html lang="ko" data-lesson-id="blank-fill" data-lesson-title="빈칸 채우기 지나가는 숫자 기억 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>빈칸 채우기</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/blank-fill.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   rounds : 판 순서. 판 하나에
            kind     'number' 숫자 · 'syllable' 글자
            min max  숫자 범위(숫자일 때) · pool 글자 목록(글자일 때, 없으면 가·나·다… 기본)
            length   줄 칸 수(4~12) · blanks 빈칸 수(서로 붙지 않게 놓임)
            showMs   한 칸이 보이는 시간(1000 = 1초) · gapMs 칸 사이 쉬는 시간
            count    한 판 문제 수
*/
var GAME = {
  activityId: 'blank-fill',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「불러 주는 숫자를 잘 들으며 빈칸 채워 넣기」',
  rounds: [
    { id: 'r1', kind: 'number',   min: 0, max: 20, length: 6, blanks: 2, showMs: 1100, gapMs: 450, count: 3 },
    { id: 'r2', kind: 'number',   min: 0, max: 50, length: 8, blanks: 3, showMs: 1000, gapMs: 400, count: 3 },
    { id: 'r3', kind: 'syllable',                  length: 8, blanks: 3, showMs: 1000, gapMs: 400, count: 3 }
  ]
};

BlankFill.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
