<!doctype html>
<html lang="ko" data-lesson-id="odd-one-out" data-lesson-title="다른 하나 찾기 관련성 찾기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>다른 하나 찾기</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/odd-one.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   cards  : 그림 — key · label · img(또는 emoji)
   rounds : 판 순서. 판 하나에 items(문제들, 판 안에서 순서는 섞임)
            same  같은 무리 그림들(3~4개)
            odd   다른 하나
            why   [맞는 이유, 틀린 이유] — 빼면 이유 고르기 없이 다음 문제로
*/
var CARD = 'assets/images/cards/';
function C(label, file) { return { label: label, img: CARD + file + '.webp' }; }
var GAME = {
  activityId: 'odd-one-out',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「관련성 찾기」 · 그림 © Oncuvate',
  cards: {
    bear: C('곰', 'bear'), cat: C('고양이', 'cat'), dog: C('강아지', 'dog'), fox: C('여우', 'fox'),
    mouse: C('쥐', 'mouse'), goat: C('염소', 'goat'), snake: C('뱀', 'snake'),
    bee: C('벌', 'bee'), duck: C('오리', 'duck'), hen: C('닭', 'hen'), fish: C('물고기', 'fish'), shell: C('조개', 'shell'),
    car: C('자동차', 'car'), truck: C('트럭', 'truck'), boat: C('배', 'boat'),
    sun: C('해', 'sun'), moon: C('달', 'moon'), star: C('별', 'star'), kite: C('연', 'kite'), light: C('전구', 'light'),
    hat: C('모자', 'hat'), chair: C('의자', 'chair'), pen: C('펜', 'pen'),
    spoon: C('숟가락', 'spoon'), dish: C('접시', 'dish'), bun: C('빵', 'bun'), cake: C('케이크', 'cake')
  },
  rounds: [
    { id: 'r1', items: [   /* 1판: 종류가 아주 다른 하나 */
      { id: 'r1-animal', same: ['bear', 'cat', 'dog'],  odd: 'car',   why: ['나머지는 모두 동물이에요', '나머지는 모두 물에서 살아요'] },
      { id: 'r1-sky',    same: ['sun', 'moon', 'star'], odd: 'fish',  why: ['나머지는 모두 하늘에 있어요', '나머지는 모두 먹을 수 있어요'] },
      { id: 'r1-ride',   same: ['car', 'truck', 'boat'], odd: 'goat', why: ['나머지는 모두 타고 다녀요', '나머지는 모두 동물이에요'] },
      { id: 'r1-thing',  same: ['hat', 'chair', 'pen'], odd: 'fox',   why: ['나머지는 모두 물건이에요', '나머지는 모두 하늘을 날아요'] }
    ] },
    { id: 'r2', items: [   /* 2판: 생김새나 하는 일이 다른 하나 */
      { id: 'r2-wing',  same: ['bee', 'duck', 'hen'],    odd: 'cat',   why: ['나머지는 모두 날개가 있어요', '나머지는 모두 물에서 살아요'] },
      { id: 'r2-shine', same: ['sun', 'star', 'light'],  odd: 'chair', why: ['나머지는 모두 빛을 내요', '나머지는 모두 하늘에 있어요'] },
      { id: 'r2-water', same: ['fish', 'shell', 'boat'], odd: 'truck', why: ['나머지는 모두 물에서 볼 수 있어요', '나머지는 모두 바퀴가 있어요'] },
      { id: 'r2-legs',  same: ['dog', 'fox', 'mouse'],   odd: 'snake', why: ['나머지는 모두 다리가 있어요', '나머지는 모두 날개가 있어요'] }
    ] },
    { id: 'r3', items: [   /* 3판: 다섯 장, 비슷해 보여도 다른 하나 */
      { id: 'r3-fur',    same: ['bear', 'cat', 'fox', 'mouse'],  odd: 'duck',  why: ['나머지는 모두 털이 있어요', '나머지는 모두 물에서 살아요'] },
      { id: 'r3-water',  same: ['fish', 'shell', 'duck', 'boat'], odd: 'dog',  why: ['나머지는 모두 물에서 볼 수 있어요', '나머지는 모두 동물이에요'] },
      { id: 'r3-table',  same: ['spoon', 'dish', 'bun', 'cake'],  odd: 'pen',  why: ['나머지는 모두 식탁에서 볼 수 있어요', '나머지는 모두 먹을 수 있어요'] },
      { id: 'r3-skyall', same: ['sun', 'moon', 'star', 'kite'],   odd: 'light', why: ['나머지는 모두 하늘에서 볼 수 있어요', '나머지는 모두 빛을 내요'] }
    ] }
  ]
};

OddOne.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
