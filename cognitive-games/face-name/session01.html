<!doctype html>
<html lang="ko" data-lesson-id="face-name" data-lesson-title="이름 짝꿍 얼굴과 이름 기억 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>이름 짝꿍</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/face-name.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   faces  : 친구 얼굴 그림 목록(key · img)
   names  : 이름 목록 — 판마다 섞어서 얼굴에 붙인다(얼굴 수보다 넉넉히)
   rounds : 판 순서. 판 하나에
            count       친구 몇 명
            extraNames  이름표 받침에 섞을 「없는 친구 이름」 수
            lookSec     (선택) 외우는 시간(초). 비우면 「친구 수 × 8 + 6」초. 「다 외웠어요」로 먼저 끝낼 수 있다
*/
var KID = 'assets/images/kids/';
var GAME = {
  activityId: 'face-name',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「얼굴과 이름 함께 기억하기」 · 그림 © Oncuvate',
  faces: [
    { key: 'kid-a', img: KID + 'kid-a.png' },
    { key: 'kid-b', img: KID + 'kid-b.png' },
    { key: 'kid-c', img: KID + 'kid-c.png' },
    { key: 'kid-d', img: KID + 'kid-d.png' },
    { key: 'kid-e', img: KID + 'kid-e.png' },
    { key: 'kid-f', img: KID + 'kid-f.png' }
  ],
  names: ['민지', '하루', '서준', '지우', '도윤', '예나', '수아', '시우', '하윤', '준호', '다은', '유찬'],
  rounds: [
    { id: 'r1', count: 3, extraNames: 0 },
    { id: 'r2', count: 4, extraNames: 1 },
    { id: 'r3', count: 6, extraNames: 1 }
  ]
};

FaceName.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
