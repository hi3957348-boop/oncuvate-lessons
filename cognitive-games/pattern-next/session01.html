<!doctype html>
<html lang="ko" data-lesson-id="pattern-next" data-lesson-title="규칙 찾기 되풀이 규칙 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>규칙 찾기</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/pattern-next.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   cards  : 그림 — key · label · img(또는 emoji). 문제마다 이 가운데서 새로 뽑는다
   rounds : 판 순서. 판 하나에
            patterns  되풀이 규칙(글자 하나 = 그림 하나). 예: 'AB' 해·달·해·달 / 'AAB' 해·해·달 / 'ABC' / 'AABB'
            length    줄에 놓일 칸 수(빈칸 포함, 6~8)
            blank     'end' 빈칸은 늘 끝 / 'any' 중간에도
            choices   보기 수(2~3). 보기는 규칙 안 그림부터 채운다
            count     한 판 문제 수
*/
var CARD = 'assets/images/cards/';
function C(label, file) { return { label: label, img: CARD + file + '.webp' }; }
var GAME = {
  activityId: 'pattern-next',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「규칙 찾기」 · 그림 © Oncuvate',
  cards: {
    sun: C('해', 'sun'), moon: C('달', 'moon'), star: C('별', 'star'), tree: C('나무', 'tree'),
    cat: C('고양이', 'cat'), dog: C('강아지', 'dog'), duck: C('오리', 'duck'), fish: C('물고기', 'fish'), bee: C('벌', 'bee'),
    car: C('자동차', 'car'), boat: C('배', 'boat'), kite: C('연', 'kite'), hat: C('모자', 'hat'),
    cake: C('케이크', 'cake'), bell: C('종', 'bell'), house: C('집', 'house')
  },
  rounds: [
    { id: 'r1', patterns: ['AB'],          length: 6, blank: 'end', choices: 2, count: 4 },
    { id: 'r2', patterns: ['AAB', 'ABB'],  length: 7, blank: 'any', choices: 2, count: 4 },
    { id: 'r3', patterns: ['ABC', 'AABB'], length: 8, blank: 'any', choices: 3, count: 4 }
  ]
};

PatternNext.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
