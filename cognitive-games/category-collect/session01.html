<!doctype html>
<html lang="ko" data-lesson-id="category-collect" data-lesson-title="모아모아 범주 모으기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>모아모아</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/category-collect.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   items  : 그림 목록 — key · label · img(또는 emoji) · tags(이 그림이 속하는 범주들, 여러 개 가능)
   rounds : 판 순서. 판 하나에
            tag      찾을 범주(tags 안의 이름)
            name     아이에게 보이는 범주 이름(「하늘에서 볼 수 있는 것」처럼 넓게도 됨)
            icon     범주 아이콘
            board    판에 놓을 그림 수(12 · 16 · 20)
            targets  그중 범주에 맞는 그림 수
*/
var CARD = 'assets/images/cards/';
var GAME = {
  activityId: 'category-collect',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「언어(범주) 유창성」 · 그림 © Oncuvate',
  items: [
    { key: 'bear',  label: '곰',     img: CARD + 'bear.webp',  tags: ['animal'] },
    { key: 'bee',   label: '벌',     img: CARD + 'bee.webp',   tags: ['animal', 'sky'] },
    { key: 'cat',   label: '고양이', img: CARD + 'cat.webp',   tags: ['animal'] },
    { key: 'dog',   label: '강아지', img: CARD + 'dog.webp',   tags: ['animal'] },
    { key: 'duck',  label: '오리',   img: CARD + 'duck.webp',  tags: ['animal', 'water'] },
    { key: 'fish',  label: '물고기', img: CARD + 'fish.webp',  tags: ['animal', 'water'] },
    { key: 'fox',   label: '여우',   img: CARD + 'fox.webp',   tags: ['animal'] },
    { key: 'goat',  label: '염소',   img: CARD + 'goat.webp',  tags: ['animal'] },
    { key: 'hen',   label: '닭',     img: CARD + 'hen.webp',   tags: ['animal'] },
    { key: 'mouse', label: '쥐',     img: CARD + 'mouse.webp', tags: ['animal'] },
    { key: 'snake', label: '뱀',     img: CARD + 'snake.webp', tags: ['animal'] },
    { key: 'boat',  label: '배',     img: CARD + 'boat.webp',  tags: ['vehicle', 'water'] },
    { key: 'car',   label: '자동차', img: CARD + 'car.webp',   tags: ['vehicle'] },
    { key: 'truck', label: '트럭',   img: CARD + 'truck.webp', tags: ['vehicle'] },
    { key: 'bell',  label: '종',     img: CARD + 'bell.webp',  tags: ['thing'] },
    { key: 'box',   label: '상자',   img: CARD + 'box.webp',   tags: ['thing'] },
    { key: 'chair', label: '의자',   img: CARD + 'chair.webp', tags: ['thing'] },
    { key: 'dish',  label: '접시',   img: CARD + 'dish.webp',  tags: ['thing'] },
    { key: 'hat',   label: '모자',   img: CARD + 'hat.webp',   tags: ['thing'] },
    { key: 'light', label: '전구',   img: CARD + 'light.webp', tags: ['thing'] },
    { key: 'pen',   label: '펜',     img: CARD + 'pen.webp',   tags: ['thing'] },
    { key: 'spoon', label: '숟가락', img: CARD + 'spoon.webp', tags: ['thing'] },
    { key: 'kite',  label: '연',     img: CARD + 'kite.webp',  tags: ['thing', 'sky'] },
    { key: 'bun',   label: '빵',     img: CARD + 'bun.webp',   tags: ['food'] },
    { key: 'cake',  label: '케이크', img: CARD + 'cake.webp',  tags: ['food'] },
    { key: 'house', label: '집',     img: CARD + 'house.webp', tags: ['place'] },
    { key: 'sun',   label: '해',     img: CARD + 'sun.webp',   tags: ['nature', 'sky'] },
    { key: 'moon',  label: '달',     img: CARD + 'moon.webp',  tags: ['nature', 'sky'] },
    { key: 'star',  label: '별',     img: CARD + 'star.webp',  tags: ['nature', 'sky'] },
    { key: 'tree',  label: '나무',   img: CARD + 'tree.webp',  tags: ['nature'] },
    { key: 'shell', label: '조개',   img: CARD + 'shell.webp', tags: ['nature', 'water'] },
    { key: 'log',   label: '통나무', img: CARD + 'log.webp',   tags: ['nature'] }
  ],
  rounds: [
    { id: 'r1', tag: 'animal', name: '동물', icon: '🐾', board: 12, targets: 5 },
    { id: 'r2', tag: 'thing',  name: '물건', icon: '🧸', board: 16, targets: 6 },
    { id: 'r3', tag: 'sky',    name: '하늘에서 볼 수 있는 것', icon: '☁️', board: 16, targets: 5 },
    { id: 'r4', tag: 'water',  name: '물에서 볼 수 있는 것', icon: '💧', board: 16, targets: 4 }
  ]
};

CategoryCollect.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
