<!doctype html>
<html lang="ko" data-lesson-id="word-reverse" data-lesson-title="거꾸로 말해요 낱말 거꾸로 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>거꾸로 말해요</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/word-reverse.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   rounds : 판 순서. 판 하나에
            words  낱말과 그림(이모지). 앞뒤가 같은 낱말(토마토·기러기)은 빼 주세요
            count  한 판에 낼 낱말 수(words 가운데서 무작위로)
            lures  글자 카드에 섞을 미끼 글자 수(다른 낱말의 글자에서 뽑음)
*/
var GAME = {
  activityId: 'word-reverse',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「낱말 거꾸로 말하기」',
  rounds: [
    { id: 'r1', count: 4, lures: 0, words: [
      { word: '사과', icon: '🍎' }, { word: '나무', icon: '🌳' }, { word: '오리', icon: '🦆' }, { word: '기차', icon: '🚂' },
      { word: '우유', icon: '🥛' }, { word: '모자', icon: '👒' }, { word: '바다', icon: '🌊' }, { word: '시계', icon: '⏰' } ] },
    { id: 'r2', count: 4, lures: 1, words: [
      { word: '고양이', icon: '🐱' }, { word: '비행기', icon: '✈️' }, { word: '자동차', icon: '🚗' }, { word: '코끼리', icon: '🐘' },
      { word: '무지개', icon: '🌈' }, { word: '거북이', icon: '🐢' }, { word: '피아노', icon: '🎹' }, { word: '도토리', icon: '🌰' } ] },
    { id: 'r3', count: 4, lures: 2, words: [
      { word: '해바라기', icon: '🌻' }, { word: '무당벌레', icon: '🐞' }, { word: '오토바이', icon: '🏍️' }, { word: '텔레비전', icon: '📺' },
      { word: '고슴도치', icon: '🦔' }, { word: '크레파스', icon: '🖍️' } ] }
  ]
};

WordReverse.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
