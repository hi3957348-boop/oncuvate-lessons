<!doctype html>
<html lang="ko" data-lesson-id="grid-move" data-lesson-title="자리 규칙 찾기 도형 자리 옮기기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>자리 규칙 찾기</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/grid-move.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   rounds : 판 순서. 판 하나에
            rules    'rotate' 도형들이 한 칸씩 돎 · 'grow' 시계 방향으로 하나씩 늘어남 · 'shrink' 하나씩 줄어듦
                     (여러 개 넣으면 문제마다 하나를 뽑음. 같은 것을 두 번 넣으면 더 자주 나옴)
            marks    돌 때 도형 개수(1~3)
            shapes   도형: 'S' 별 · 'O' 동그라미 · 'X' 가위표(여러 개 넣으면 섞여 나옴)
            dir      'cw' 시계 방향만 · 'any' 반대 방향도
            frames   ⇨로 이어진 칸 수(빈칸 포함)
            blank    'end' 빈칸은 늘 끝 · 'any' 중간에도
            choices  보기 수(2~4) · count 한 판 문제 수
*/
var GAME = {
  activityId: 'grid-move',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「규칙 찾기」',
  rounds: [
    { id: 'r1', rules: ['rotate'],                     marks: 1, shapes: ['S'],      dir: 'cw',  frames: 4, blank: 'end', choices: 3, count: 4 },
    { id: 'r2', rules: ['rotate', 'rotate', 'grow'],   marks: 2, shapes: ['S'],      dir: 'any', frames: 4, blank: 'end', choices: 4, count: 4 },
    { id: 'r3', rules: ['rotate', 'rotate', 'shrink'], marks: 2, shapes: ['O', 'X'], dir: 'any', frames: 4, blank: 'any', choices: 4, count: 4 }
  ]
};

GridMove.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
