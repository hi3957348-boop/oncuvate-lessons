<!doctype html>
<html lang="ko" data-lesson-id="basket-memory" data-lesson-title="끼리끼리 바구니 묶어서 기억하기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>끼리끼리 바구니</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/basket-memory.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   categories : 바구니(범주) 목록 — key · name · icon
   items      : 그림 목록 — key · label · img(또는 emoji) · cat(바구니 key)
   rounds     : 판 순서. 판 하나에
                cats   이 판의 바구니 key 목록(2~3개 권장)
                per    바구니마다 담을 그림 수
                extra  떠올리기 받침에 섞을 「같은 종류의 안 나온 그림」 수
                lookSec (선택) 외우는 시간. 비우면 「그림 수 × 3 + 6」초
*/
var CARD = 'assets/images/cards/';
var GAME = {
  activityId: 'basket-memory',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「같은 특성끼리 묶어서 기억하기」 · 그림 © Oncuvate',
  categories: [
    { key: 'animal',  name: '동물', icon: '🐾' },
    { key: 'vehicle', name: '탈것', icon: '🚗' },
    { key: 'thing',   name: '물건', icon: '🧸' },
    { key: 'nature',  name: '자연', icon: '🌳' }
  ],
  items: [
    { key: 'bear',  label: '곰',     img: CARD + 'bear.webp',  cat: 'animal' },
    { key: 'bee',   label: '벌',     img: CARD + 'bee.webp',   cat: 'animal' },
    { key: 'cat',   label: '고양이', img: CARD + 'cat.webp',   cat: 'animal' },
    { key: 'dog',   label: '강아지', img: CARD + 'dog.webp',   cat: 'animal' },
    { key: 'duck',  label: '오리',   img: CARD + 'duck.webp',  cat: 'animal' },
    { key: 'fish',  label: '물고기', img: CARD + 'fish.webp',  cat: 'animal' },
    { key: 'fox',   label: '여우',   img: CARD + 'fox.webp',   cat: 'animal' },
    { key: 'goat',  label: '염소',   img: CARD + 'goat.webp',  cat: 'animal' },
    { key: 'hen',   label: '닭',     img: CARD + 'hen.webp',   cat: 'animal' },
    { key: 'mouse', label: '쥐',     img: CARD + 'mouse.webp', cat: 'animal' },
    { key: 'snake', label: '뱀',     img: CARD + 'snake.webp', cat: 'animal' },
    { key: 'boat',  label: '배',     img: CARD + 'boat.webp',  cat: 'vehicle' },
    { key: 'car',   label: '자동차', img: CARD + 'car.webp',   cat: 'vehicle' },
    { key: 'truck', label: '트럭',   img: CARD + 'truck.webp', cat: 'vehicle' },
    { key: 'bell',  label: '종',     img: CARD + 'bell.webp',  cat: 'thing' },
    { key: 'box',   label: '상자',   img: CARD + 'box.webp',   cat: 'thing' },
    { key: 'chair', label: '의자',   img: CARD + 'chair.webp', cat: 'thing' },
    { key: 'dish',  label: '접시',   img: CARD + 'dish.webp',  cat: 'thing' },
    { key: 'hat',   label: '모자',   img: CARD + 'hat.webp',   cat: 'thing' },
    { key: 'light', label: '전구',   img: CARD + 'light.webp', cat: 'thing' },
    { key: 'pen',   label: '펜',     img: CARD + 'pen.webp',   cat: 'thing' },
    { key: 'spoon', label: '숟가락', img: CARD + 'spoon.webp', cat: 'thing' },
    { key: 'sun',   label: '해',     img: CARD + 'sun.webp',   cat: 'nature' },
    { key: 'moon',  label: '달',     img: CARD + 'moon.webp',  cat: 'nature' },
    { key: 'star',  label: '별',     img: CARD + 'star.webp',  cat: 'nature' },
    { key: 'tree',  label: '나무',   img: CARD + 'tree.webp',  cat: 'nature' },
    { key: 'shell', label: '조개',   img: CARD + 'shell.webp', cat: 'nature' },
    { key: 'log',   label: '통나무', img: CARD + 'log.webp',   cat: 'nature' }
  ],
  rounds: [
    { id: 'r1', cats: ['animal', 'vehicle'], per: 2, extra: 1 },
    { id: 'r2', cats: ['animal', 'thing', 'nature'], per: 2, extra: 2 },
    { id: 'r3', cats: ['animal', 'thing', 'nature'], per: 3, extra: 2 }
  ]
};

BasketMemory.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
