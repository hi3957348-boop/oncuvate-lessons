<!doctype html>
<html lang="ko" data-lesson-id="step-order" data-lesson-title="차례대로 놓기 순서 찾기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>차례대로 놓기</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/step-order.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   rounds : 판 순서. 판 하나에 items(문제들, 판 안에서 순서는 섞임)
            title  상황 이름 · icon 상황 그림(이모지)
            steps  일이 일어나는 차례대로 적는다(4~5장 권장). 카드 글은 아홉 글자 안팎으로 짧게
*/
var GAME = {
  activityId: 'step-order',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「순서 찾기」',
  rounds: [
    { id: 'r1', items: [   /* 1판: 늘 보는 차례 */
      { id: 'r1-day', title: '하루', icon: '🕰️', steps: [
        { icon: '🌅', text: '아침' }, { icon: '☀️', text: '낮' }, { icon: '🌇', text: '저녁' }, { icon: '🌙', text: '밤' } ] },
      { id: 'r1-season', title: '계절', icon: '🍃', steps: [
        { icon: '🌸', text: '봄' }, { icon: '🏖️', text: '여름' }, { icon: '🍂', text: '가을' }, { icon: '⛄', text: '겨울' } ] },
      { id: 'r1-seed', title: '씨앗이 자라요', icon: '🌱', steps: [
        { icon: '🌰', text: '씨앗을 심어요' }, { icon: '💧', text: '물을 줘요' }, { icon: '🌱', text: '싹이 나요' }, { icon: '🌻', text: '꽃이 펴요' } ] }
    ] },
    { id: 'r2', items: [   /* 2판: 생활 속 네 단계 */
      { id: 'r2-teeth', title: '이를 닦아요', icon: '🪥', steps: [
        { icon: '🪥', text: '칫솔에 치약을 짜요' }, { icon: '😁', text: '구석구석 닦아요' }, { icon: '🚰', text: '물로 입을 헹궈요' }, { icon: '🧽', text: '칫솔을 씻어 꽂아요' } ] },
      { id: 'r2-cross', title: '길을 건너요', icon: '🚦', steps: [
        { icon: '🛑', text: '멈춰 서요' }, { icon: '🟢', text: '초록불을 기다려요' }, { icon: '👀', text: '양쪽을 살펴요' }, { icon: '🚶', text: '손 들고 건너요' } ] },
      { id: 'r2-ramen', title: '라면을 끓여요', icon: '🍜', steps: [
        { icon: '🍲', text: '냄비에 물을 부어요' }, { icon: '🔥', text: '물을 끓여요' }, { icon: '🍜', text: '면과 수프를 넣어요' }, { icon: '🥢', text: '그릇에 담아 먹어요' } ] }
    ] },
    { id: 'r3', items: [   /* 3판: 다섯 단계 */
      { id: 'r3-wash', title: '손을 씻어요', icon: '🧼', steps: [
        { icon: '🚰', text: '물을 틀어요' }, { icon: '🧼', text: '비누를 묻혀요' }, { icon: '👐', text: '손을 비벼요' }, { icon: '💦', text: '물로 헹궈요' }, { icon: '🧻', text: '수건으로 닦아요' } ] },
      { id: 'r3-letter', title: '편지를 보내요', icon: '✉️', steps: [
        { icon: '✏️', text: '편지를 써요' }, { icon: '✉️', text: '봉투에 넣어요' }, { icon: '🏷️', text: '우표를 붙여요' }, { icon: '📮', text: '우체통에 넣어요' }, { icon: '📬', text: '친구가 받아요' } ] },
      { id: 'r3-laundry', title: '빨래를 해요', icon: '🧺', steps: [
        { icon: '🧺', text: '빨랫감을 넣어요' }, { icon: '🧴', text: '세제를 넣어요' }, { icon: '🔘', text: '버튼을 눌러요' }, { icon: '👕', text: '빨래를 꺼내요' }, { icon: '☀️', text: '빨래를 널어요' } ] }
    ] }
  ]
};

StepOrder.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
