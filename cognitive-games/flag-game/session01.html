<!doctype html>
<html lang="ko" data-lesson-id="flag-game" data-lesson-title="청기백기 행동억제 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>청기백기</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/flag-game.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   rounds : 판 순서. 판 하나에
            level  1 한 깃발(「청기 올려」) · 2 「하지 마」 섞기 · 3 두 깃발 함께·「말고」
            count  명령 수 — 명령은 그때그때 깃발 상태를 보고 만든다
            또는 commands: ['청기 올려', '백기 올리지 마', …] 로 명령을 직접 적는다(책처럼 정한 목록)
   flags  : (선택) 왼쪽·오른쪽 깃발 이름과 색. 기본은 왼쪽 청기, 오른쪽 백기
*/
var GAME = {
  activityId: 'flag-game',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「청기백기 게임」 · 그림 © Oncuvate',
  rounds: [
    { id: 'r1', level: 1, count: 8 },     // 깃발 하나씩
    { id: 'r2', level: 2, count: 8 },     // 「하지 마」가 섞임
    { id: 'r3', level: 3, count: 10 }     // 두 깃발 함께 · 「말고」
  ]
};

FlagGame.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
