<!doctype html>
<html lang="ko" data-lesson-id="number-stairs" data-lesson-title="숫자 계단 숫자 빼기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>숫자 계단</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/number-stairs.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   rounds : 판 순서. 판 하나에
            start  시작 수(숫자판 맨 위 왼쪽, 책: 50 · 100 · 127)
            step   몇씩 뺄지(2 · 3 · 5 · 7)
            count  몇 계단 내려갈지
            low    숫자판 맨 끝 수(기본 1)
*/
var GAME = {
  activityId: 'number-stairs',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「숫자 거꾸로 세기, 숫자 빼기」',
  rounds: [
    { id: 'r1', start: 100, step: 2, count: 10 },
    { id: 'r2', start: 100, step: 3, count: 10 },
    { id: 'r3', start: 100, step: 5, count: 10 },
    { id: 'r4', start: 100, step: 7, count: 10 }
  ]
};

NumberStairs.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
