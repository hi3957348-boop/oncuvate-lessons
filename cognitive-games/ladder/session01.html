<!doctype html>
<html lang="ko" data-lesson-id="ladder" data-lesson-title="사다리 선물 사다리 타기 게임" data-lesson-version="1.0.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<title>사다리 선물</title>
<style>
  /* 활동창 크기(920×450)로 가운데에. 화면이 더 작으면 그만큼 줄어든다 */
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 8% 0%, rgba(75,201,220,.07), transparent 28%),
                linear-gradient(145deg, #f7f8f5, #f1f3f0 62%, #f5f4f1);
  }
  #game { width: min(920px, calc(100vw - 24px)); height: min(450px, calc(100vh - 24px)); }
  @media (max-aspect-ratio: 5/4) { #game { width: calc(100vw - 16px); height: calc(100vh - 16px); } }
</style>
</head>
<body>
<div id="game"></div>

<script src="shared/ladder.js"></script>
<script>
/* ───────── 내용 바꾸는 곳 ─────────
   tops    : 위(누가) — key · label · img(또는 emoji)
   bottoms : 아래(무엇) — key · label · img(또는 emoji)
   rounds  : 판 순서. 판 하나에
             lines    세로줄 수(3~6)
             levels   가로줄이 놓일 수 있는 높이 수(많을수록 가로줄이 많아짐)
             density  높이마다 가로줄이 놓일 확률(0~1, 기본 0.45)
             asks     한 판에 몇 번 물을지
*/
var CARD = 'assets/images/cards/';
var GAME = {
  activityId: 'ladder',
  credit: '자체 제작 · 활동 방식 참고: 『느린 학습자 인지훈련 프로그램』(박현숙, 2021) 「사다리타기」 · 그림 © Oncuvate',
  tops: [
    { key: 'bear', label: '곰',     img: CARD + 'bear.webp' },
    { key: 'cat',  label: '고양이', img: CARD + 'cat.webp' },
    { key: 'dog',  label: '강아지', img: CARD + 'dog.webp' },
    { key: 'fox',  label: '여우',   img: CARD + 'fox.webp' },
    { key: 'duck', label: '오리',   img: CARD + 'duck.webp' },
    { key: 'goat', label: '염소',   img: CARD + 'goat.webp' }
  ],
  bottoms: [
    { key: 'hat',   label: '모자',   img: CARD + 'hat.webp' },
    { key: 'kite',  label: '연',     img: CARD + 'kite.webp' },
    { key: 'boat',  label: '배',     img: CARD + 'boat.webp' },
    { key: 'car',   label: '자동차', img: CARD + 'car.webp' },
    { key: 'box',   label: '상자',   img: CARD + 'box.webp' },
    { key: 'bell',  label: '종',     img: CARD + 'bell.webp' },
    { key: 'cake',  label: '케이크', img: CARD + 'cake.webp' },
    { key: 'truck', label: '트럭',   img: CARD + 'truck.webp' }
  ],
  rounds: [
    { id: 'r1', lines: 3, levels: 5, asks: 3 },
    { id: 'r2', lines: 4, levels: 7, asks: 3 },
    { id: 'r3', lines: 5, levels: 9, asks: 3 }
  ]
};

Ladder.mount(document.getElementById('game'), GAME);
</script>
</body>
</html>
