<!doctype html><html lang="ko" data-lesson-id="water-play" data-lesson-version="1.0.0"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2회차 안전한 물놀이 방법 | Oncuvate</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="pilot.css"><link rel="stylesheet" href="session04-pilot.css"></head><body><div class="app"><aside class="side"><div class="brand"><span class="brand-mark"></span><span><strong>Oncuvate</strong><small>WRITING STUDIO</small></span></div><p class="course-label" id="sessionLabel"></p><h2 id="sideTitle"></h2><nav class="journey" id="journey"></nav></aside><main class="main"><header class="top"><div><p class="eyebrow">생각을 정리하는 주제 글쓰기</p><h1 id="topTitle"></h1></div><div class="top-tools"><span class="saved" id="saved">기기에 저장됨</span><a class="pilot-entry-link" href="session02-entry.html">입장화면으로</a></div></header><div id="page"></div><div class="nav" id="nav"></div></main></div><div class="toast" id="toast"></div><p class="copyright">© 온큐베이트 · 자체 제작</p><div class="watermark" id="watermark"></div><script>window.WATER_PLAY_LESSON={id:"explanation",session:"2회차",genre:"설명문",title:"안전한 물놀이 방법",pages:[
{type:"choice",short:"수준 고르기",typeLabel:"글의 길이",kicker:"LEVEL",title:"나에게 맞는 수준을 골라요",instruction:"글의 짜임은 같고 예시와 설명의 자세한 정도가 달라요.",key:"level",choices:[{value:"1수준",label:"1수준",desc:"핵심 방법을 순서대로 이어 약 300자의 글을 써요."},{value:"2수준",label:"2수준",desc:"까닭과 주의점을 더해 약 500자의 글을 써요."}],promptTitle:"오늘 도전할 수준",prompt:"고른 수준의 예시를 부분별로 읽고 같은 짜임으로 설명해요.",help:"망설여진다면 1수준으로 시작해도 좋아요. 두 수준 모두 소개·방법·마무리의 순서는 같아요."},
{type:"choice",short:"장소 정하기",typeLabel:"대상 선택",kicker:"PLACE",title:"물놀이를 할 때 주의해야 할 점을 설명해 보세요.",instruction:"장소에 따라 필요한 준비와 주의할 점이 달라요.",key:"place",choices:[{value:"바다",label:"바다",desc:"파도와 수심이 계속 달라지는 곳"},{value:"계곡",label:"계곡",desc:"돌이 미끄럽고 물살이 달라지는 곳"},{value:"수영장",label:"수영장",desc:"여러 사람이 함께 정해진 공간을 쓰는 곳"},{value:"워터파크",label:"워터파크",desc:"놀이기구와 이용 순서가 있는 곳"}],promptTitle:"설명할 대상부터 분명하게",prompt:"내가 잘 알고 있거나 친구에게 꼭 알려 주고 싶은 장소를 하나 골라요.",help:"가 본 적이 없어도 괜찮아요. 가장 많이 들어 본 장소를 골라 제시된 정보를 활용하세요."},
{type:"brainstorm",strategy:{level:"함께 사용",name:"말을 모으고 쓸 내용 고르기",cue:"친구가 꼭 알아야 할 말은 무엇인가요?",when:"아는 내용이 많거나 무엇을 설명할지 막막할 때",do:"준비물·안전 행동·순서를 낱말로 모은 뒤 내게 필요한 말을 골라요.",why:"여러 사람의 경험을 참고하면서 주제에 맞는 설명 재료를 찾을 수 있어요."},short:"단어 모으기",typeLabel:"함께 생각",kicker:"BRAINSTORM",title:"안전한 물놀이 방법에 필요한 말을 모아요",instruction:"아직 설명 문장을 쓰지 않고 필요한 정보만 짧은 말로 올려요.",imageCues:s=>({
  "바다":{src:"assets/images/water-play-sea-safety-photo-cues.webp",alt:"바닷가에서 구명조끼를 준비하고 파도와 안전구역을 확인하며 얕은 바다에서 보호자와 놀고 물놀이 뒤 정리하는 실사 사진 네 장",labels:["구명조끼와 날씨 준비","파도·안전구역 확인","보호자와 얕은 물 놀이","모래 씻기와 정리"]},
  "계곡":{src:"assets/images/water-play-valley-safety-photo-cues.webp",alt:"계곡에서 구명조끼를 준비하고 물살과 미끄러운 돌을 확인하며 보호자와 얕은 물에서 걷고 물놀이 뒤 발과 주변을 정리하는 실사 사진 네 장",labels:["구명조끼와 준비물","물살·수심·돌 확인","보호자와 천천히 걷기","발 확인과 쓰레기 정리"]},
  "수영장":{src:"assets/images/water-play-pool-safety-photo-cues.webp",alt:"수영장에서 준비운동을 하고 수심과 안전요원을 확인하며 천천히 걷고 물놀이 뒤 정리하는 실사 사진 네 장",labels:["준비운동","수심·안전요원 확인","뛰지 않고 천천히 걷기","물기 닦기와 정리"]},
  "워터파크":{src:"assets/images/water-play-waterpark-safety-photo-cues.webp",alt:"워터파크에서 이용 기준과 구명조끼를 확인하고 안내를 들으며 차례를 지켜 걷고 물놀이 뒤 쉬고 정리하는 실사 사진 네 장",labels:["이용 기준·구명조끼 확인","안내 듣고 차례 기다리기","천천히 걷기","물 마시기와 정리"]}
}[s.answers.place]||{src:"assets/images/water-play-pool-safety-photo-cues.webp",alt:"수영장에서 준비운동을 하고 수심과 안전요원을 확인하며 천천히 걷고 물놀이 뒤 정리하는 실사 사진 네 장",labels:["준비운동","수심·안전요원 확인","뛰지 않고 천천히 걷기","물기 닦기와 정리"]}),contextKeys:["place"],prompt:"준비물, 물에 들어가기 전 확인할 것, 놀이 중 지킬 행동, 끝난 뒤 할 일을 떠올려요.",placeholder:"예: 준비운동, 중간 휴식",help:"안전하게 놀기보다 구명조끼 끈 확인처럼 행동이 보이는 말을 적어 보세요."},
{type:"sequence",short:"정보 정리",typeLabel:"전·중·후",kicker:"ORDER",title:"세 단계로 설명할 내용을 정리해요",instruction:"각 단계에서 가장 중요한 행동 하나씩만 먼저 골라요.",stages:[{key:"before",title:"물에 들어가기 전",prompt:"준비물, 몸 상태, 주변 확인 중에서 중요한 것을 적어요.",placeholder:"예: 구명조끼를 몸에 맞게 입고 끈을 확인한다.",words:["준비운동","구명조끼","날씨 확인","물의 깊이","안전요원"]},{key:"during",title:"물놀이를 하는 동안",prompt:"움직임, 휴식, 다른 사람과의 약속을 적어요.",placeholder:"예: 정해진 곳에서 놀고 너무 오래 물속에 있지 않는다.",words:["천천히 움직이기","정해진 구역","중간 휴식","서로 밀지 않기","안내 따르기"]},{key:"after",title:"물놀이가 끝난 뒤",prompt:"몸을 돌보고 사용한 물건을 정리하는 방법을 적어요.",placeholder:"예: 몸의 물기를 닦고 따뜻한 옷으로 갈아입는다.",words:["물기 닦기","옷 갈아입기","몸 상태 확인","물건 정리","쓰레기 되가져가기"]}],help:"각 단계마다 가장 중요한 행동 하나만 정해도 충분해요."},
{type:"write",short:"소개 쓰기",typeLabel:"무엇을 설명할까",kicker:"INTRO",title:"누구에게 무엇을 알려 줄지 밝혀요",instruction:s=>s.answers.level==="2수준"?"설명할 장소와 이 방법이 필요한 까닭을 두세 문장으로 시작해요.":"설명할 장소와 필요한 까닭을 한두 문장으로 시작해요.",key:"intro",contextKey:"place",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 소개",exampleText:s=>s.answers.level==="2수준"?"수영장에서 안전하게 놀려면 물에 들어가기 전부터 몸과 주변을 꼼꼼히 살펴야 한다. 물에서는 사소한 장난도 미끄러짐이나 충돌로 이어질 수 있기 때문이다.":"수영장에서 안전하게 놀려면 물에 들어가기 전부터 준비해야 한다. 물에서는 작은 장난도 사고로 이어질 수 있기 때문이다.",prompt:"처음 물놀이를 하는 친구가 이 글을 읽는다고 생각해 보세요.",placeholder:"어떤 장소에서 안전하게 놀기 위한 방법인지, 왜 알아야 하는지 적어 보세요.",words:["안전하게","처음 가는 사람","미리 알아두면","사고를 줄이다","즐겁게 놀다"],help:"‘○○에서 안전하게 놀려면 몇 가지 방법을 알아야 한다.’로 시작해도 좋아요."},
{type:"write",short:"방법 쓰기",typeLabel:"순서 설명",kicker:"HOW TO",title:"전·중·후의 방법을 이어서 설명해요",instruction:s=>s.answers.level==="2수준"?"전·중·후의 행동과 그 까닭을 7~9문장으로 설명해요.":"전·중·후의 핵심 행동을 4~6문장으로 설명해요.",key:"body",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 방법",exampleText:s=>s.answers.level==="2수준"?"먼저 수영복으로 갈아입고 몸이 아프거나 피곤하지 않은지 확인한다. 밥을 먹은 직후라면 충분히 쉬고, 팔과 다리를 천천히 움직이며 준비운동을 한다. 물에 들어가기 전에는 수심 표시, 안전요원의 위치와 비상구도 살핀다. 물속에서는 바닥이 미끄러우므로 뛰지 않고, 친구를 갑자기 밀거나 잡아당기지 않는다. 놀이기구는 정해진 방향과 차례를 지켜 이용한다. 몸이 떨리거나 입술이 파래지고 숨이 차면 참지 말고 바로 물 밖으로 나와 쉰다. 물에 빠진 사람이 보이면 혼자 구하려고 들어가지 말고 안전요원이나 어른에게 바로 알린다.":"먼저 수영복으로 갈아입고 팔과 다리를 움직여 준비운동을 한다. 물에 들어가기 전에는 수심 표시와 안전요원의 위치를 확인한다. 물속에서는 뛰거나 친구를 밀지 않고 정해진 구역에서 논다. 몸이 떨리거나 숨이 차면 바로 물 밖으로 나와 쉰다.",prompt:"앞에서 정리한 세 단계를 보며 행동의 순서와 필요한 까닭을 적어요.",placeholder:"먼저 무엇을 해야 하나요? 물놀이 중에는 무엇을 지켜야 하나요?",words:["먼저","그다음","물에 들어간 뒤","중간에는","왜냐하면","도움이 된다"],help:"‘먼저·그다음·물에 들어간 뒤’를 사용하면 순서를 쉽게 보여 줄 수 있어요."},
{type:"write",short:"마무리 쓰기",typeLabel:"핵심 정리",kicker:"CLOSING",title:"중요한 방법을 다시 짚으며 마무리해요",instruction:s=>s.answers.level==="2수준"?"놀이가 끝난 뒤 할 일과 안전 수칙의 효과를 두세 문장으로 적어요.":"놀이 뒤 할 일과 안전 수칙의 효과를 한두 문장으로 적어요.",key:"closing",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 마무리",exampleText:s=>s.answers.level==="2수준"?"놀이가 끝나면 몸의 물기를 닦고 따뜻한 옷으로 갈아입는다. 사용한 물건을 챙긴 뒤 몸에 다친 곳은 없는지도 확인한다. 준비·놀이·마무리의 순서를 지키면 나와 다른 사람 모두 안전하고 즐겁게 물놀이를 할 수 있다.":"놀이가 끝나면 몸의 물기를 닦고 따뜻한 옷으로 갈아입는다. 준비·놀이·마무리의 순서를 지키면 다치지 않고 즐겁게 물놀이를 할 수 있다.",contextKey:"body",contextLabel:"앞에서 쓴 방법",prompt:"마지막으로 해야 할 일과 이 방법을 지켰을 때 좋은 점을 적어요.",placeholder:"예: 놀이가 끝나면 몸의 물기를 닦는다. 이 순서를 지키면 안전하게 놀 수 있다.",words:["마지막으로","놀이가 끝나면","확인한다","정리한다","안전하게","즐겁게"],help:"새로운 방법을 더하기보다 앞의 내용을 한 번 묶어 주며 끝내세요."},
{type:"review",strategy:{level:"함께 사용",name:"독자의 눈으로 읽기",cue:"처음 읽는 사람도 그대로 따라 할 수 있을까요?",when:"내게는 익숙하지만 독자에게 필요한 설명이 빠졌을 때",do:"처음 물놀이하는 친구가 모를 곳을 찾아 한마디 더 보태요.",why:"빠진 순서와 설명을 스스로 발견할 수 있어요."},short:"완성하기",typeLabel:"순서 확인",kicker:"FINAL",title:"방법이 잘 전달되는지 확인해요",instruction:"처음 가는 친구가 이 글만 읽고 행동할 수 있는지 살펴봐요.",sections:[{label:"설명의 시작",key:"intro"},{label:"순서가 있는 방법",key:"body"},{label:"설명의 마무리",key:"closing"}],finalTitle:"나의 물놀이 방법 설명문",help:"‘조심해야 한다’만 쓴 부분이 있다면 무엇을 어떻게 해야 하는지 구체적으로 바꿔 보세요."},
{type:"finish",short:"마침",typeLabel:"완료",kicker:"CLEAR",title:"2회차 설명문을 마쳤어요",instruction:"정보를 순서에 맞게 정리해 친구에게 알려 주었어요.",message:"안전한 방법이 또렷한 설명문이 되었어요!",detail:"다음 회차에서는 물놀이에 관한 질문에 입장을 정하고 근거를 들어요."}],compose:s=>[s.texts.intro,s.texts.body,s.texts.closing]};</script><script src="pilot-config.js"></script><script src="session04-pilot-bootstrap.js"></script><script src="lesson.js"></script><script src="session04-coach-controls.js"></script><script src="screen-annotation.js"></script></body></html>
