{type:"choice",short:"수준 고르기",typeLabel:"글의 길이",kicker:"LEVEL",title:"나에게 맞는 수준을 골라요",instruction:"글의 짜임은 같고 예시와 안내의 자세한 정도가 달라요.",key:"level",choices:[{value:"1수준",label:"1수준",desc:"핵심 장면을 차례대로 이어 약 300자의 글을 써요."},{value:"2수준",label:"2수준",desc:"움직임과 감각을 자세히 살려 약 500자의 글을 써요."}],promptTitle:"오늘 도전할 수준",prompt:"고른 수준의 예시를 각 단계에서 하나씩 읽으며 내 글을 써요.",help:"망설여진다면 1수준으로 시작해도 좋아요. 글의 네 부분은 두 수준 모두 같아요."},
{type:"choice",short:"장소 정하기",typeLabel:"경험 선택",kicker:"MEMORY",title:"어떤 물놀이 경험을 떠올릴까요?",instruction:"직접 겪은 일 가운데 이야기하고 싶은 장소를 하나 골라요.",key:"place",choices:[{value:"바닷가",label:"바닷가",desc:"파도와 모래가 있는 물놀이"},{value:"계곡",label:"계곡",desc:"차가운 물과 돌이 있는 물놀이"},{value:"수영장",label:"수영장",desc:"친구나 가족과 함께한 물놀이"},{value:"워터파크",label:"워터파크",desc:"놀이기구와 물보라가 있는 물놀이"}],promptTitle:"기억이 선명한 장소",prompt:"누구와 갔는지, 무슨 일이 있었는지 떠오르는 곳을 골라요.",help:"꼭 특별한 사건이 없어도 괜찮아요. 가장 또렷하게 기억나는 장면이 있는 곳이면 충분해요."},
{type:"brainstorm",strategy:{level:"함께 사용",name:"떠오르는 말을 모아 글감 만들기",cue:"그날을 생각하면 어떤 말이 먼저 떠오르나요?",when:"처음부터 문장으로 쓰기 어렵거나 기억을 더 많이 떠올리고 싶을 때",do:"사람·장소·행동·느낌을 낱말과 짧은 구로 올린 뒤 내 글에 쓸 말을 골라요.",why:"친구들의 말을 보며 잊고 있던 장면과 표현을 떠올릴 수 있어요."},short:"단어 모으기",typeLabel:"함께 생각",kicker:"BRAINSTORM",title:"물놀이의 기억을 낱말로 모아요",instruction:"아직 문장을 쓰지 않고 그날과 관련된 말만 짧게 올려요.",imageCues:s=>({
  "바닷가":{src:"assets/images/water-play-life-seaside-photo-cue.webp",relatedSrc:"assets/images/water-play-life-seaside-memory-scenes.png",galleryFiles:["assets/images/water-play-life-seaside-arrival.webp","assets/images/water-play-life-seaside-sand-play.webp","assets/images/water-play-life-seaside-shallow-play.webp","assets/images/water-play-life-seaside-rest.webp"],galleryLabels:["가족과 파도 바라보기","조개와 모래성 만들기","친구와 얕은 물에서 놀기","수건을 두르고 쉬기"],alt:"잔잔한 파도 옆 젖은 모래에서 조개와 작은 돌을 살펴보는 아이의 실사 사진",labels:["파도와 물결","젖은 모래","조개와 작은 돌","바닷바람"]},
  "계곡":{src:"assets/images/water-play-life-valley-photo-cue.webp",relatedSrc:"assets/images/water-play-life-valley-memory-scenes.png",galleryFiles:["assets/images/water-play-life-valley-rock-walk.webp","assets/images/water-play-life-valley-cold-water.webp","assets/images/water-play-life-valley-splash.webp","assets/images/water-play-life-valley-rest.webp"],galleryLabels:["가족과 돌 사이 걷기","손으로 찬물 느끼기","친구와 물장구치기","바위에 앉아 발 말리기"],alt:"나무가 우거진 계곡의 맑은 물과 둥근 바위 사이를 조심스럽게 걷는 아이의 실사 사진",labels:["맑은 물","둥글고 미끄러운 돌","차가운 감촉","졸졸 흐르는 소리"]},
  "수영장":{src:"assets/images/water-play-life-pool-photo-cue.webp",relatedSrc:"assets/images/water-play-life-pool-memory-scenes.png",galleryFiles:["assets/images/water-play-life-pool-meeting.webp","assets/images/water-play-life-pool-kicking.webp","assets/images/water-play-life-pool-ball-play.webp","assets/images/water-play-life-pool-rest.webp"],galleryLabels:["친구와 수영장에서 만나기","발차기로 거품 만들기","공을 주고받으며 놀기","수건을 두르고 쉬기"],alt:"야외 수영장에서 보호자와 함께 즐겁게 물장구치는 아이의 실사 사진",labels:["푸른 물","튀어 오르는 물방울","가족과 함께","웃음소리"]},
  "워터파크":{src:"assets/images/water-play-life-waterpark-photo-cue.webp",relatedSrc:"assets/images/water-play-life-waterpark-memory-scenes.png",galleryFiles:["assets/images/water-play-life-waterpark-slide.webp","assets/images/water-play-life-waterpark-fountain.webp","assets/images/water-play-life-waterpark-lazy-river.webp","assets/images/water-play-life-waterpark-rest.webp"],galleryLabels:["큰 미끄럼틀 올려다보기","분수 물줄기에서 놀기","유수풀에서 함께 떠가기","가족과 쉬며 물 마시기"],alt:"워터파크의 분수 물줄기와 미끄럼틀 가까이에서 안전하게 걷는 아이의 실사 사진",labels:["분수 물줄기","알록달록 미끄럼틀","쏟아지는 물","설레는 마음"]}
}[s.answers.place]||{src:"assets/images/water-play-life-seaside-photo-cue.webp",relatedSrc:"assets/images/water-play-life-seaside-memory-scenes.png",galleryFiles:["assets/images/water-play-life-seaside-arrival.webp","assets/images/water-play-life-seaside-sand-play.webp","assets/images/water-play-life-seaside-shallow-play.webp","assets/images/water-play-life-seaside-rest.webp"],galleryLabels:["가족과 파도 바라보기","조개와 모래성 만들기","친구와 얕은 물에서 놀기","수건을 두르고 쉬기"],alt:"잔잔한 파도 옆 젖은 모래에서 조개와 작은 돌을 살펴보는 아이의 실사 사진",labels:["파도와 물결","젖은 모래","조개와 작은 돌","바닷바람"]}),contextKeys:["place"],prompt:"함께 간 사람, 보거나 들은 것, 한 행동, 몸의 느낌과 마음을 떠올려요.",placeholder:"예: 함께한 사람, 물의 느낌, 들린 소리, 그때의 마음",help:"한 단어가 어렵다면 보인 것, 들린 것, 느낀 것을 짧은 말로 적어도 좋아요."},
{type:"write",strategy:{level:"함께 사용",name:"충분히 관찰하고 첫 문장 열기",cue:"언제, 누구와, 어디에서 있었던 일인가요?",when:"첫 문장을 자연스럽게 시작하지 못할 때",do:"시간·사람·장소를 넣어 경험의 배경부터 적어요.",why:"배경을 먼저 쓰면 뒤의 장면이 순서대로 이어지기 쉬워요."},short:"배경 적기",typeLabel:"1번째 부분",kicker:"SETTING",title:"언제, 누구와, 어디에서였나요?",instruction:s=>s.answers.level==="2수준"?"시간·사람·장소와 처음의 분위기를 서너 문장으로 적어요.":"시간·사람·장소를 두세 문장으로 적어요.",key:"setting",contextKey:"place",contextLabel:"고른 장소",exampleLabel:s=>`1. 경험의 배경 예시 · ${s.answers.level||"1수준"}`,exampleText:s=>s.answers.level==="2수준"?"지난여름, 나는 사촌 형과 이모를 따라 계곡으로 물놀이를 갔다. 차에서 내리자 나무 사이로 시원한 물소리가 들렸다. 햇빛은 뜨거웠지만 계곡 가까이는 서늘해서 빨리 물에 들어가고 싶었다.":"지난여름, 나는 사촌들과 산 아래 계곡으로 물놀이를 갔다. 차에서 내리자 나무 사이로 물소리가 들려 마음이 설렜다.",prompt:s=>s.answers.level==="2수준"?"언제, 누구와, 어디에 갔는지 쓴 뒤 처음 보거나 들은 분위기를 덧붙여요.":"시간, 함께한 사람, 장소를 넣어 경험의 배경을 적어요.",placeholder:s=>s.answers.level==="2수준"?"언제 누구와 어디에 갔나요? 도착했을 때 무엇이 보이거나 들렸나요?":"예: 어느 날, 나는 ○○와 ○○에 갔다.",words:["어느 날","주말에","함께","물가에","도착하자","주변에는","처음에는","설레었다"],note:s=>s.answers.level==="2수준"?"배경 한 문장에 처음의 분위기를 한 문장 더해 보세요.":"짧은 문장 한두 개면 충분해요.",help:"언제 + 누구와 + 어디에서를 차례로 이어 보세요."},
{type:"write",short:"먼저 한 일",typeLabel:"2번째 부분",kicker:"ACTION",title:"물놀이에서 먼저 무엇을 했나요?",instruction:s=>s.answers.level==="2수준"?"처음 보거나 느낀 것과 한 일을 서너 문장으로 적어요.":"처음 본 모습과 한 일을 두세 문장으로 적어요.",key:"opening",contextKey:"setting",contextLabel:"앞에서 쓴 배경",exampleLabel:s=>`2. 먼저 한 일 예시 · ${s.answers.level||"1수준"}`,exampleText:s=>s.answers.level==="2수준"?"우리는 평평한 돌에 돗자리를 펴고 신발을 벗었다. 나는 물가에 앉아 발끝부터 천천히 물에 넣었다. 생각보다 차가워 “앗!” 하고 소리를 질렀다. 사촌 형이 웃으며 물을 튀기자 나도 물을 튀겼다.":"계곡물은 바닥의 돌이 보일 만큼 맑았다. 물에 발을 넣자 얼음물처럼 차가워서 나도 모르게 짧은 소리를 질렀다.",prompt:s=>s.answers.level==="2수준"?"보인 것이나 들린 것을 먼저 적고, 이어서 내가 처음 한 행동을 적어요.":"물이나 주변을 처음 보았을 때의 모습 또는 내가 처음 한 행동을 적어요.",placeholder:s=>s.answers.level==="2수준"?"물과 주변은 어떻게 보였나요? 먼저 무엇을 했고 몸은 어떻게 느꼈나요?":"예: 물에 가까이 가자 ○○하게 느껴졌다.",words:["먼저","가까이 가자","눈에 들어온","들려온 소리","손으로 만지자","발을 넣자","생각보다"],note:s=>s.answers.level==="2수준"?"감각 한 가지와 먼저 한 일을 이어 쓰면 장면이 선명해져요.":"배경 다음에 이어지는 첫 행동을 적어 보세요.",help:"본 것, 들은 것, 먼저 한 행동 가운데 하나만 골라도 좋아요."},
{type:"write",short:"기억에 남는 일",typeLabel:"3번째 부분",kicker:"MOMENT",title:"가장 기억에 남는 일은 무엇인가요?",instruction:s=>s.answers.level==="2수준"?"사소한 한 순간을 골라 움직임과 감각을 대여섯 문장으로 자세히 적어요.":"한 순간의 움직임과 느낌을 서너 문장으로 적어요.",key:"moment",contextKey:"opening",contextLabel:"앞에서 쓴 먼저 한 일",exampleLabel:s=>`3. 기억에 남는 일 예시 · ${s.answers.level||"1수준"}`,exampleText:s=>s.answers.level==="2수준"?"조금 뒤 우리는 물 위로 나온 돌을 밟으며 반대편으로 건너갔다. 나는 두 팔을 벌리고 한 발씩 조심히 옮겼다. 세 번째 돌에 발을 올리는 순간 발바닥이 미끈하게 밀렸다. 몸이 옆으로 기울더니 “풍덩!” 소리와 함께 물속에 주저앉았다. 차가운 물이 허리까지 올라오고 얼굴에도 튀었다. 바지가 다 젖어 멍하니 있자 사촌 형이 놀란 얼굴로 나를 보다가 웃음을 터뜨렸다.":"나는 물 위로 나온 돌을 밟으며 건너가고 있었다. 바로 그때 발이 미끄러져 물속에 풍덩 주저앉았고 차가운 물이 얼굴까지 튀었다.",prompt:s=>s.answers.level==="2수준"?"그 일 직전에 무엇을 하고 있었는지 쓴 뒤 움직임·소리·결과를 이어 적어요.":"몇 초 동안의 일을 느리게 돌려보듯 몸의 움직임, 소리, 보인 것과 느낀 것을 차례로 적어요.",placeholder:s=>s.answers.level==="2수준"?"그 직전 무엇을 하고 있었나요? 갑자기 무슨 일이 생겼고 몸은 어떻게 움직였나요?":"예: 바로 그때 ○○한 일이 생겼다.",words:["그때","갑자기","바로 그 순간","몸을 움직이다","소리가 나다","물이 튀다","잠깐 멈추다","다시"],note:s=>s.answers.level==="2수준"?"그 일 직전 → 기억에 남는 일 → 바로 생긴 결과의 순서로 써 보세요.":"사진으로 남기고 싶은 장면 한 가지만 자세히 적어요.",help:"‘바로 그때’나 ‘갑자기’로 시작하면 기억에 남는 일을 쉽게 이어 쓸 수 있어요."},
{type:"write",short:"마무리 적기",typeLabel:"4번째 부분",kicker:"FEELING",title:"그때와 지금의 마음은 어떤가요?",instruction:s=>s.answers.level==="2수준"?"사건 뒤의 느낌과 지금 드는 생각을 서너 문장으로 적어요.":"사건 뒤의 느낌과 지금 생각을 두세 문장으로 적어요.",key:"feeling",contextKey:"moment",contextLabel:"앞에서 쓴 사건",exampleLabel:s=>`4. 느낌과 생각 예시 · ${s.answers.level||"1수준"}`,exampleText:s=>s.answers.level==="2수준"?"처음에는 창피해서 입이 삐죽 나왔다. 하지만 바지에서 물이 줄줄 떨어지는 모습을 보니 나도 웃음이 났다. 돌을 먼저 손으로 짚어 보고 움직였다. 지금도 계곡을 떠올리면 그때 함께 웃었던 순간이 먼저 생각난다.":"옷이 모두 젖어 처음에는 창피했지만 사촌들이 웃는 모습을 보니 나도 웃음이 났다. 지금 생각하면 그 일이 그날의 가장 재미있는 기억이다. 다음에는 미끄럽지 않은 돌부터 살피고 다시 가고 싶다.",prompt:s=>s.answers.level==="2수준"?"사건 직후의 마음, 달라진 마음, 지금의 생각을 차례로 이어 보세요.":"처음과 나중의 마음이 달라졌다면 그 변화도 적어 보세요.",placeholder:s=>s.answers.level==="2수준"?"처음에는 어떤 마음이었나요? 마음은 왜 달라졌나요? 지금은 그 일을 어떻게 생각하나요?":"예: 처음에는 ○○했지만 나중에는 ○○했다.",words:["처음에는","조금 뒤에는","그때는","하지만","그래서","마음이 달라졌다","기억에 남는다","지금 생각하면","다음에는"],note:s=>s.answers.level==="2수준"?"마음의 변화와 지금의 생각을 연결하면 글의 마무리가 깊어져요.":"느낌이나 앞으로의 생각으로 글을 마무리해요.",help:"‘처음에는 …했지만’처럼 마음의 변화를 이어 보세요."},
{type:"review",strategy:{level:"함께 사용",name:"순서대로 이어 읽고 다듬기",cue:"짧은 문장들이 한 편의 경험 이야기로 자연스럽게 이어지나요?",when:"각 부분은 썼지만 앞뒤가 끊겨 보일 때",do:"배경 → 먼저 한 일 → 기억에 남는 일 → 느낌과 생각의 순서로 읽고 필요한 말을 보태요.",why:"경험의 흐름과 마음의 변화를 독자가 쉽게 따라갈 수 있어요."},short:"완성하기",typeLabel:"이어 읽기",kicker:"FINAL",title:"네 부분을 이어 나의 생활문을 완성해요",instruction:"앞에서 쓴 문장을 순서대로 읽고 겹치거나 빠진 내용을 고쳐요.",sections:[{label:"경험의 배경",key:"setting"},{label:"먼저 한 일",key:"opening"},{label:"기억에 남는 일",key:"moment"},{label:"느낌과 생각",key:"feeling"}],finalTitle:"나의 물놀이 생활문",help:"시간의 흐름이 어색하면 ‘도착하자·바로 그때·처음에는·지금 생각하면’ 같은 말을 활용해 보세요."},
{type:"finish",short:"마침",typeLabel:"완료",kicker:"CLEAR",title:"1회차 생활문을 마쳤어요",instruction:"한 경험을 네 부분으로 나누어 차례대로 표현했어요.",message:"물놀이의 장면과 마음이 담긴 생활문이 완성되었어요!",detail:"다음 회차에서는 안전한 물놀이 방법을 순서에 맞게 설명해요."}],compose:s=>[s.texts.setting,s.texts.opening,s.texts.moment,s.texts.feeling]};</script><script src="pilot-config.js"></script><script src="session04-pilot-bootstrap.js"></script><script src="lesson.js"></script><script src="session04-coach-controls.js"></script><script src="screen-annotation.js"></script></body></html>
