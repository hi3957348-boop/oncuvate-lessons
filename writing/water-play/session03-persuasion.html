<!doctype html><html lang="ko" data-lesson-id="water-play" data-lesson-version="1.0.0"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3회차 더 좋은 물놀이 약속 | Oncuvate</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="pilot.css"><link rel="stylesheet" href="session04-pilot.css"></head><body><div class="app"><aside class="side"><div class="brand"><span class="brand-mark"></span><span><strong>Oncuvate</strong><small>WRITING STUDIO</small></span></div><p class="course-label" id="sessionLabel"></p><h2 id="sideTitle"></h2><nav class="journey" id="journey"></nav></aside><main class="main"><header class="top"><div><p class="eyebrow">생각을 정리하는 주제 글쓰기</p><h1 id="topTitle"></h1></div><div class="top-tools"><span class="saved" id="saved">기기에 저장됨</span><a class="pilot-entry-link" href="session03-entry.html">입장화면으로</a></div></header><div id="page"></div><div class="nav" id="nav"></div></main></div><div class="toast" id="toast"></div><p class="copyright">© 온큐베이트 · 자체 제작</p><div class="watermark" id="watermark"></div><script>window.WATER_PLAY_LESSON={id:"persuasion",session:"3회차",genre:"주장하는 글",title:"더 좋은 물놀이 약속",pages:[
{type:"choice",short:"수준 고르기",typeLabel:"글의 길이",kicker:"LEVEL",title:"나에게 맞는 수준을 골라요",instruction:"주장과 근거의 짜임은 같고 설명의 자세한 정도가 달라요.",key:"level",choices:[{value:"1수준",label:"1수준",desc:"주장과 두 근거를 분명히 밝혀 약 300자의 글을 써요."},{value:"2수준",label:"2수준",desc:"구체적인 상황과 영향을 더해 약 500자의 글을 써요."}],promptTitle:"오늘 도전할 수준",prompt:"고른 수준의 예시를 부분별로 읽고 내 입장에 맞는 글을 써요.",help:"망설여진다면 1수준으로 시작해도 좋아요. 두 수준 모두 주장·근거·마무리의 순서는 같아요."},
{type:"choice",short:"질문 고르기",typeLabel:"쟁점 선택",kicker:"QUESTION",title:"의견을 말하고 싶은 질문을 골라요",instruction:"정답을 맞히는 문제가 아니라 서로 다른 생각이 가능한 질문이에요.",key:"question",choices:[{value:"물놀이 장소에는 정해진 휴식 시간이 필요할까?",label:"정해진 휴식 시간",desc:"모두가 같은 시간에 물 밖으로 나와 쉬어야 할까?"},{value:"얕은 물에서도 어린이는 구명조끼를 입어야 할까?",label:"얕은 물의 구명조끼",desc:"물이 얕더라도 항상 착용하는 것이 좋을까?"},{value:"인기 있는 물놀이 장소는 입장 인원을 제한해야 할까?",label:"입장 인원 제한",desc:"붐비는 날에는 들어가는 사람 수를 줄여야 할까?"},{value:"물놀이 장소에서 일회용품 사용을 제한해야 할까?",label:"일회용품 사용 제한",desc:"편리함보다 쓰레기를 줄이는 일이 더 중요할까?"}],help:"가장 말하고 싶은 것이 분명한 질문을 고르세요. 어려우면 실제로 겪은 적이 있는 문제를 고르면 좋아요."},
{type:"choice",short:"입장 정하기",typeLabel:"찬성·반대",kicker:"STANCE",title:"내 입장을 먼저 정해요",instruction:"앞에서 고른 질문을 떠올리며 현재 생각에 가까운 쪽을 선택해요.",key:"stance",choices:[{value:"찬성",label:"찬성",desc:"그렇게 하는 편이 더 좋다고 생각해요."},{value:"반대",label:"반대",desc:"꼭 그렇게 할 필요는 없다고 생각해요."},{value:"조건부 찬성",label:"조건부 찬성",desc:"어떤 경우에는 필요하지만 항상 그렇지는 않아요."}],promptTitle:"입장은 바뀌어도 괜찮아요",prompt:"근거를 생각하다가 더 알맞은 입장으로 다시 고를 수 있어요.",help:"‘항상 그래야 하나?’를 생각하면 찬성과 반대 사이에서 내 입장을 정하기 쉬워요."},
{type:"brainstorm",short:"단어 모으기",typeLabel:"함께 생각",kicker:"BRAINSTORM",title:"내 입장을 설명할 말을 먼저 모아요",instruction:"근거 문장보다 먼저 좋은 점, 걱정되는 점, 생길 결과를 짧은 말로 올려요.",imageCues:{src:"assets/images/water-play-opinion-photo-cues.webp",alt:"함께 쉬는 아이들, 구명조끼를 입은 아이, 붐비는 물놀이장, 다회용품과 일회용 쓰레기를 보여 주는 실사 사진 네 장",labels:["함께 쉬는 시간","얕은 물의 구명조끼","붐비는 물놀이 장소","일회용품과 쓰레기"]},contextKeys:["question","stance"],prompt:"선택한 질문과 입장을 보고 왜 그런지 떠오르는 까닭, 사람이나 환경에 생길 변화를 적어요.",placeholder:"예: 사고 예방, 이용 불편",help:"찬성과 반대가 섞여도 괜찮아요. 내 입장에 쓸 말은 다음에 따로 고르면 돼요."},
{type:"write",strategy:{level:"선택해서 사용",name:"충분히 괜찮은 주장 문장 쓰기",cue:"지금의 입장을 임시 문장으로 먼저 적어도 괜찮아요.",when:"입장은 정했지만 문장을 어떻게 시작할지 막힐 때",do:"질문에 찬성·반대·조건부 찬성 중 내 답을 한 문장으로 적어요.",why:"주장이 생기면 어떤 근거가 필요한지 찾기 쉬워져요."},short:"주장 쓰기",typeLabel:"한 문장",kicker:"CLAIM",title:"질문에 대한 나의 주장을 써요",instruction:s=>s.answers.level==="2수준"?"입장과 중요하게 여기는 까닭을 두 문장으로 밝혀요.":"입장을 한두 문장으로 분명하게 밝혀요.",key:"claim",contextKey:"question",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 주장",exampleText:s=>s.answers.level==="2수준"?"나는 수영장에 모두가 함께 지키는 짧은 휴식 시간이 필요하다고 생각한다. 사람마다 쉬고 싶은 때가 다르더라도 안전을 위해 일정한 간격으로 물 밖에 나오는 시간이 있어야 한다.":"나는 수영장에 모두가 지키는 짧은 휴식 시간이 필요하다고 생각한다. 신나게 놀 때에도 몸을 쉬게 하는 약속이 있어야 한다.",prompt:s=>`선택한 입장은 ‘${s.answers.stance||"아직 선택하지 않음"}’이에요. 질문에 바로 답하는 문장을 만들어 보세요.`,placeholder:"나는 …하는 것이 좋다고 생각한다. 또는 …할 필요는 없다고 본다.",words:s=>s.answers.stance==="반대"?["꼭 필요하지 않다","다른 방법이 있다","상황에 따라 다르다","선택할 수 있다"]:["필요하다","지켜야 한다","도움이 된다","더 안전하다","줄일 수 있다"],help:"질문의 끝을 ‘~해야 한다’ 또는 ‘~할 필요는 없다’로 바꾸면 주장 문장을 만들 수 있어요."},
{type:"reasons",strategy:{level:"선택해서 사용",name:"한 번에 한 근거 쓰기",cue:"지금은 화면에 나온 근거 하나만 완성해요.",when:"두 근거와 설명을 한꺼번에 생각하기 벅찰 때",do:"씨앗 하나를 고르고 근거 문장과 구체적인 설명을 차례로 적어요.",why:"생각이 섞이지 않고 서로 다른 근거를 만들 수 있어요."},short:"근거 만들기",typeLabel:"두 근거+확장",kicker:"REASONS",title:"한 페이지에서 두 가지 근거를 완성해요",instruction:s=>s.answers.level==="2수준"?"근거마다 구체적인 상황·영향을 두세 문장으로 확장해요.":"근거마다 까닭이나 생길 결과를 한두 문장으로 덧붙여요.",examples:s=>s.answers.level==="2수준"?["첫째, 신나게 놀다 보면 몸이 지치거나 추워진 것을 스스로 알아차리기 어렵다. 정해진 시간에 물 밖으로 나오면 몸 상태를 살피고 물을 마실 수 있다. 특히 어린이는 더 놀고 싶은 마음 때문에 피곤함을 참고 계속 놀 수도 있다. 쉬는 동안 보호자도 아이의 표정과 체온을 살피고 필요한 도움을 줄 수 있다.","둘째, 사람들이 한꺼번에 물 밖으로 나오면 안전요원이 물속과 시설을 자세히 확인하기 쉽다. 바닥에 떨어진 물건이나 고장 난 놀이기구를 발견하면 다음 놀이 전에 바로 조치할 수 있다."]:["첫째, 물속에서 오래 놀면 몸이 지치거나 추워진 것을 알아차리기 어렵다. 정해진 시간에 물 밖으로 나오면 몸 상태를 확인하고 물을 마실 수 있다.","둘째, 사람들이 함께 나오면 안전요원이 물속과 놀이기구에 위험한 곳은 없는지 살피기 쉽다."],seeds:{"물놀이 장소에는 정해진 휴식 시간이 필요할까?":{"찬성":["피로 알아차리기","체온 회복","안전 점검","사고 예방"],"반대":["사람마다 다른 체력","놀이 흐름 중단","자율적인 휴식","공간별 차이"],"조건부 찬성":["어린이 이용 시간","혼잡한 날","장시간 이용","안내 방송"]},"얕은 물에서도 어린이는 구명조끼를 입어야 할까?":{"찬성":["미끄러짐","갑작스러운 깊이","균형 유지","보호자 안심"],"반대":["움직임 불편","정확한 수심 확인","가까운 보호자","수영 연습"],"조건부 찬성":["수영이 서툰 경우","물살이 있는 곳","보호자가 먼 경우","놀이기구 이용"]},"인기 있는 물놀이 장소는 입장 인원을 제한해야 할까?":{"찬성":["충돌 위험","안전요원 관찰","깨끗한 환경","쉴 공간"],"반대":["이용 기회","예약 불편","넓은 공간 활용","시간대 분산"],"조건부 찬성":["매우 붐비는 날","좁은 장소","안전요원 수","날씨 변화"]},"물놀이 장소에서 일회용품 사용을 제한해야 할까?":{"찬성":["쓰레기 감소","동물과 환경","청소 부담","재사용 용기"],"반대":["위생 관리","보관의 어려움","방문객 편의","대체품 비용"],"조건부 찬성":["재활용이 어려운 품목","쓰레기 많은 기간","대여 용기 제공","매점부터 시작"]}},fallback:{"찬성":["안전","환경 보호","다른 사람 배려","사고 예방"],"반대":["선택의 자유","상황의 차이","불편 증가","다른 해결책"],"조건부 찬성":["필요한 경우","장소에 따라","대안 제공","단계적 적용"]},help:"첫 번째 근거와 두 번째 근거가 같은 말을 반복하지 않는지 확인해 보세요."},
{type:"write",short:"마무리 쓰기",typeLabel:"생각 정리",kicker:"CLOSING",title:"반대 생각을 살피고 실천 방법을 제안해요",instruction:s=>s.answers.level==="2수준"?"다른 입장을 인정한 뒤 현실적인 방법을 두세 문장으로 제안해요.":"다른 생각을 살피고 실천 방법을 한두 문장으로 제안해요.",key:"closing",contextKey:"claim",contextLabel:"앞에서 쓴 주장",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 마무리",exampleText:s=>s.answers.level==="2수준"?"물론 쉬는 도중에 놀이의 흐름이 끊겨 아쉬울 수 있다. 하지만 한 시간에 한 번, 10분 정도 함께 쉬는 약속이라면 불편을 줄이면서 사고도 예방할 수 있다. 모두가 안전하게 오래 놀기 위해 정해진 휴식 시간을 운영하면 좋겠다.":"잠깐 쉬면 놀이가 끊겨 아쉬울 수 있지만 사고를 막는 일이 더 중요하다. 한 시간에 한 번 정도 함께 쉬는 시간을 정하면 모두가 더 안전하게 물놀이를 즐길 수 있다.",prompt:"다른 입장에서 걱정할 점을 짧게 인정하고, 내 주장을 실천할 방법을 제안해요.",placeholder:"예: 불편할 수 있지만 …하면 문제를 줄일 수 있다. 따라서 …하면 좋겠다.",words:["물론","하지만","불편을 줄이다","사고를 예방하다","따라서","운영하면 좋겠다"],help:"새 근거를 더하기보다 앞의 주장을 현실적으로 실천할 방법으로 끝내세요."},
{type:"review",short:"완성하기",typeLabel:"주장글 조립",kicker:"FINAL",title:"주장과 두 근거를 모아 짧은 글을 완성해요",instruction:"마지막에 독자에게 바라는 변화나 실천을 한 문장 덧붙여요.",sections:[{label:"선택한 질문",answerKey:"question"},{label:"나의 주장",key:"claim"},{label:"첫 번째 근거",key:"reason1"},{label:"첫 번째 확장",key:"detail1"},{label:"두 번째 근거",key:"reason2"},{label:"두 번째 확장",key:"detail2"},{label:"글의 마무리",key:"closing"}],finalTitle:"나의 물놀이 주장글",help:"완성 글의 끝에 ‘따라서…’로 시작하는 실천 제안 한 문장을 직접 덧붙여 보세요."},
{type:"finish",short:"마침",typeLabel:"완료",kicker:"CLEAR",title:"3회차 주장글을 마쳤어요",instruction:"입장과 서로 다른 두 근거가 분명한 글을 완성했어요.",message:"짧지만 근거가 분명한 주장글이 되었어요!",detail:"다음 회차에서는 실제 물놀이 장면의 소리와 움직임을 시로 표현해요."}],compose:s=>[s.texts.claim,s.texts.reason1,s.texts.detail1,s.texts.reason2,s.texts.detail2,s.texts.closing]};</script><script src="pilot-config.js"></script><script src="session04-pilot-bootstrap.js"></script><script src="lesson.js"></script><script src="session04-coach-controls.js"></script><script src="screen-annotation.js"></script></body></html>
