{type:"choice",short:"수준 고르기",typeLabel:"시의 길이",kicker:"LEVEL",title:"나에게 맞는 수준을 골라요",instruction:"같은 한 장면을 표현하되 행 수와 감각 표현의 밀도가 달라요.",key:"level",choices:[{value:"1수준",label:"1수준",desc:"보이는 것·소리·느낌을 살려 6~8행으로 표현해요."},{value:"2수준",label:"2수준",desc:"장면의 변화와 여운을 더해 10~14행으로 표현해요."}],promptTitle:"오늘 도전할 수준",prompt:"고른 수준의 예시를 부분별로 읽고 내 장면을 시로 옮겨요.",help:"시는 글자 수보다 장면이 선명한지가 중요해요. 한 장면을 더 깊이 펼치고 싶다면 2수준을 골라요."},
{type:"choice",short:"순간 고르기",typeLabel:"실제 장면",kicker:"MOMENT",title:"시로 남기고 싶은 순간을 골라요",instruction:"꾸며낸 사건이 아니라 경험했거나 사진에서 본 장면을 떠올려요.",key:"moment",choices:[{value:"물에 처음 발을 넣는 순간",label:"처음 물에 들어갈 때",desc:"차가움, 망설임과 첫 움직임"},{value:"파도가 가까이 다가오는 순간",label:"파도가 다가올 때",desc:"멀리서 가까워지는 소리와 움직임"},{value:"물장구를 치는 순간",label:"물장구를 칠 때",desc:"튀어 오르는 물방울과 웃음소리"},{value:"햇빛을 받은 물을 바라보는 순간",label:"반짝이는 물을 볼 때",desc:"빛, 색과 천천히 움직이는 물결"}],help:"가장 많은 소리나 움직임이 떠오르는 장면을 고르면 시를 쓰기 쉬워요."},
{type:"brainstorm",strategy:{level:"독립 적용",name:"감각 낱말 먼저 쏟아내기",cue:"멋진 문장보다 보이고 들리고 느껴진 말을 먼저 모아요.",when:"장면은 떠오르지만 시의 첫 줄이 생각나지 않을 때",do:"소리·움직임·촉감에서 떠오르는 말을 올리고 마음에 드는 말을 골라요.",why:"친구들의 서로 다른 감각 표현이 내 시의 재료를 넓혀 줘요."},short:"단어 모으기",typeLabel:"함께 생각",kicker:"BRAINSTORM",title:"한 장면에서 들리고 보이고 느껴진 말을 모아요",instruction:"문장을 만들지 않고 감각 낱말과 짧은 표현을 한 개씩 올려요.",imageCues:s=>({
  "물에 처음 발을 넣는 순간":{src:"assets/images/water-play-sensory-photo-cues.webp",focus:"bottom-right",alt:"물에 처음 발을 넣으며 발목에 닿는 차가움을 느끼는 장면",labels:["조심스러운 발끝","발목의 차가움","천천히 번지는 물결","망설이다 들어가기"]},
  "파도가 가까이 다가오는 순간":{src:"assets/images/water-play-sensory-photo-cues.webp",focus:"top-right",alt:"멀리 있던 파도가 하얀 거품을 만들며 발끝으로 다가오는 장면",labels:["멀리서 다가오다","하얀 물거품","철썩이는 소리","점점 가까워지다"]},
  "물장구를 치는 순간":{src:"assets/images/water-play-sensory-photo-cues.webp",focus:"bottom-left",alt:"물장구를 치며 투명한 물방울이 공중으로 튀어 오르는 장면",labels:["튀어 오르는 물방울","첨벙첨벙","빠른 손과 발","터지는 웃음소리"]},
  "햇빛을 받은 물을 바라보는 순간":{src:"assets/images/water-play-sensory-photo-cues.webp",focus:"top-left",alt:"햇빛을 받아 물 위의 작은 빛 조각이 반짝이는 장면",labels:["반짝이는 빛","금빛 작은 조각","잔잔한 물결","천천히 흔들리다"]}
}[s.answers.moment]||{src:"assets/images/water-play-sensory-photo-cues.webp",focus:"top-left",alt:"햇빛을 받아 물 위가 반짝이는 장면",labels:["반짝이는 빛","잔잔한 물결","여름 햇살","천천히 흔들리다"]}),contextKeys:["moment"],prompt:"소리, 움직임, 빛, 온도, 피부에 닿은 느낌 가운데 하나를 떠올려요.",placeholder:"예: 철썩철썩, 발끝이 시리다",help:"실제로 그 장면에서 느낄 수 있는 말이면 의성어·의태어·짧은 구 모두 좋아요."},
{type:"sequence",short:"세 줄 만들기",typeLabel:"장면 펼치기",kicker:"LINES",title:"장면을 세 방향에서 바라봐요",instruction:"각 단계의 예시를 읽고, 내 장면에서 보이고 들리고 느껴진 것을 바로 적어요.",stages:[{key:"see",title:"무엇이 어떻게 보이나요?",prompt:"색, 빛, 모양 또는 움직임을 적어요.",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 보이는 모습",exampleText:s=>s.answers.level==="2수준"?"멀리 있던 파도가 하얀 거품 모자를 쓰고 모래밭을 성큼성큼 달려온다. 나는 두 발을 모으고 기다린다.":"멀리 있던 파도가 하얀 거품을 앞세우고 내 발끝까지 달려온다.",placeholder:"예: 햇빛이 물 위에서 작은 조각처럼 흔들린다.",words:["반짝이다","둥글게 퍼지다","하얀 물거품","투명한 물방울","천천히 흔들리다"]},{key:"hear",title:"어떤 소리가 들리나요?",prompt:"소리를 그대로 쓰거나 소리가 커지고 작아지는 모습을 적어요.",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 들리는 소리",exampleText:s=>s.answers.level==="2수준"?"철썩! 놀란 웃음이 먼저 튀어나오고, 파도는 잡았던 손을 놓듯 스르르 바다로 돌아간다.":"철썩! 파도는 웃는 소리만 남기고 다시 바다로 돌아간다.",placeholder:"예: 철썩철썩, 파도가 가까이서 말을 건다.",words:["철썩철썩","첨벙","쏴아","톡톡","멀리서","바로 옆에서"]},{key:"feel",title:"몸과 마음은 어떻게 느끼나요?",prompt:"피부의 느낌과 그 순간 마음을 함께 적어요.",exampleLabel:s=>(s.answers.level||"1수준")+" 예시 · 몸과 마음",exampleText:s=>s.answers.level==="2수준"?"발목을 와락 잡는 차가움, 발가락 사이 모래가 간질거린다. 나는 한 걸음 뒤로 폴짝 뛰고 다음 파도를 기다린다.":"발목을 잡는 차가움에 나는 뒤로 폴짝 뛴다.",placeholder:"예: 차가운 물이 발목을 잡자 웃음이 먼저 튀어나온다.",words:["차갑다","서늘하다","간질간질하다","깜짝 놀라다","신이 나다","마음이 시원해지다"]}],help:"예시의 표현을 그대로 옮기지 말고 내 장면에서 실제로 보이거나 느껴진 말로 바꾸어 적어요."},
{type:"write",short:"시 쓰기",typeLabel:"행으로 표현",kicker:"POEM",title:"고른 낱말과 세 줄을 이용해 시를 써요",instruction:s=>s.answers.level==="2수준"?"장면의 변화와 여운이 보이도록 10~14행으로 써요.":"보이는 것·소리·느낌이 담기도록 6~8행으로 써요.",key:"poem",contextKey:"moment",prompt:s=>s.answers.level==="2수준"?"다가오는 모습, 만난 순간, 지나간 뒤의 모습을 10~14행으로 펼쳐요.":"한 장면에서 보인 것, 들린 소리와 몸의 느낌을 6~8행으로 적어요.",placeholder:"장면이 바뀌거나 잠시 멈추어 읽고 싶은 곳에서 줄을 바꾸어 써 보세요.",words:s=>s.answers.poemWords||[],note:"줄 수보다 장면이 눈앞에 떠오르는지가 더 중요해요.",help:"앞에서 쓴 ‘보이는 것·소리·느낌’ 중 마음에 드는 문장 하나를 첫 행으로 옮겨 보세요."},
{type:"write",short:"제목 붙이기",typeLabel:"가장 중요한 말",kicker:"TITLE",title:"시에서 가장 중요한 장면을 제목으로 붙여요",instruction:"길게 설명하지 말고 한 낱말이나 짧은 구로 정해요.",key:"poemTitle",prompt:"시를 다 읽은 뒤 가장 오래 남는 물건, 소리나 느낌을 제목으로 골라요.",placeholder:"예: 첫 파도 / 발끝의 여름 / 첨벙",words:["첫 파도","물방울","발끝","여름","차가운 웃음","반짝이는 물"],help:"시의 첫 행을 그대로 제목으로 쓰기보다, 시 전체를 묶는 짧은 말을 골라 보세요."},
{type:"review",strategy:{level:"독립 적용",name:"소리 내어 읽으며 검토하기",cue:"읽을 때 입에 걸리거나 숨이 막히는 곳이 있나요?",when:"어디서 줄을 바꾸고 어떤 말을 덜어낼지 모를 때",do:"천천히 소리 내어 읽고 걸리는 부분의 줄이나 낱말 하나를 고쳐요.",why:"눈으로만 읽을 때 놓친 리듬과 어색한 표현을 찾을 수 있어요."},short:"완성하기",typeLabel:"소리 내어 읽기",kicker:"FINAL",title:"제목과 시를 천천히 읽어 봐요",instruction:"줄을 바꾼 곳에서 잠깐 쉬어 읽으며 어색한 부분을 고쳐요.",sections:[{label:"제목",key:"poemTitle"},{label:"나의 시",key:"poem"}],finalTitle:"나의 물놀이 시",help:"같은 뜻의 말이 이어지면 하나를 빼 보고, 가장 마음에 드는 행은 그대로 남겨 보세요."},
{type:"finish",short:"마침",typeLabel:"완료",kicker:"CLEAR",title:"4회차 물놀이 시를 마쳤어요",instruction:"실제 장면을 소리와 움직임, 촉감으로 표현했어요.",message:"물놀이의 한순간이 짧은 시가 되었어요!",detail:"한 주제로 생활문, 설명문, 주장글과 시까지 네 가지 글을 모두 완성했어요."}],compose:s=>[s.texts.poemTitle?`〈${s.texts.poemTitle}〉`:"",s.texts.poem]};</script><script src="pilot-config.js"></script><script src="lesson.js"></script></body></html>
