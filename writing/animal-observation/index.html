<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#35206f">
  <title>1회차 동물 관찰기록문 | Oncuvate</title>
  <link rel="stylesheet" href="./entry.css">
</head>
<body>
  <main class="entry-shell">
    <div class="entry-stage">
      <img class="brand-logo" src="../../literature/assets/oncuvate-brand-logo.png" alt="Oncuvate">

      <section class="entry-card" aria-labelledby="entryTitle">
      <p class="eyebrow">ONCUVATE WRITING STUDIO</p>
      <h1 id="entryTitle">생각을 정리하는<br>주제글쓰기</h1>
      <div class="lesson-badge">
        <span>1회차</span>
        <strong>동물 · 관찰기록문</strong>
      </div>
      <p class="intro">이용 방법을 선택해 주세요.</p>

      <div class="entry-options" id="entryOptions">
        <button class="entry-option" id="selfEntry" type="button">
          <span class="option-icon person-icon" aria-hidden="true"></span>
          <span class="option-copy">
            <strong>자율활동</strong>
            <small>내 속도에 맞춰 관찰하고 글쓰기</small>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </button>

        <button class="entry-option" id="liveEntry" type="button">
          <span class="option-icon class-icon" aria-hidden="true"></span>
          <span class="option-copy">
            <strong>실시간 수업 참여</strong>
            <small>강사가 알려 준 5자리 코드로 입장</small>
          </span>
          <span class="arrow" aria-hidden="true">›</span>
        </button>
      </div>

      <form class="code-form" id="codeForm" hidden>
        <div class="form-heading">
          <button class="back-button" id="backToOptions" type="button" aria-label="이전 화면">‹</button>
          <div>
            <strong>실시간 수업 참여</strong>
            <small>수업 코드와 학생번호를 입력해 주세요.</small>
          </div>
        </div>
        <label for="classCode">5자리 수업 코드</label>
        <input id="classCode" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="00000" required>
        <label for="studentNumber">학생번호</label>
        <input id="studentNumber" inputmode="numeric" maxlength="12" placeholder="학생번호를 입력하세요" required>
        <button class="primary-action" type="submit">수업 입장</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>

      <p class="teacher-entry">승인된 강사이신가요?
        <a href="../../?entry=teacher&amp;lesson=animal-observation">강사 로그인</a>
      </p>
      </section>
    </div>
  </main>

  <aside class="save-status" aria-label="활동 저장 안내">
    <span class="status-dot"></span>
    <span><strong>활동 내용 자동 저장</strong><small id="storageStatus">서버 연결 준비</small></span>
  </aside>

  <script src="./entry.js"></script>
</body>
</html>
