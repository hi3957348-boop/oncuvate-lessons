    async function syncServer(status='in_progress'){const saved=document.getElementById('saved');try{const response=await fetch(`${API_BASE}/writing-sessions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(serverPayload(status))});if(!response.ok)throw Error();if(saved)saved.textContent='서버 저장됨';return true}catch{if(saved)saved.textContent='기기에 저장됨 · 서버 연결 대기';return false}}

    function sourceActivity(i,a){
      const answers=state.sources[i]||{},answered=Object.keys(answers).length,total=a.sourceCards.length,complete=answered===total;
      return `<div class="source-page"><div class="source-concepts"><div class="source-concept observe"><b>직접 관찰해서 알 수 있어요</b><span>사진에 보이는 색, 모양, 위치, 움직임처럼 눈으로 확인할 수 있는 정보예요.</span></div><div class="source-concept learn"><b>읽거나 들어야 알 수 있어요</b><span>먹이, 사는 곳, 습성처럼 설명이나 책, 영상에서 배워야 하는 정보예요.</span></div></div><div class="source-activity"><div class="source-head"><div><h4>정보 카드를 알맞게 나눠 보세요</h4><p>각 문장을 읽고 정보가 어디에서 왔는지 하나를 선택하세요.</p></div><span class="source-progress">${answered} / ${total} 완료</span></div><div class="source-grid">${a.sourceCards.map((c,n)=>{const selected=answers[n],correct=selected&&selected===c[1],feedback=!selected?'':correct?'맞아요. 정보의 출처를 정확히 찾았어요.':'다시 생각해 보세요. 사진만으로 확인할 수 있을까요?';return `<article class="source-card ${selected?'answered':''}"><div class="source-statement"><b>${n+1}</b><span>${c[0]}</span></div><div class="source-choices"><button class="${selected==='observe'?(correct?'correct':'wrong'):''}" onclick="classifySource(${i},${n},'observe')" aria-pressed="${selected==='observe'}">눈으로 관찰</button><button class="${selected==='learn'?(correct?'correct':'wrong'):''}" onclick="classifySource(${i},${n},'learn')" aria-pressed="${selected==='learn'}">읽거나 듣기</button></div><p class="source-feedback ${selected?(correct?'correct':'wrong'):''}">${feedback}</p></article>`}).join('')}</div></div>${complete?`<div class="source-complete"><div><strong>정보 출처 구분 완료!</strong><span>관찰한 사실과 배운 정보를 나누는 힘이 생겼어요.</span></div><button class="source-reset" onclick="resetSources(${i})">다시 해 보기</button></div>`:''}</div>`;
    }
    function render(){document.getElementById('journey').innerHTML=steps.map((s,i)=>`<button onclick="go(${i})" data-nav="${i}"><span class="dot">${i===0?'●':i===7?'✓':i}</span><span>${esc(s.nav)}</span></button>`).join('');document.getElementById('pages').innerHTML=steps.map((s,i)=>i===0?startPage():i===7?finalPage():writePage(i)).join('');go(current,false)}
    function startPage(){return `<section class="page" data-page="0"><div class="panel hero"><small>동물 사진 관찰 프로젝트</small><h2>자세히 보는 힘이<br>정확한 글을 만들어요.</h2><p>파충류·조류·어류·포유류의 사진을 전체, 세부, 행동으로 나누어 관찰하고 ‘보이는 사실’과 ‘내 생각’을 구별해 기록해요.</p><div class="chips"><span class="hero-chip">4종의 대표 동물</span><span class="hero-chip">단계별 맞춤 관찰 사진</span><span class="hero-chip">30초 사진 탐정</span></div></div>
      <div class="card"><div class="title-row"><span class="num">1</span><div><h3>나의 관찰 기록 정보</h3><p>제목은 마지막에 다시 고쳐도 괜찮아요.</p></div></div><div class="fields"><div><label class="label" for="name">이름</label><input class="input" id="name" value="${esc(state.name)}" placeholder="이름을 적어 주세요" oninput="state.name=this.value;save()"></div><div><label class="label" for="title">관찰문 제목</label><input class="input" id="title" value="${esc(state.title)}" placeholder="예: 나뭇가지 위의 카멜레온" oninput="updateTitle(this)"></div></div></div>
      <div class="card"><div class="title-row"><span class="num">2</span><div><h3>어떤 동물을 관찰할까요?</h3><p>네 분류에서 한 종씩 골랐어요. 원하는 동물을 직접 선택하세요.</p></div></div><div class="animal-grid">${animals.map(a=>`<button class="animal-card ${state.animal===a.name?'selected':''}" onclick="choose('${a.name}')"><div class="animal-thumb" style="${imageStyle(a,0)}"></div><div class="animal-copy"><small>${a.group}</small><strong>${a.name}</strong><span>${a.mission}</span></div></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="randomAnimal()">랜덤으로 한 종 뽑기</button><button class="primary" ${!state.animal?'disabled':''} onclick="go(1)">관찰 시작</button></div></div></section>`}
    function pageVisual(i,a){
      if(i===1)return `<div class="visual-card"><h4>전체 모습만 가볍게 관찰해요</h4><p>세부 특징보다 몸의 전체 모양과 첫인상에 집중하세요.</p><div class="whole-static" style="${imageStyle(a,0)}" role="img" aria-label="${a.name} 전체 모습"></div>${timerBox(i)}</div>`;
      if(i===2)return `<div class="visual-card"><h4>색과 무늬를 비교해요</h4><p>여섯 확대 사진을 한꺼번에 보며 색과 표면의 차이를 찾아보세요.</p><div class="detail-sheet" style="background-image:url('${a.detailFile}')" role="img" aria-label="${a.name} 세부 확대 사진 6장"></div>${timerBox(i)}</div>`;
      if(i===3){const n=state.detail[i]??0;return `<div class="visual-card"><h4>몸의 부분을 하나씩 확대해요</h4><p>아래에서 관찰할 부분을 고른 뒤 모양과 위치를 적어 보세요.</p><div class="zoom-view" style="background-image:url('${a.detailFile}');background-position:${detailPosition(n)}" role="img" aria-label="${a.name} ${a.details[n]} 확대"></div><div class="detail-picker">${a.details.map((t,x)=>`<button class="selector ${n===x?'on':''}" onclick="selectDetail(${i},${x})"><b>${x+1}</b>${t}</button>`).join('')}</div>${timerBox(i)}</div>`}
      if(i===4)return `<div class="visual-card"><h4>움직이는 모습을 관찰해요</h4><p>몸과 다리, 날개, 지느러미의 방향을 살펴보세요.</p><div class="single-eco" style="background-image:url('${a.ecoFile}');background-position:${ecoPosition(2)}" role="img" aria-label="${a.name} 움직임"></div>${timerBox(i)}</div>`;
      if(i===5)return `<div class="visual-card"><h4>사는 환경을 관찰해요</h4><p>물, 땅, 식물과 동물의 몸이 어떻게 어울리는지 살펴보세요.</p><div class="single-eco" style="background-image:url('${a.ecoFile}');background-position:${ecoPosition(0)}" role="img" aria-label="${a.name} 사는 환경"></div>${timerBox(i)}</div>`;
      return `<div class="visual-card"><h4>정보를 얻은 방법 확인하기</h4><p>사진에 직접 보이는지, 설명을 읽거나 들어야 알 수 있는지 구분하세요.</p>${sourceActivity(i,a)}</div>`;
    }
    function timerBox(i){return `<div class="timer"><strong id="clock${i}">00:30</strong><span>말하지 않고 사진만 보는 시간</span><button class="secondary" onclick="startTimer(${i})">30초 관찰 시작</button></div>`}
    function writePage(i){const a=animal(),s=steps[i],answer=state.answers[i]||'';if(i===6)return `<section class="page" data-page="${i}"><div class="panel"><header class="lesson-head"><span class="mission"><b>${i}</b> SOURCE MISSION</span><h2>${s.title}</h2><p>사진에서 직접 확인한 정보와 설명을 통해 알게 된 정보를 구분해요.</p></header><div class="lesson-body">${sourceActivity(i,a)}</div></div>${nav(i)}</section>`;return `<section class="page" data-page="${i}"><div class="panel"><header class="lesson-head"><span class="mission"><b>${i}</b> OBSERVATION MISSION</span><h2>${s.title}</h2><p>${s.desc}</p></header><div class="lesson-body">
      <div class="example-first"><strong>먼저 읽어 보는 초등 고학년 예시 · 아홀로틀</strong><p>${s.example}</p></div>
      <div class="task-guide"><b>오늘 볼 것</b>${s.guide}</div>
      <div class="writing-workspace">${pageVisual(i,a)}<div class="writing-card"><h4>사진을 보면서 바로 적어요</h4><p>관찰 낱말을 활용해 사진에서 찾은 내용을 자기 문장으로 적으세요.</p>
      <div class="support"><h4>${a.name} 관찰 낱말</h4><div class="words">${[...a.words,...s.base].map(w=>`<button class="word" onclick="insertWord(${i},'${w}')">${w}</button>`).join('')}</div></div><div class="write-help"><b>이 내용을 순서대로 적어 보세요</b><span>${esc(writingPrompts[i])}</span></div>
      <label class="write-label" for="a${i}"><span>나의 ${i}번째 관찰 문단</span><span class="count" id="count${i}">${answer.length}자</span></label><textarea class="area" id="a${i}" placeholder="${esc(writingPrompts[i])}" oninput="writeAnswer(${i},this)">${esc(answer)}</textarea><div class="feedback" id="feed${i}">${feedback(answer)}</div>
      </div></div></div></div>${nav(i)}</section>`}
    function finalPage(){const text=state.full||build();if(!state.full)state.full=text;return `<section class="page" data-page="7"><div class="panel"><header class="lesson-head"><span class="mission"><b>✓</b> FINAL REPORT</span><h2>나의 동물 관찰문 완성하기</h2><p>보이는 사실과 생각이 잘 구분되는지 확인하며 다듬어요.</p></header><div class="lesson-body"><div class="title-row"><span class="num">1</span><div><h3>관찰 기록 돌아보기</h3><p>내용이 비어 있거나 더 자세히 쓰고 싶은 단계를 확인하세요.</p></div></div><div class="review">${[1,2,3,4,5].map(i=>`<div class="review-item"><div class="review-head"><strong>${i}. ${steps[i].title}</strong><button class="ghost" onclick="go(${i})">고치기</button></div><p class="${state.answers[i]?'':'empty'}">${state.answers[i]?esc(state.answers[i]):'아직 작성하지 않았어요.'}</p></div>`).join('')}<div class="review-item"><div class="review-head"><strong>6. 정보의 출처 구분</strong><button class="ghost" onclick="go(6)">다시 보기</button></div><p class="${done(6)?'':'empty'}">${done(6)?`정보 카드 ${animal().sourceCards.length}개 구분 완료`:'아직 정보 출처 활동을 완료하지 않았어요.'}</p></div></div>
      <div class="card"><div class="title-row"><span class="num">2</span><div><h3>전체 관찰문 다듬기</h3><p>같은 말은 줄이고, 사진에서 찾은 구체적인 표현은 남겨요.</p></div></div><label class="label" for="finalTitle">제목</label><input class="input" id="finalTitle" value="${esc(state.title||animal().name+' 관찰 기록')}" oninput="updateTitle(this)"><label class="label" for="full" style="margin-top:11px">완성 관찰문</label><textarea class="area full" id="full" oninput="updateFinalText(this)">${esc(text)}</textarea><div class="actions" style="justify-content:flex-start"><button class="secondary" onclick="rebuild()">기록 다시 모으기</button><button class="secondary" onclick="copyText()">글 복사</button><button class="secondary" onclick="downloadText()">텍스트 저장</button><button class="primary" onclick="printText()">인쇄</button></div>
      <div class="submit"><h3>선생님께 관찰문 제출하기</h3><p>선택한 동물, 단계별 기록, 활동 과정과 완성 글이 수업 서버에 함께 저장돼요.</p><div class="privacy-check"><h4>제출하기 전에 확인해 주세요</h4><label class="privacy-confirm" for="privacyConfirm"><input type="checkbox" id="privacyConfirm" ${state.privacyConfirmed?'checked':''} onchange="togglePrivacyConfirmation(this)"><span>내 글에 실명, 학교명, 학년·반, 학생번호, 전화번호, 이메일, 친구의 실명처럼 나나 다른 사람을 알아볼 수 있는 정보가 들어 있지 않은지 확인했어요.</span></label><p>개인정보가 있다면 지운 뒤 제출해 주세요.</p></div><button class="primary" id="submitBtn" onclick="submitText()" ${state.privacyConfirmed?'':'disabled'}>확인하고 제출하기</button><div class="status" id="status" role="status" aria-live="polite"></div></div>${done(7)?shareComingSoon():''}</div></div></div>${nav(7)}</section>`}
    function shareComingSoon(){return `<aside class="share-coming" aria-labelledby="shareComingTitle"><span class="share-coming-mark" aria-hidden="true"></span><span class="share-coming-badge">정식 서비스 출시 예정</span><h3 id="shareComingTitle">내 글 나누기 · 모두의 글 책장</h3><p>완성한 글을 익명으로 나누고 다른 친구들의 글을 읽는 기능은 온큐베이트 정식 서비스 출시 후 제공됩니다. 안전한 익명 공유 방식으로 준비하고 있어요.</p><button type="button" disabled aria-disabled="true">출시 후 이용할 수 있어요</button></aside>`}
    function nav(i){return `<div class="nav"><button class="secondary" ${i===0?'disabled':''} onclick="go(${Math.max(0,i-1)})">이전 단계</button><span>${i+1} / ${steps.length}</span>${i<7?`<button class="primary" onclick="go(${i+1})">다음 단계</button>`:`<button class="primary" onclick="go(0)">처음으로</button>`}</div>`}
    function choose(name){state.animal=name;state.full='';state.privacyConfirmed=false;save();render();toast(name+' 관찰을 선택했어요.')}
    function randomAnimal(){state.animal=animals[Math.floor(Math.random()*animals.length)].name;state.full='';state.privacyConfirmed=false;save();render();toast(state.animal+'이(가) 나왔어요!')}
    function go(i,scroll=true){if(i>0&&!state.animal){toast('먼저 관찰할 동물을 골라 주세요.');i=0}current=Math.max(0,Math.min(7,i));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',Number(p.dataset.page)===current));document.querySelectorAll('[data-nav]').forEach((b,n)=>{b.classList.toggle('active',n===current);b.classList.toggle('done',done(n))});document.getElementById('topTitle').textContent=steps[current].title;save(false);if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
    function done(i){if(i===0)return !!state.animal;if(i===6)return animal().sourceCards.every((_,n)=>state.sources[6]?.[n]);if(i===7)return [1,2,3,4,5,6].every(done);return !!(state.answers[i]||'').trim()}
    function updateProgress(){const n=[1,2,3,4,5,6].filter(done).length,p=Math.round(n/6*100);document.getElementById('fill').style.width=p+'%';document.getElementById('progressText').textContent=p+'%';document.querySelectorAll('[data-nav]').forEach((b,i)=>b.classList.toggle('done',done(i)))}
    function refreshPage(i){save(false);render();go(i,false)}
    function setMode(i,mode){state.mode[i]=mode;refreshPage(i)}
    function openDetail(i,n){state.mode[i]='detail';state.detail[i]=n;refreshPage(i)}
    function selectDetail(i,n){state.detail[i]=n;refreshPage(i)}
    function selectEco(i,n){state.eco[i]=n;refreshPage(i)}
    function classifySource(i,n,type){state.sources[i]??={};state.sources[i][n]=type;const correct=animal().sourceCards[n][1]===type;save(false);render();go(i,false);toast(correct?'맞아요! 정보가 생긴 방법을 잘 구분했어요.':'한 번 더 생각해 보세요. 사진만으로 확인할 수 있을까요?')}
    function resetSources(i){state.sources[i]={};save(false);render();go(i,false);toast('정보 카드를 처음부터 다시 나눠 보세요.')}
    function startTimer(i){clearInterval(timerId);let left=30,clock=document.getElementById('clock'+i);clock.textContent='00:30';timerId=setInterval(()=>{left--;clock.textContent='00:'+String(left).padStart(2,'0');if(left<=0){clearInterval(timerId);toast('관찰 시간 끝! 이제 발견한 것을 적어 보세요.')}},1000)}
    function insertWord(i,w){const e=document.getElementById('a'+i),before=e.value&& !/\s$/.test(e.value)?' ':'';e.value+=before+w;writeAnswer(i,e);e.focus()}
    function writeAnswer(i,e){state.answers[i]=e.value;state.full='';state.privacyConfirmed=false;document.getElementById('count'+i).textContent=e.value.length+'자';document.getElementById('feed'+i).textContent=feedback(e.value);save()}
    function feedback(t){const n=t.trim().length;if(!n)return'';if(n<25)return'좋은 시작이에요. 색, 모양, 위치 중 하나를 더 자세히 적어 보세요.';if(!/같다|생각|보인다|있다|이다/.test(t))return'관찰한 사실 뒤에 그 모습을 보고 든 생각을 한 문장 보태 보세요.';return'사실과 생각이 함께 담겼어요. 사진을 다시 보며 정확한지 확인해 보세요.'}
    function resetPrivacyConfirmation(){state.privacyConfirmed=false;const check=document.getElementById('privacyConfirm'),btn=document.getElementById('submitBtn');if(check)check.checked=false;if(btn)btn.disabled=true}
    function updateTitle(e){state.title=e.value;resetPrivacyConfirmation();save()}
    function updateFinalText(e){state.full=e.value;resetPrivacyConfirmation();save()}
    function togglePrivacyConfirmation(e){state.privacyConfirmed=e.checked;const btn=document.getElementById('submitBtn'),status=document.getElementById('status');if(btn)btn.disabled=!e.checked;if(status)status.textContent=e.checked?'개인정보 점검을 확인했어요. 이제 제출할 수 있어요.':'';save()}
    function build(){return [1,2,3,4,5].map(i=>(state.answers[i]||'').trim()).filter(Boolean).join('\n\n')}
    function rebuild(){state.full=build();state.privacyConfirmed=false;save();render();go(7,false);toast('관찰 기록을 다시 모았어요.')}
    async function copyText(){try{await navigator.clipboard.writeText((state.title||animal().name+' 관찰 기록')+'\n\n'+(state.full||build()));toast('관찰문을 복사했어요.')}catch(e){toast('복사할 수 없어요. 글을 직접 선택해 주세요.')}}
    function downloadText(){const title=state.title||animal().name+' 관찰 기록',blob=new Blob([title+'\n\n'+(state.full||build())],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title.replace(/[\\/:*?"<>|]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
    function printText(){const title=state.title||animal().name+' 관찰 기록',text=state.full||build();document.getElementById('printArea').innerHTML=`<img src="../../literature/assets/oncuvate-brand-logo.png" alt="Oncuvate"><h1>${esc(title)}</h1><div class="meta">${esc(state.name)} · ${animal().group} · ${animal().name}</div>${text.split(/\n{2,}/).map(p=>`<p>${esc(p)}</p>`).join('')}`;window.print()}
    async function submitText(){const name=(entryInfo().studentNumber||state.name).trim(),story=(state.full||build()).trim(),status=document.getElementById('status'),btn=document.getElementById('submitBtn');if(!name){status.textContent='학생번호 또는 이름을 먼저 입력해 주세요.';go(0);return}if(!story){status.textContent='제출할 관찰 기록이 아직 없어요.';return}if(!state.privacyConfirmed){status.textContent='개인정보가 없는지 확인하고 체크해 주세요.';document.getElementById('privacyConfirm')?.focus();return}btn.disabled=true;btn.textContent='서버에 저장하는 중…';status.textContent='단계별 기록과 완성 글을 저장하고 있어요.';const success=await syncServer('completed');if(success){btn.textContent='제출 완료';status.textContent='수업 기록과 관찰문이 서버에 저장됐어요.'}else{btn.disabled=false;btn.textContent='확인하고 다시 제출하기';status.textContent='글은 이 기기에 안전하게 저장되어 있어요. 서버 연결 후 다시 제출해 주세요.'}}
    function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(toastId);toastId=setTimeout(()=>e.classList.remove('on'),1900)}
    render();
  </script>
  <script src="../../lesson-bridge.js"></script>
</body>
</html>
