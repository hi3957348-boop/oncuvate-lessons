<!doctype html>

  <style>
    :root{--v950:#24144f;--v900:#35206f;--v800:#4b24a5;--v700:#5932b6;--v200:#d9cff5;--v050:#f8f6fd;--cyan:#4bc9dc;--ink:#29243a;--muted:#777187;--paper:#fffefb;--line:#e8e3f3;--font:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:linear-gradient(145deg,var(--v950),var(--v700) 68%,#356aad);color:var(--ink);font-family:var(--font)}main{width:min(760px,100%);margin:auto}.brand{display:block;width:180px;margin:8px auto 24px}.brand img{display:block;width:100%;height:auto}.panel{padding:clamp(25px,5vw,42px);border:1px solid rgba(255,255,255,.5);border-radius:26px;background:var(--paper);box-shadow:0 20px 55px rgba(25,13,62,.32)}.eyebrow{margin:0;color:var(--v800);font-size:11px;font-weight:900;letter-spacing:.13em}.panel h1{margin:8px 0 7px;font-size:clamp(29px,6vw,43px);letter-spacing:-.045em}.intro{margin:0;color:var(--muted);line-height:1.75}.lessons{display:grid;gap:13px;margin-top:26px}.lesson{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:98px;padding:18px 20px;border:2px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#fff,var(--v050));color:var(--ink);text-decoration:none;transition:.18s}.lesson:hover{border-color:var(--cyan);transform:translateY(-2px)}.lesson strong{display:block;color:var(--v900);font-size:18px}.lesson span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.arrow{flex:0 0 auto;color:var(--v800);font-size:24px;font-weight:900}.notice{margin:20px 0 0;padding:12px 14px;border-left:4px solid var(--cyan);border-radius:0 12px 12px 0;background:#effbfd;color:#34525a;font-size:12px}@media(max-width:520px){body{padding:18px}.lesson{align-items:flex-start}.brand{width:150px}}
  </style>
</head>
<body><main><a class="brand" href="/" aria-label="Oncuvate 홈"><img src="../literature/assets/oncuvate-brand-logo.png" alt="Oncuvate"></a><section class="panel"><p class="eyebrow">ONCUVATE · LIVE PILOT</p><h1>강사 연동 파일럿</h1><p class="intro">강사가 만든 5자리 룸코드로 학생과 실시간 연결합니다. 다른 컴퓨터와 태블릿에서도 같은 주소로 바로 참여할 수 있어요.</p><div class="lessons"><a class="lesson" href="./animal-persuasion/"><span><strong>동물 · 주장하는 글</strong><span>글 미러링 · 강사 수정 · 메시지 · 판서</span></span><b class="arrow" aria-hidden="true">→</b></a><a class="lesson" href="./midnight-museum/"><span><strong>젤리 디텍티브 · 자정의 박물관</strong><span>실시간 탐정 활동 · 강사 모니터링</span></span><b class="arrow" aria-hidden="true">→</b></a></div><p class="notice">룸코드는 만든 시점부터 3시간 동안만 사용할 수 있습니다.</p></section></main></body>
</html>
